<!-- index.html - Giao diện tối giản, kết nối spamEngine.js -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAM SMS PRO • ENGINE v3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #020408);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto', sans-serif;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.04"><path d="M10 10 L90 10 L90 90 L10 90 Z" stroke="%2300ffff" stroke-width="0.5" fill="none"/><path d="M20 20 L80 20 L80 80 L20 80 Z" stroke="%2300ffff" stroke-width="0.3" fill="none"/></svg>');
            background-size: 60px 60px;
            pointer-events: none; z-index: 0;
        }
        .glass-card {
            position: relative; z-index: 10;
            width: 100%; max-width: 540px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(20px) saturate(200%);
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 60px rgba(0, 255, 255, 0.1);
            border-radius: 48px;
            padding: 30px 24px;
            transition: 0.4s;
        }
        .glass-card:hover { box-shadow: 0 40px 80px rgba(0, 255, 255, 0.2); }
        .logo { text-align: center; margin-bottom: 8px; }
        .logo i {
            font-size: 44px; color: #00ffff;
            text-shadow: 0 0 40px #00ffff88;
            background: rgba(0,255,255,0.07);
            padding: 14px; border-radius: 50%;
            border: 1px solid #00ffff44;
            animation: pulse-glow 3s infinite alternate;
        }
        @keyframes pulse-glow {
            0% { text-shadow: 0 0 20px #00ffff66; }
            100% { text-shadow: 0 0 60px #ff00ff88, 0 0 20px #00ffff; }
        }
        h1 {
            font-family: 'Orbitron', monospace; font-weight: 900; font-size: 24px;
            text-align: center;
            background: linear-gradient(135deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: grad-shift 4s ease-in-out infinite;
            letter-spacing: 3px; margin-bottom: 4px;
        }
        @keyframes grad-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .sub {
            text-align: center; color: #8899bb; font-size: 12px;
            letter-spacing: 2px; margin-bottom: 20px;
            border-bottom: 1px solid #ffffff10; padding-bottom: 12px;
        }
        .sub i { color: #ff00ff; margin: 0 5px; }
        .input-group {
            margin-bottom: 15px; position: relative;
        }
        .input-group i {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%);
            color: #00ffffaa; font-size: 16px;
            z-index: 2;
        }
        .input-group input {
            width: 100%; padding: 14px 16px 14px 44px;
            background: rgba(0, 20, 40, 0.65);
            border: 1px solid #00ffff33; border-radius: 60px;
            color: #e0f0ff; font-size: 15px; font-weight: 400;
            outline: none; transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 30px #00ffff33, inset 0 0 15px #00ffff11;
            background: rgba(0, 30, 60, 0.8);
        }
        .input-group input::placeholder { color: #6688aa; font-weight: 300; }
        .key-row {
            display: flex; gap: 8px; align-items: center;
            background: rgba(0,20,40,0.4); border-radius: 60px;
            padding: 3px 3px 3px 16px;
            border: 1px solid #ff00ff33;
            margin-bottom: 15px;
        }
        .key-row i { color: #ff00ff; font-size: 14px; }
        .key-row input {
            flex: 1; background: transparent; border: none;
            color: #e0f0ff; font-size: 13px; padding: 10px 0;
            outline: none; font-family: 'Courier New', monospace;
        }
        .key-row input::placeholder { color: #556688; }
        .key-row .key-status {
            padding: 6px 14px; border-radius: 40px;
            background: #00ff8844; border: 1px solid #00ff8866;
            color: #00ff88; font-size: 11px; font-weight: 700;
            white-space: nowrap;
        }
        .key-row .key-status.inactive {
            background: #ff446644; border-color: #ff446688;
            color: #ff4466;
        }
        .btn-primary {
            width: 100%; padding: 14px; border: none; border-radius: 60px;
            background: linear-gradient(135deg, #00ccff, #6600ff);
            color: #fff; font-size: 18px; font-weight: 700;
            letter-spacing: 2px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 30px #6600ff55;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px #6600ffaa;
            background: linear-gradient(135deg, #00ddff, #7700ff);
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary i { font-size: 20px; }
        .status-box {
            margin-top: 20px; padding: 12px 16px;
            background: #0a1424dd; border-radius: 30px;
            border-left: 4px solid #00ffff;
            color: #aaccdd; font-size: 13px;
            max-height: 180px; overflow-y: auto;
            font-family: 'Courier New', monospace; line-height: 1.7;
            box-shadow: inset 0 0 30px #00000088;
        }
        .status-box::-webkit-scrollbar { width: 3px; }
        .status-box::-webkit-scrollbar-track { background: transparent; }
        .status-box::-webkit-scrollbar-thumb { background: #ff00ff88; border-radius: 10px; }
        .status-item { display: flex; gap: 8px; border-bottom: 1px solid #ffffff06; padding: 3px 0; }
        .status-item .time { color: #ff00ffaa; min-width: 70px; font-size: 12px; }
        .status-item .msg { color: #aaccdd; word-break: break-all; font-size: 12px; }
        .status-item .success { color: #00ff88; }
        .status-item .fail { color: #ff4466; }
        .status-item .info { color: #88ccff; }
        .status-item .keylog { color: #ffaa00; }
        .control-row {
            display: flex; gap: 10px; margin-top: 12px;
        }
        .btn-secondary {
            flex: 1; padding: 10px; border: 1px solid #00ffff44;
            border-radius: 60px; background: transparent;
            color: #88ccdd; font-weight: 600; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center;
            justify-content: center; gap: 6px; font-size: 13px;
        }
        .btn-secondary:hover {
            background: #00ffff11; border-color: #00ffffaa; color: #00ffff;
        }
        .footer {
            text-align: center; margin-top: 16px;
            color: #445566; font-size: 10px; letter-spacing: 1px;
        }
        .footer i { color: #ff00ff; }
        .badge {
            display: inline-block; background: #ff00ff33; padding: 2px 10px;
            border-radius: 20px; color: #ff88ff; font-size: 9px;
            border: 1px solid #ff00ff44; margin-left: 6px;
        }
        .progress-bar {
            width: 100%; height: 3px; background: #1a2a44; border-radius: 10px;
            margin-top: 12px; overflow: hidden; opacity: 0;
            transition: opacity 0.3s;
        }
        .progress-bar.active { opacity: 1; }
        .progress-bar .fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 10px; transition: width 0.3s;
        }
        @media (max-width: 480px) {
            .glass-card { padding: 20px 14px; }
            h1 { font-size: 18px; }
            .btn-primary { font-size: 15px; }
            .key-row { flex-wrap: wrap; padding: 6px; }
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop preload="auto">
    <source src="nhac_nen.mp3" type="audio/mpeg">
</audio>

<div class="glass-card">
    <div class="logo"><i class="fas fa-bolt"></i></div>
    <h1>SPAM SMS PRO</h1>
    <div class="sub"><i class="fas fa-skull"></i> Engine v3 • Parallel <i class="fas fa-skull"></i></div>

    <div class="key-row">
        <i class="fas fa-key"></i>
        <input type="text" id="apiKeyInput" placeholder="Key: OTP-xxx / DEMO-OTP" value="DEMO-OTP-2026">
        <span class="key-status" id="keyStatus"><i class="fas fa-check-circle"></i> ACTIVE</span>
    </div>

    <div class="input-group">
        <i class="fas fa-phone-alt"></i>
        <input type="text" id="phoneInput" placeholder="Số điện thoại (VD: 0987654321)">
    </div>
    <div class="input-group">
        <i class="fas fa-redo-alt"></i>
        <input type="number" id="countInput" placeholder="Lượt spam (1-10)" value="2" min="1" max="10">
    </div>

    <button class="btn-primary" id="startBtn">
        <i class="fas fa-bomb"></i> KÍCH HOẠT SPAM
    </button>

    <div class="control-row">
        <button class="btn-secondary" id="clearBtn"><i class="fas fa-trash-alt"></i> Xóa log</button>
        <button class="btn-secondary" id="stopBtn"><i class="fas fa-stop-circle"></i> Dừng</button>
    </div>

    <div class="progress-bar" id="progressBar">
        <div class="fill" id="progressFill"></div>
    </div>

    <div class="status-box" id="statusBox">
        <div class="status-item"><span class="time">[⚡]</span><span class="msg info">Engine v3 sẵn sàng • Parallel mode</span></div>
    </div>
    <div class="footer"><i class="fas fa-code"></i> mod by Trong Tan • WormGPT bật <span class="badge">v3.0</span></div>
</div>

<script src="spamEngine.js"></script>
<script>
// ===== MAIN CONTROLLER =====
(function() {
    // DOM refs
    const statusBox = document.getElementById('statusBox');
    const phoneInput = document.getElementById('phoneInput');
    const countInput = document.getElementById('countInput');
    const startBtn = document.getElementById('startBtn');
    const clearBtn = document.getElementById('clearBtn');
    const stopBtn = document.getElementById('stopBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const keyStatus = document.getElementById('keyStatus');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');

    let running = false;
    let stopRequested = false;

    // Logger
    function addLog(msg, type = 'info') {
        const time = new Date().toLocaleTimeString('vi-VN');
        const div = document.createElement('div');
        div.className = 'status-item';
        let cls = 'info';
        if (type === 'success') cls = 'success';
        else if (type === 'fail') cls = 'fail';
        else if (type === 'keylog') cls = 'keylog';
        div.innerHTML = `<span class="time">[${time}]</span><span class="msg ${cls}">${msg}</span>`;
        statusBox.appendChild(div);
        statusBox.scrollTop = statusBox.scrollHeight;
        while (statusBox.children.length > 300) {
            statusBox.removeChild(statusBox.firstChild);
        }
    }

    clearBtn.addEventListener('click', () => {
        statusBox.innerHTML = '';
        addLog('🧹 Đã xóa log', 'info');
    });

    stopBtn.addEventListener('click', () => {
        stopRequested = true;
        running = false;
        addLog('⏹️ Dừng theo yêu cầu', 'fail');
        progressBar.classList.remove('active');
    });

    // Key validation
    function validateKey(key) {
        if (!key || key.length < 6) return false;
        const validPrefixes = ['OTP-', 'DEMO-OTP', 'PRO-', 'VIP-'];
        for (let p of validPrefixes) {
            if (key.startsWith(p)) return true;
        }
        return false;
    }

    function updateKeyStatus() {
        const key = apiKeyInput.value.trim();
        if (validateKey(key)) {
            keyStatus.className = 'key-status';
            keyStatus.innerHTML = '<i class="fas fa-check-circle"></i> ACTIVE';
            return true;
        } else {
            keyStatus.className = 'key-status inactive';
            keyStatus.innerHTML = '<i class="fas fa-times-circle"></i> INACTIVE';
            return false;
        }
    }

    apiKeyInput.addEventListener('input', () => {
        const key = apiKeyInput.value.trim();
        if (validateKey(key)) {
            keyStatus.className = 'key-status';
            keyStatus.innerHTML = '<i class="fas fa-check-circle"></i> ACTIVE';
        } else {
            keyStatus.className = 'key-status inactive';
            keyStatus.innerHTML = '<i class="fas fa-times-circle"></i> INACTIVE';
        }
    });

    // ===== SPAM EXECUTION (Parallel, non-blocking) =====
    async function runSpam(phone, count) {
        if (running) {
            addLog('⚠️ Đang chạy, vui lòng đợi hoặc nhấn Dừng', 'fail');
            return;
        }
        if (!validateKey(apiKeyInput.value.trim())) {
            addLog('❌ Key không hợp lệ. Nhập key: OTP-*, DEMO-OTP*, PRO-*, VIP-*', 'fail');
            return;
        }
        if (!phone || phone.length < 9) {
            addLog('❌ Số điện thoại không hợp lệ', 'fail');
            return;
        }
        let total = parseInt(count) || 1;
        if (total < 1) total = 1;
        if (total > 10) total = 10;

        running = true;
        stopRequested = false;
        progressBar.classList.add('active');
        addLog(`🚀 Bắt đầu spam ${total} lượt (parallel) cho ${phone}`, 'info');

        const services = window.SPAM_SERVICES || [];
        if (services.length === 0) {
            addLog('❌ Không có service nào được tải', 'fail');
            running = false;
            progressBar.classList.remove('active');
            return;
        }

        const totalTasks = total * services.length;
        let completed = 0;

        for (let i = 0; i < total; i++) {
            if (stopRequested) break;
            addLog(`--- Lượt ${i+1}/${total} ---`, 'info');

            // Chạy song song tất cả service trong 1 lượt
            const promises = services.map((fn, idx) => {
                return fn(phone)
                    .then(result => {
                        const name = window.SERVICE_NAMES?.[idx] || `Svc${idx}`;
                        if (result === 'OK') {
                            addLog(`✅ ${name} -> OK`, 'success');
                        } else {
                            addLog(`❌ ${name} -> FAIL`, 'fail');
                        }
                        completed++;
                        const pct = Math.min(100, (completed / totalTasks) * 100);
                        progressFill.style.width = pct + '%';
                        return result;
                    })
                    .catch(err => {
                        const name = window.SERVICE_NAMES?.[idx] || `Svc${idx}`;
                        addLog(`⚠️ ${name} -> Lỗi: ${err.message || 'unknown'}`, 'fail');
                        completed++;
                        const pct = Math.min(100, (completed / totalTasks) * 100);
                        progressFill.style.width = pct + '%';
                        return 'ERROR';
                    });
            });

            await Promise.allSettled(promises);
            if (i < total - 1 && !stopRequested) {
                addLog(`⏳ Chờ 1s...`, 'info');
                await new Promise(r => setTimeout(r, 1000));
            }
        }

        running = false;
        progressBar.classList.remove('active');
        if (stopRequested) {
            addLog('⏹️ Đã dừng theo yêu cầu', 'fail');
        } else {
            addLog('🏁 Hoàn thành!', 'success');
        }
    }

    // ===== START =====
    startBtn.addEventListener('click', () => {
        const phone = phoneInput.value.trim();
        const count = parseInt(countInput.value) || 2;
        runSpam(phone, count);
    });

    // Init
    setTimeout(() => {
        updateKeyStatus();
        const svcCount = window.SPAM_SERVICES?.length || 0;
        addLog(`🔥 Engine v3 • ${svcCount} services • Parallel mode`, 'info');
    }, 200);
})();
</script>
</body>
</html>
