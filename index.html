function showExam(v){$("exam").hidden=!v;out.hidden=v;chips.hidden=v;$("q").hidden=v}
function intro(){
  $("exam").innerHTML='<section class="g9"><h3>Chọn đề và đọc quy định</h3><div class="pad"><p><b>Chọn đề:</b></p>'+DE.map(function(d,k){return'<label class="ck"><input type="radio" name="de" value="'+k+'"'+(k===cur?' checked':'')+'> '+d.n+' ('+d.q.length+' câu, '+d.m+' phút)</label>'}).join('')+(carry?'<p class="bad">Lần thi trước bị gián đoạn (tải lại hoặc đóng trang), nên bài này bắt đầu với 1 vi phạm.</p>':'')+
  '<p><b>Trang này sẽ ghi nhận:</b></p><ul><li>Rời tab, thu nhỏ trình duyệt hoặc chuyển sang cửa sổ khác</li><li>Thoát chế độ toàn màn hình</li><li>Phím tắt mở công cụ nhà phát triển (F12, Ctrl+Shift+I/J/C), xem mã nguồn, lưu, in, chụp màn hình</li><li>Sao chép, cắt, dán, bấm chuột phải (các thao tác này bị chặn)</li><li>Mở DevTools (phát hiện qua việc trình duyệt bị tạm dừng gỡ lỗi), thu nhỏ hoặc chia đôi cửa sổ, in trang</li><li>Tải lại hoặc đóng trang giữa chừng</li><li>Có nhiều màn hình hoặc trình duyệt tự động hóa (chỉ ghi chú)</li></ul>'+
  '<p><b>Không ghi nhận:</b> camera, micro, nội dung màn hình, vị trí. Không gửi dữ liệu đi đâu: mọi thứ nằm trên thiết bị của bạn.</p>'+
  '<p><b>Quy tắc:</b> mỗi lần vi phạm, màn hình bài thi bị khóa cho đến khi bạn bấm tiếp tục (đồng hồ vẫn chạy). Đủ '+MAXV+' vi phạm thì bài tự nộp. Mọi ghi nhận hiện ngay ở bảng nhật ký bên cạnh bài làm và có trong báo cáo cuối bài.</p>'+
  '<p class="mut">Lưu ý: các biện pháp này chạy ngay trong trình duyệt nên chỉ hỗ trợ bạn tự ôn luyện trung thực, không thay thế giám thị thật. Trên điện thoại, toàn màn hình và kiểm tra DevTools có thể không hoạt động.</p>'+
  '<label class="ck"><input type="checkbox" id="agree"> Tôi đã đọc và đồng ý với những điều trên</label><button class="btn" id="go" disabled>Bắt đầu làm bài</button></div></section>';
  $("agree").onchange=function(){$("go").disabled=!this.checked};
  $("go").onclick=start;
}
function start(){
  cur=+document.querySelector('input[name=de]:checked').value;
  ex.qs=shuf(DE[cur].q.slice()).map(function(q){var o=shuf(q[2].map(function(t,k){return[t,k===q[3]]}));return[q[0],q[1],o.map(function(x){return x[0]}),o.findIndex(function(x){return x[1]}),q[4]]});
  ex.i=0;ex.ans=[];ex.log=[];ex.strikes=0;ex.t0=Date.now();ex.left=DE[cur].m*60;ex.w=window.innerWidth;ex.last=0;ex.dt=false;ex.fs=false;ex.on=true;
  var el=document.documentElement;
  if(el.requestFullscreen){try{var p=el.requestFullscreen();if(p&&p.catch)p.catch(function(){})}catch(e){}}
  try{sessionStorage.setItem("examOn","1")}catch(e){}
  if(carry){ex.strikes=1;ex.log.push({gio:new Date().toLocaleTimeString("vi-VN"),loai:"Tải lại hoặc đóng trang khi đang thi",chi_tiet:"Bài thi trước bị gián đoạn",tinh_vi_pham:true});carry=0}
  if(window.screen&&screen.isExtended)viol("Phát hiện nhiều màn hình","screen.isExtended = true",false);
  setTimeout(function(){if(ex.on&&!ex.fs&&el.requestFullscreen&&!("ontouchstart" in window))lock("Cần vào chế độ toàn màn hình để làm bài.")},1500);
  if(navigator.webdriver)viol("Trình duyệt tự động hóa","navigator.webdriver = true",false);
  draw();ex.tm=setInterval(tick,1000);
}
function viol(t,d,strike){
  if(!ex.on)return;
  var n=Date.now();if(n-ex.last<800)return;ex.last=n;
  var s=strike!==false;if(s)ex.strikes++;
  ex.log.push({gio:new Date().toLocaleTimeString("vi-VN"),loai:t,chi_tiet:d,tinh_vi_pham:s});
  if(s&&ex.strikes>=MAXV){finish("Tự nộp do đủ "+MAXV+" vi phạm");return}
  rl();if(s)lock("Vi phạm: "+t+".");
}
function rl(){
  var l=$("lg");if(!l)return;$("sc").textContent=ex.strikes;
  l.innerHTML=ex.log.length?ex.log.map(function(e){return'<li><span class="'+(e.tinh_vi_pham?'st':'')+'">'+e.gio+' '+(e.tinh_vi_pham?'Vi phạm':'Ghi chú')+':</span> '+esc(e.loai)+' ('+esc(e.chi_tiet)+')</li>'}).join(''):'<li class="mut">Chưa có ghi nhận nào.</li>';
}
function tick(){
  ex.left--;
  if(!("ontouchstart" in window)){
    var d=window.outerWidth-window.innerWidth>200||window.outerHeight-window.innerHeight>200;
    if(d&&!ex.dt)viol("Nghi mở DevTools","Kích thước cửa sổ lệch bất thường (chỉ là suy đoán)",false);
    ex.dt=d;
    var t0=performance.now();try{(new Function("debugger"))()}catch(e){}
    if(performance.now()-t0>150)viol("DevTools đang mở","Trình duyệt bị tạm dừng gỡ lỗi");
  }
  if(ex.left<=0){finish("Hết giờ");return}
  tm();
}
function tm(){var e=$("tm");if(e)e.textContent=Math.floor(ex.left/60)+":"+("0"+ex.left%60).slice(-2)}
function draw(){
  var q=ex.qs[ex.i],last=ex.i===ex.qs.length-1;
  var h='<div class="exgrid"><section class="g8"><h3>Câu '+(ex.i+1)+'/'+ex.qs.length+'<span id="tm" class="tm"></span></h3><div class="pad nosel"><p class="qt">'+esc(q[1])+'</p>';
  q[2].forEach(function(o,k){h+='<button class="opt'+(ex.ans[ex.i]===k?' sel':'')+'" data-k="'+k+'">'+"ABCD"[k]+'. '+esc(o)+'</button>'});
  h+='<div class="nav"><button class="btn ghost" id="pv"'+(ex.i?'':' disabled')+'>Câu trước</button>'+(last?'<button class="btn" id="sb">Nộp bài</button>':'<button class="btn" id="nx">Câu sau</button>')+'</div></div></section>'+
  '<section class="g9"><h3>Nhật ký giám sát</h3><div class="pad"><p class="mut">Vi phạm: <b id="sc">0</b>/'+MAXV+'</p><ul id="lg" class="lg"></ul></div></section></div>';
  $("exam").innerHTML=h;
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){ex.ans[ex.i]=+b.dataset.k;draw()}});
  if($("pv"))$("pv").onclick=function(){ex.i--;draw()};
  if($("nx"))$("nx").onclick=function(){ex.i++;draw()};
  if($("sb"))$("sb").onclick=function(){finish("Tự nộp bài")};
  rl();tm();
}
function finish(why){
  clearInterval(ex.tm);ex.on=false;$("lk").hidden=true;try{sessionStorage.removeItem("examOn")}catch(e){}
  if(document.fullscreenElement&&document.exitFullscreen){try{document.exitFullscreen().catch(function(){})}catch(e){}}
  var sc=0;ex.qs.forEach(function(q,i){if(ex.ans[i]===q[3])sc++});
  var rep={de:DE[cur].n,thoi_diem:new Date().toISOString(),ly_do_ket_thuc:why,diem:sc+"/"+ex.qs.length,thoi_gian_giay:Math.round((Date.now()-ex.t0)/1000),so_vi_pham:ex.strikes,nhat_ky:ex.log,tra_loi:ex.qs.map(function(q,i){return{cau:q[1],chon:ex.ans[i]==null?null:q[2][ex.ans[i]],dap_an:q[2][q[3]]}})};
  var js=JSON.stringify(rep,null,1);
  var h='<section class="g8"><h3>Kết quả: '+sc+'/'+ex.qs.length+' điểm</h3><div class="pad"><p>Kết thúc: <b>'+esc(why)+'</b>. Thời gian: '+rep.thoi_gian_giay+' giây. Vi phạm: <b class="'+(ex.strikes?'bad':'ok')+'">'+ex.strikes+'</b>.</p>'+
  '<p><b>Nhật ký giám sát đầy đủ</b></p><ul class="lg">'+(ex.log.length?ex.log.map(function(e){return'<li>'+e.gio+' ('+(e.tinh_vi_pham?'vi phạm':'ghi chú')+'): '+esc(e.loai)+' - '+esc(e.chi_tiet)+'</li>'}).join(''):'<li>Không có ghi nhận nào.</li>')+'</ul>'+
  '<p><b>Mã xác thực báo cáo (SHA-256):</b></p><p class="code" id="hs">Đang tạo...</p><p class="mut">Đổi bất kỳ nội dung nào của báo cáo thì mã này sẽ khác.</p>'+
  '<p><b>Xem lại đáp án</b></p>'+ex.qs.map(function(q,i){var ok=ex.ans[i]===q[3];return'<div class="rv"><b>Câu '+(i+1)+': '+esc(q[1])+'</b><br><span class="'+(ok?'ok':'bad')+'">'+(ok?'Đúng':'Sai')+'</span> - bạn chọn: '+(ex.ans[i]==null?'(bỏ trống)':esc(q[2][ex.ans[i]]))+'; đáp án: '+esc(q[2][q[3]])+'<br>'+esc(q[4])+' <span class="mut">Ôn lại: '+esc(q[0])+'</span></div>'}).join('')+
  '<div class="nav"><button class="btn ghost" id="dl">Tải báo cáo</button><button class="btn" id="again">Làm lại</button></div></div></section>';
  $("exam").innerHTML=h;
  var hs=$("hs");
  if(window.crypto&&crypto.subtle){crypto.subtle.digest("SHA-256",new TextEncoder().encode(js)).then(function(b){hs.textContent=Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")}).catch(function(){hs.textContent="Không tạo được mã"})}else hs.textContent="Cần HTTPS để tạo mã";
  $("dl").onclick=function(){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([js+"\nSHA-256: "+hs.textContent],{type:"text/plain"}));a.download="bao-cao-lam-bai.txt";a.click()}catch(e){}};
  $("again").onclick=intro;
  window.scrollTo(0,0);
}
document.addEventListener("visibilitychange",function(){if(document.hidden)viol("Rời tab hoặc thu nhỏ trình duyệt","Trang bị ẩn")});
window.addEventListener("blur",function(){viol("Cửa sổ mất tiêu điểm","Chuyển sang ứng dụng hoặc cửa sổ khác")});
document.addEventListener("fullscreenchange",function(){if(document.fullscreenElement)ex.fs=true;else if(ex.fs&&ex.on){ex.fs=false;viol("Thoát toàn màn hình","Đã thoát chế độ toàn màn hình")}});
var CN={copy:"Sao chép",cut:"Cắt",paste:"Dán",contextmenu:"Bấm chuột phải"};
Object.keys(CN).forEach(function(t){document.addEventListener(t,function(e){if(ex.on){e.preventDefault();viol(CN[t],"Thao tác đã bị chặn")}})});
document.addEventListener("keydown",function(e){
  if(!ex.on)return;var k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(e.key==="F12"||(c&&e.shiftKey&&"ijck".indexOf(k)>-1)||(c&&"uspfg".indexOf(k)>-1&&k.length===1)){e.preventDefault();viol("Phím tắt công cụ, mã nguồn, lưu hoặc in",(c?"Ctrl+":"")+(e.shiftKey?"Shift+":"")+e.key)}
});
document.addEventListener("keyup",function(e){if(e.key==="PrintScreen")viol("Chụp màn hình","Phím PrintScreen")});
window.addEventListener("beforeprint",function(){viol("In trang","Lệnh in")});
window.addEventListener("resize",function(){if(ex.on&&ex.w&&!("ontouchstart" in window)&&window.innerWidth<ex.w*0.75)viol("Thu nhỏ hoặc chia đôi cửa sổ","Chiều rộng giảm hơn 25%")});
["dragstart","selectstart"].forEach(function(t){document.addEventListener(t,function(e){if(ex.on)e.preventDefault()})});
window.addEventListener("beforeunload",function(e){if(ex.on){e.preventDefault();e.returnValue=""}});
</script>
</body>
</html>
