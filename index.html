    n++;
    if(s[0]!==last){last=s[0];h+='<h2 class="grade g'+s[0]+'">Lớp '+s[0]+'</h2>'}
    h+='<section id="s'+i+'" class="g'+s[0]+'"><h3>'+esc(s[1])+'</h3>';
    rows.forEach(function(r){
      h+='<div class="row'+(r[2]?' key':'')+'"><div class="lab">'+hi(r[0])+'</div><div class="f">'+hi(r[1])+'</div></div>';
    });
    h+='</section>';
    c+='<a class="chip g'+s[0]+'" href="#s'+i+'">'+esc(s[1].split(" (")[0].split(" ax")[0])+'</a>';
  });
  out.innerHTML=h||'<p class="empty">Không tìm thấy. Thử từ khóa ngắn hơn.</p>';
  chips.innerHTML=c;
}
document.querySelectorAll(".tab").forEach(function(b){
  b.addEventListener("click",function(){
    grade=b.dataset.g;
    document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
    render();
  });
});
document.getElementById("q").addEventListener("input",function(e){term=e.target.value.trim().toLowerCase();render()});
render();
</script>
