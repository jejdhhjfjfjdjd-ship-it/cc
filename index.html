<!-- index.html - Giao diện chính -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAM SMS PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #020408);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto', sans-serif;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.05"><path d="M10 10 L90 10 L90 90 L10 90 Z" stroke="%2300ffff" stroke-width="0.5" fill="none"/><path d="M20 20 L80 20 L80 80 L20 80 Z" stroke="%2300ffff" stroke-width="0.3" fill="none"/></svg>');
            background-size: 60px 60px;
            pointer-events: none; z-index: 0;
        }
        .glass-card {
            position: relative; z-index: 10;
            width: 100%; max-width: 520px;
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 255, 255, 0.1);
            border-radius: 40px;
            padding: 35px 25px;
            transition: 0.3s;
        }
        .glass-card:hover { box-shadow: 0 40px 80px rgba(0, 255, 255, 0.2); }
        .logo { text-align: center; margin-bottom: 15px; }
        .logo i {
            font-size: 48px; color: #00ffff;
            text-shadow: 0 0 30px #00ffff77;
            background: rgba(0,255,255,0.08);
            padding: 15px; border-radius: 50%;
            border: 1px solid #00ffff33;
        }
        h1 {
            font-family: 'Orbitron', monospace; font-weight: 900; font-size: 26px;
            text-align: center;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px #00ffff55;
            letter-spacing: 3px; margin-bottom: 5px;
        }
        .sub {
            text-align: center; color: #8899bb; font-size: 13px;
            letter-spacing: 2px; margin-bottom: 25px;
            border-bottom: 1px solid #ffffff10; padding-bottom: 15px;
        }
        .sub i { color: #ff00ff; margin: 0 5px; }
        .input-group {
            margin-bottom: 20px; position: relative;
        }
        .input-group i {
            position: absolute; left: 18px; top: 50%;
            transform: translateY(-50%);
            color: #00ffffaa; font-size: 18px;
        }
        .input-group input {
            width: 100%; padding: 16px 20px 16px 50px;
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid #00ffff33; border-radius: 60px;
            color: #e0f0ff; font-size: 16px; font-weight: 400;
            outline: none; transition: 0.3s;
            backdrop-filter: blur(4px);
        }
        .input-group input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 30px #00ffff22, inset 0 0 15px #00ffff11;
            background: rgba(0, 30, 60, 0.7);
        }
        .input-group input::placeholder { color: #6688aa; font-weight: 300; }
        .btn-primary {
            width: 100%; padding: 16px; border: none; border-radius: 60px;
            background: linear-gradient(135deg, #00ccff, #0066ff);
            color: #fff; font-size: 20px; font-weight: 700;
            letter-spacing: 2px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 30px #0066ff55;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px #0066ffaa;
            background: linear-gradient(135deg, #00ddff, #0077ff);
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary i { font-size: 22px; }
        .status-box {
            margin-top: 25px; padding: 15px 18px;
            background: #0a1424cc; border-radius: 30px;
            border-left: 4px solid #00ffff;
            color: #aaccdd; font-size: 14px;
            max-height: 180px; overflow-y: auto;
            font-family: 'Courier New', monospace; line-height: 1.7;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 0 30px #00000066;
        }
        .status-box::-webkit-scrollbar { width: 4px; }
        .status-box::-webkit-scrollbar-track { background: transparent; }
        .status-box::-webkit-scrollbar-thumb { background: #00ffff66; border-radius: 10px; }
        .status-item { display: flex; gap: 10px; border-bottom: 1px solid #ffffff08; padding: 4px 0; }
        .status-item .time { color: #ff00ffaa; min-width: 70px; }
        .status-item .msg { color: #aaccdd; word-break: break-all; }
        .status-item .success { color: #00ff88; }
        .status-item .fail { color: #ff4466; }
        .status-item .info { color: #88ccff; }
        .control-row {
            display: flex; gap: 12px; margin-top: 15px;
        }
        .btn-secondary {
            flex: 1; padding: 12px; border: 1px solid #00ffff44;
            border-radius: 60px; background: transparent;
            color: #88ccdd; font-weight: 600; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center;
            justify-content: center; gap: 8px;
            backdrop-filter: blur(4px);
        }
        .btn-secondary:hover {
            background: #00ffff11; border-color: #00ffffaa; color: #00ffff;
        }
        .footer {
            text-align: center; margin-top: 20px;
            color: #445566; font-size: 11px; letter-spacing: 1px;
        }
        .footer i { color: #ff00ff; }
        .music-control {
            position: fixed; bottom: 25px; right: 25px; z-index: 999;
            background: #0a1424dd; backdrop-filter: blur(12px);
            border-radius: 60px; padding: 10px 18px;
            border: 1px solid #00ffff44;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px #000000aa;
        }
        .music-control button {
            background: transparent; border: none; color: #00ffff;
            font-size: 22px; cursor: pointer; transition: 0.3s;
        }
        .music-control button:hover { color: #ff00ff; text-shadow: 0 0 20px #ff00ff77; }
        .music-control span { color: #8899bb; font-size: 12px; font-weight: 300; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (max-width: 480px) {
            .glass-card { padding: 25px 15px; }
            h1 { font-size: 20px; }
            .btn-primary { font-size: 16px; }
        }
        .warning {
            background: #ff00ff11; border: 1px solid #ff00ff44;
            border-radius: 30px; padding: 10px 15px;
            margin-bottom: 20px; color: #cc88ff;
            font-size: 12px; text-align: center;
        }
        .warning i { color: #ff00ff; margin-right: 8px; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="nhac_nen.mp3" type="audio/mpeg">
    </audio>

    <div class="music-control" id="musicControl">
        <button id="playBtn"><i class="fas fa-play"></i></button>
        <span>🎵 Cyber Beats</span>
    </div>

    <div class="glass-card">
        <div class="logo"><i class="fas fa-bolt"></i></div>
        <h1>SPAM SMS PRO</h1>
        <div class="sub"><i class="fas fa-skull"></i> Tấn công OTP hàng loạt <i class="fas fa-skull"></i></div>

        <div class="warning">
            <i class="fas fa-exclamation-triangle"></i> Dành cho mục đích kiểm thử bảo mật hợp pháp
        </div>

        <div class="input-group">
            <i class="fas fa-phone-alt"></i>
            <input type="text" id="phoneInput" placeholder="Nhập số điện thoại (VD: 0987654321)">
        </div>
        <div class="input-group">
            <i class="fas fa-redo-alt"></i>
            <input type="number" id="countInput" placeholder="Số lần spam" value="2" min="1" max="10">
        </div>

        <button class="btn-primary" id="startBtn">
            <i class="fas fa-bomb"></i> KÍCH HOẠT SPAM
        </button>

        <div class="control-row">
            <button class="btn-secondary" id="clearBtn"><i class="fas fa-trash-alt"></i> Xóa log</button>
            <button class="btn-secondary" id="stopBtn"><i class="fas fa-stop-circle"></i> Dừng</button>
        </div>

        <div class="status-box" id="statusBox">
            <div class="status-item"><span class="time">[⚡]</span><span class="msg info">Sẵn sàng tấn công...</span></div>
        </div>
        <div class="footer"><i class="fas fa-code"></i> mod by Trong Tan • WormGPT bật</div>
    </div>

    <script src="spam.js"></script>
</body>
</html>
