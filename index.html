<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soạn Văn 9 — Tấn</title>
<style>
:root{
  --bg:#0a0e14;--bg-2:#0f1620;--panel:#131b27;--panel-2:#1a2434;
  --border:#22304a;--border-2:#2d4060;--text:#e6edf7;--text-dim:#8ba0bd;
  --text-mute:#5a7093;--accent:#4fd1c5;--accent-2:#7c9cf5;
  --accent-glow:rgba(79,209,197,.15);--truoc:#f6c177;--doc:#7c9cf5;--sau:#4fd1c5;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 500px at 80% -10%,rgba(124,156,245,.10),transparent 60%),radial-gradient(700px 400px at 10% 110%,rgba(79,209,197,.08),transparent 60%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;display:grid;grid-template-columns:340px 1fr;height:100vh}

/* SIDEBAR */
.sidebar{background:linear-gradient(180deg,var(--bg-2),var(--bg));border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:24px 22px 20px;border-bottom:1px solid var(--border);position:relative}
.brand::after{content:"";position:absolute;left:22px;right:22px;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6}
.brand h1{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{font-size:11.5px;color:var(--text-mute);margin-top:5px;letter-spacing:.6px;text-transform:uppercase}
.brand .badge{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--accent-glow);color:var(--accent);border:1px solid rgba(79,209,197,.3)}
.search-wrap{padding:14px 16px;border-bottom:1px solid var(--border)}
.search{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 14px;font-size:13.5px;font-family:var(--sans);outline:none;transition:border .2s,box-shadow .2s}
.search::placeholder{color:var(--text-mute)}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.list{flex:1;overflow-y:auto;padding:10px 8px 24px}
.list::-webkit-scrollbar{width:8px}
.list::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
.list::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:transparent;border:none;color:var(--text-dim);padding:12px 14px;border-radius:9px;cursor:pointer;font-family:var(--sans);font-size:13.5px;line-height:1.4;margin-bottom:2px;transition:background .15s,color .15s,transform .1s;position:relative}
.item:hover{background:var(--panel);color:var(--text)}
.item:active{transform:scale(.99)}
.item.active{background:linear-gradient(90deg,var(--accent-glow),transparent);color:var(--accent);font-weight:500}
.item.active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;background:var(--accent);border-radius:2px}
.item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .count{flex-shrink:0;font-size:10.5px;color:var(--text-mute);background:var(--panel-2);padding:2px 7px;border-radius:10px;min-width:24px;text-align:center}
.item.active .count{color:var(--accent);background:var(--accent-glow)}
.item.active .count{color:var(--accent);background:var(--accent-glow)}

/* MAIN */
.main{overflow-y:auto;padding:48px 60px 100px;scroll-behavior:smooth}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px}
.main::-webkit-scrollbar-thumb:hover{background:var(--accent)}

.welcome{max-width:760px;margin:10vh auto 0;text-align:center}
.welcome .logo{font-family:var(--serif);font-size:52px;font-weight:600;letter-spacing:-.8px;background:linear-gradient(120deg,var(--accent),var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px;line-height:1.1}
.welcome p.sub{color:var(--text-dim);font-size:16px;max-width:540px;margin:0 auto 44px;line-height:1.75}
.stats{display:flex;gap:48px;justify-content:center;margin-top:44px;flex-wrap:wrap}
.stat{text-align:center}
.stat .num{font-family:var(--serif);font-size:36px;color:var(--accent);font-weight:600;line-height:1}
.stat .lbl{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.2px;margin-top:6px}
.welcome .hint{margin-top:56px;color:var(--text-mute);font-size:12.5px}
.welcome .hint kbd{background:var(--panel);border:1px solid var(--border);padding:2px 7px;border-radius:5px;font-family:var(--sans);color:var(--text-dim);font-size:11.5px}

.article{max-width:840px;margin:0 auto;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.article h2{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1.22;letter-spacing:-.4px;margin-bottom:10px;color:var(--text)}
.article .meta{display:flex;align-items:center;gap:12px;color:var(--text-mute);font-size:12px;margin-bottom:40px;padding-bottom:26px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.article .meta a{color:var(--text-mute);text-decoration:none;transition:color .15s;border-bottom:1px dashed transparent}
.article .meta a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.article .meta .dot{opacity:.35}

.section{margin-bottom:48px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.section-head .marker{width:4px;height:22px;border-radius:2px}
.section-head .label{font-size:12px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase}
.s-truoc .marker,.s-truoc .label{background:var(--truoc);color:var(--truoc)}
.s-doc .marker,.s-doc .label{background:var(--doc);color:var(--doc)}
.s-sau .marker,.s-sau .label{background:var(--sau);color:var(--sau)}

.qa{background:linear-gradient(180deg,var(--panel),var(--bg-2));border:1px solid var(--border);border-radius:14px;padding:24px 28px;margin-bottom:14px;transition:border-color .2s,transform .15s;position:relative}
.qa:hover{border-color:var(--border-2)}
.qa .q{font-family:var(--serif);font-size:17.5px;font-weight:600;line-height:1.5;color:var(--text);margin-bottom:16px;padding-right:44px}
.qa .q .num{display:inline-block;color:var(--text-mute);font-size:14px;margin-right:6px;font-family:var(--sans);font-weight:500}
.qa .a{color:var(--text-dim);font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.copy-btn{position:absolute;top:18px;right:18px;background:transparent;border:1px solid var(--border);color:var(--text-mute);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;opacity:0}
.qa:hover .copy-btn{opacity:1}
.copy-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.copy-btn.done{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}

/* Loading + Error */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:20px;color:var(--text-dim)}
.spinner{width:44px;height:44px;border:3px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{max-width:560px;margin:15vh auto;text-align:center;padding:32px;background:var(--panel);border:1px solid var(--border);border-radius:16px}
.error h3{color:var(--truoc);margin-bottom:12px;font-family:var(--serif);font-size:22px}
.error p{color:var(--text-dim);line-height:1.7;margin-bottom:10px}
.error code{background:var(--bg);padding:3px 8px;border-radius:5px;color:var(--accent);font-size:13px}

/* Mobile */
.menu-toggle{display:none;position:fixed;top:14px;left:14px;z-index:100;width:44px;height:44px;border-radius:11px;background:var(--panel);border:1px solid var(--border);color:var(--text);cursor:pointer;align-items:center;justify-content:center;font-size:20px}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:50}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:300px;z-index:60;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:flex}
  .backdrop.show{display:block}
  .main{padding:74px 20px 80px}
  .article h2{font-size:27px}
  .welcome .logo{font-size:34px}
  .stats{gap:32px}
  .stat .num{font-size:28px}
  .qa{padding:20px 22px}
  .qa .q{font-size:15.5px;padding-right:0}
  .copy-btn{position:static;opacity:1;margin-top:14px}
}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
<div class="backdrop" id="backdrop"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>Soạn Văn 9</h1>
      <p>Tấn · Kết nối tri thức</p>
      <div class="badge">Ngữ văn 9 · HK1 + HK2</div>
    </div>
    <div class="search-wrap">
      <input class="search" id="search" type="text" placeholder="Tìm bài, câu hỏi, từ khóa...">
    </div>
    <div class="list" id="list"></div>
  </aside>

  <main class="main" id="main">
    <div class="loading">
      <div class="spinner"></div>
      <div>Đang tải dữ liệu...</div>
    </div>
  </main>
</div>

<script>
(function(){
  const DATA_FILE = 'soan-van-9-final.json';
  const $list = document.getElementById('list');
  const $main = document.getElementById('main');
  const $search = document.getElementById('search');
  const $menuToggle = document.getElementById('menuToggle');
  const $backdrop = document.getElementById('backdrop');
  const $sidebar = document.getElementById('sidebar');

  const SECTION_LABEL = {truoc:"Trước khi đọc", doc:"Đọc văn bản", sau:"Sau khi đọc"};
  const SECTION_ORDER = ["truoc","doc","sau"];

  let articles = [];

  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function showError(msg){
    $main.innerHTML = `<div class="error">
      <h3>Không tải được dữ liệu</h3>
      <p>${msg}</p>
      <p style="margin-top:18px">Kiểm tra:</p>
      <p>1. File <code>${DATA_FILE}</code> có nằm cùng thư mục với <code>index.html</code> không?</p>
      <p>2. Nếu đang mở file trực tiếp (<code>file://</code>), trình duyệt có thể chặn fetch.</p>
      <p>→ Chạy local server: <code>python -m http.server 8080</code> rồi mở <code>http://localhost:8080</code></p>
      <p>→ Hoặc dùng Firefox (cho phép fetch file:// cùng thư mục).</p>
    </div>`;
  }

  function renderWelcome(){
    const totalQA = articles.reduce((s,b)=>s+b.total,0);
    $main.innerHTML = `<div class="welcome">
      <div class="logo">Soạn Văn 9</div>
      <p class="sub">Tuyển tập đầy đủ lời giải cho các bài soạn Ngữ Văn lớp 9 — bộ Kết nối tri thức với cuộc sống. Chọn bài bên trái để bắt đầu.</p>
      <div class="stats">
        <div class="stat"><div class="num">${articles.length}</div><div class="lbl">Bài soạn</div></div>
        <div class="stat"><div class="num">${totalQA}</div><div class="lbl">Câu hỏi</div></div>
        <div class="stat"><div class="num">3</div><div class="lbl">Phần chính</div></div>
      </div>
      <div class="hint">Nhấn <kbd>Ctrl</kbd> + <kbd>F</kbd> trong sidebar để tìm nhanh · Hover vào câu hỏi để copy</div>
    </div>`;
  }

  function renderList(filter=""){
    const q = filter.trim().toLowerCase();
    const items = articles.map((b,i)=>{
      if (!q) return {b,i};
      const hay = (b.title+" "+b.fullTitle+" "+b.qa.map(x=>(x.question||x.heading||"")+" "+(x.answer||"")).join(" ")).toLowerCase();
      return hay.includes(q) ? {b,i} : null;
    }).filter(Boolean);

    if (!items.length){
      $list.innerHTML = `<div style="padding:32px 16px;text-align:center;color:var(--text-mute);font-size:13px;line-height:1.6">Không tìm thấy bài nào<br><span style="font-size:11px;opacity:.6">Thử từ khóa khác</span></div>`;
      return;
    }
    $list.innerHTML = items.map(({b,i})=>
      `<button class="item" data-idx="${i}">
        <span class="title">${esc(b.title)}</span>
        <span class="count">${b.total}</span>
      </button>`
    ).join('');
    $list.querySelectorAll('.item').forEach(el=>{
      el.addEventListener('click',()=>{
        openArticle(parseInt(el.dataset.idx,10));
        if (window.innerWidth<=860) closeSidebar();
      });
    });
  }

  function renderQA(x, idx){
    const head = x.section==="doc"
      ? `<div class="q">${x.num?`<span class="num">${x.num}.</span>`:''}${esc(x.heading||'')}</div>`
      : `<div class="q">${x.num?`<span class="num">Câu ${x.num}.</span>`:''}${esc(x.question||'')}</div>`;
    return `<div class="qa">
      <button class="copy-btn" data-copy="${idx}" title="Copy câu hỏi + trả lời" aria-label="Copy">⧉</button>
      ${head}
      <div class="a">${esc(x.answer||'')}</div>
    </div>`;
  }

  function openArticle(i){
    const a = articles[i];
    if (!a) return;
    const groups = {truoc:[],doc:[],sau:[]};
    a.qa.forEach(x=>{ if(groups[x.section]) groups[x.section].push(x); });

    let html = `<div class="article">
      <h2>${esc(a.title)}</h2>
      <div class="meta">
        <span>${a.total} câu hỏi</span>
        <span class="dot">•</span>
        <a href="${esc(a.url)}" target="_blank" rel="noopener">Nguồn: vietjack.com ↗</a>
      </div>`;

    const store = [];
    let gi = 0;
    SECTION_ORDER.forEach(sec=>{
      if (!groups[sec].length) return;
      html += `<section class="section s-${sec}">
        <div class="section-head"><div class="marker "></div><div document class="label.addEventListener">${SECTION_LABEL[sec]('}</div></div>`;
      groups[seckey].forEach(x=>{
down        html += renderQA(x, gi++);
        store.push(x);
      });
      html += `</section>`;
    });
    html += `</div>`;
    $main.innerHTML = html;
    $main.scrollTop = 0;

    document.querySelectorAll('.item').forEach(el=>el.classList.toggle('active', parseInt(el.dataset.idx,10)===i));

    $main.querySelectorAll('.copy-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const x = store[parseInt(btn.dataset.copy,10)];
        const txt = ((x.question||x.heading||'') + "\n\n" + (x.answer||'')).trim();
        const done = ()=>{ btn.classList.add('done'); btn.textContent = "✓"; setTimeout(()=>{btn.classList.remove('done');btn.textContent="⧉";},1300); };
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
        } else fallbackCopy(txt, done);
      });
    });
    try{ localStorage.setItem('sv9_last', String(i)); }catch(e){}
  }

  function fallbackCopy(text, cb){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); cb&&cb(); }catch(e){}
    document.body.removeChild(ta);
  }

  function closeSidebar(){
    $sidebar.classList.remove('open');
    $backdrop.classList.remove('show');
  }

  // Bind UI
  $search.addEventListener('input', ()=>renderList($search.value));
  $menuToggle.addEventListener('click', ()=>{
    $sidebar.classList.toggle('open');
    $backdrop.classList.toggle('show');
  });
  $backdrop.addEventListener('click', closeSidebar);
', e=>{
    if (e.key === '/' && document.activeElement !== $search){
      e.preventDefault(); $search.focus();
    }
    if (e.key === 'Escape'){ $search.blur(); closeSidebar(); }
  });

  // Load data
  fetch(DATA_FILE)
    .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data => {
      articles = data;
      renderWelcome();
      renderList("");
      try{
        const last = localStorage.getItem('sv9_last');
        if (last !== null && articles[parseInt(last,10)]) openArticle(parseInt(last,10));
      }catch(e){}
    })
    .catch(err => {
      console.error(err);
      showError('Lỗi: ' + err.message);
    });
})();
</script>

</body>
</html>
