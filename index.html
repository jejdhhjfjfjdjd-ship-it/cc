<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soạn Văn 9 — Tấn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fa;
  --bg-2:#eef2f7;
  --surface:#ffffff;
  --border:#e2e8f0;
  --border-2:#cbd5e1;
  --text:#0f172a;
  --text-2:#334155;
  --text-dim:#64748b;
  --text-mute:#94a3b8;
  --accent:#0056b3;
  --accent-2:#0a7ddb;
  --accent-hover:#004494;
  --accent-soft:#e6f0fa;
  --truoc:#d97706;
  --truoc-bg:#fef3c7;
  --doc:#2563eb;
  --doc-bg:#dbeafe;
  --sau:#059669;
  --sau-bg:#d1fae5;
  --serif:'Lora','Georgia',serif;
  --sans:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04);
  --shadow-lg:0 10px 40px rgba(15,23,42,.12);
  --shadow-3d:0 20px 60px -20px rgba(0,86,179,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);line-height:1.6;font-size:15px;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* =============== LOADING =============== */
.loading-screen{
  position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;transition:opacity .5s var(--ease),visibility .5s;
}
.loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.cube-loader{
  width:60px;height:60px;
  position:relative;transform-style:preserve-3d;
  animation:cubeSpin 3s linear infinite;
}
.cube-loader .face{
  position:absolute;width:60px;height:60px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  opacity:.85;
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 0 30px rgba(0,86,179,.4);
}
.cube-loader .face:nth-child(1){transform:translateZ(30px)}
.cube-loader .face:nth-child(2){transform:rotateY(180deg) translateZ(30px)}
.cube-loader .face:nth-child(3){transform:rotateY(90deg) translateZ(30px)}
.cube-loader .face:nth-child(4){transform:rotateY(-90deg) translateZ(30px)}
.cube-loader .face:nth-child(5){transform:rotateX(90deg) translateZ(30px)}
.cube-loader .face:nth-child(6){transform:rotateX(-90deg) translateZ(30px)}
@keyframes cubeSpin{
  0%{transform:rotateX(0) rotateY(0)}
  100%{transform:rotateX(360deg) rotateY(360deg)}
}
.loading-text{
  font-size:14px;color:var(--text-dim);letter-spacing:.5px;
  animation:fadePulse 1.5s ease-in-out infinite;
}
@keyframes fadePulse{0%,100%{opacity:.5}50%{opacity:1}}

.error-box{
  max-width:520px;margin:20vh auto;padding:32px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;text-align:center;box-shadow:var(--shadow-lg);
}
.error-box h3{color:#dc2626;font-family:var(--serif);font-size:22px;margin-bottom:12px}
.error-box p{color:var(--text-dim);line-height:1.7;margin-bottom:8px}
.error-box code{background:var(--bg-2);padding:3px 8px;border-radius:5px;color:var(--accent);font-size:13px;font-family:monospace}

/* =============== LAYOUT =============== */
.app{display:grid;grid-template-columns:320px 1fr;height:100vh}

/* =============== SIDEBAR =============== */
.sidebar{
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  box-shadow:2px 0 20px rgba(15,23,42,.03);
}
.sidebar::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--truoc));
  background-size:200% 100%;animation:gradientShift 4s ease infinite;
}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.brand{padding:26px 22px 20px;border-bottom:1px solid var(--border)}
.brand h1{
  font-family:var(--serif);font-size:22px;font-weight:600;
  color:var(--accent);letter-spacing:-.3px;
  display:flex;align-items:center;gap:10px;
}
.brand h1 .mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-size:15px;font-weight:700;font-family:var(--sans);
  box-shadow:0 4px 14px rgba(0,86,179,.3);
  transform-style:preserve-3d;
  transition:transform .5s var(--ease-out);
}
.brand h1:hover .mark{transform:rotateY(180deg) scale(1.08)}
.brand p{font-size:11.5px;color:var(--text-mute);margin-top:6px;letter-spacing:.5px;text-transform:uppercase;font-weight:500}

.search-wrap{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg-2)}
.search{
  width:100%;background:var(--surface);
  border:1px solid var(--border-2);border-radius:10px;
  color:var(--text);padding:10px 14px 10px 38px;
  font-size:13.5px;font-family:var(--sans);outline:none;
  transition:all .25s var(--ease);
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3ccircle cx='11' cy='11' r='8'/%3e%3cpath d='m21 21-4.3-4.3'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:13px center;
}
.search:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(0,86,179,.1),0 4px 12px rgba(0,86,179,.08);
  transform:translateY(-1px);
}

.list{flex:1;overflow-y:auto;padding:10px 8px 24px}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
.list::-webkit-scrollbar-thumb:hover{background:var(--accent)}

.item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;text-align:left;background:transparent;border:none;
  color:var(--text-2);padding:11px 13px;border-radius:9px;
  cursor:pointer;font-family:var(--sans);font-size:13.5px;
  line-height:1.45;margin-bottom:2px;font-weight:400;
  transition:all .25s var(--ease-out);
  position:relative;overflow:hidden;
  transform:translateZ(0);
}
.item::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);
  transform:translateX(-100%) scaleY(0);
  transition:transform .3s var(--ease-out);
  transform-origin:center;
}
.item:hover{
  background:var(--bg-2);color:var(--text);
  transform:translateX(4px) translateZ(0);
  box-shadow:var(--shadow-sm);
}
.item:hover::before{transform:translateX(0) scaleY(.5)}
.item.active{
  background:var(--accent-soft);color:var(--accent);font-weight:500;
}
.item.active::before{transform:translateX(0) scaleY(.8)}
.item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:1}
.item .count{
  flex-shrink:0;font-size:10.5px;color:var(--text-mute);
  background:var(--bg-2);padding:2px 7px;border-radius:10px;
  min-width:24px;text-align:center;font-weight:500;
  transition:all .25s var(--ease);
  position:relative;z-index:1;
}
.item:hover .count{background:var(--border);color:var(--text-2)}
.item.active .count{color:#fff;background:var(--accent);transform:scale(1.05)}

/* =============== MAIN =============== */
.main{
  overflow-y:auto;padding:48px 64px 100px;background:var(--bg);
  position:relative;perspective:1200px;
}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px}
.main::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* Background decorative orbs */
.bg-decor{
  position:fixed;pointer-events:none;z-index:0;
  border-radius:50%;filter:blur(80px);opacity:.35;
}
.bg-decor.d1{width:400px;height:400px;background:radial-gradient(circle,#93c5fd,transparent 70%);top:-100px;right:15%;animation:float1 20s ease-in-out infinite}
.bg-decor.d2{width:500px;height:500px;background:radial-gradient(circle,#fcd34d,transparent 70%);bottom:-200px;left:-100px;animation:float2 25s ease-in-out infinite}
.bg-decor.d3{width:350px;height:350px;background:radial-gradient(circle,#6ee7b7,transparent 70%);top:40%;right:-100px;animation:float3 22s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,40px) scale(1.1)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-30px) scale(1.08)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,-40px) scale(.95)}}

/* =============== WELCOME =============== */
.welcome{
  max-width:740px;margin:8vh auto 0;text-align:center;
  padding:0 24px;position:relative;z-index:1;
  transform-style:preserve-3d;
}
.welcome .logo{
  font-family:var(--serif);font-size:56px;font-weight:600;
  letter-spacing:-1.5px;color:var(--text);margin-bottom:16px;
  line-height:1.05;
  animation:heroIn .8s var(--ease-out) both;
}
.welcome .logo em{
  font-style:normal;color:var(--accent);
  display:inline-block;
  transform-style:preserve-3d;
  animation:spin3d 6s ease-in-out infinite;
}
@keyframes spin3d{
  0%,100%{transform:rotateY(0) translateZ(0)}
  50%{transform:rotateY(360deg) translateZ(20px)}
}
@keyframes heroIn{
  from{opacity:0;transform:translateY(30px) scale(.9)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.welcome p.sub{
  color:var(--text-dim);font-size:16px;max-width:520px;
  margin:0 auto 48px;line-height:1.7;
  animation:heroIn .8s var(--ease-out) .1s both;
}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:24px;margin-top:44px;
  animation:heroIn .8s var(--ease-out) .2s both;
}
.stat{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:24px 16px;
  transition:all .4s var(--ease-out);
  transform-style:preserve-3d;
  transform:translateZ(0) rotateX(0);
  box-shadow:var(--shadow-sm);
  cursor:default;
  position:relative;overflow:hidden;
}
.stat::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transform:scaleX(0);transform-origin:left;
  transition:transform .4s var(--ease-out);
}
.stat:hover{
  transform:translateY(-6px) rotateX(4deg) rotateY(-4deg) translateZ(20px);
  box-shadow:0 20px 40px -10px rgba(0,86,179,.25);
  border-color:var(--accent);
}
.stat:hover::before{transform:scaleX(1)}
.stat .num{
  font-family:var(--serif);font-size:38px;color:var(--accent);
  font-weight:600;line-height:1;letter-spacing:-1px;
  transition:transform .4s var(--ease-out);
  display:inline-block;
}
.stat:hover .num{transform:scale(1.15)}
.stat .lbl{
  font-size:10.5px;color:var(--text-mute);text-transform:uppercase;
  letter-spacing:1.4px;margin-top:8px;font-weight:600;
}
.welcome .hint{
  margin-top:56px;color:var(--text-mute);font-size:12.5px;
  animation:heroIn .8s var(--ease-out) .3s both;
}
.welcome .hint kbd{
  background:var(--surface);border:1px solid var(--border-2);
  padding:3px 8px;border-radius:6px;font-family:var(--sans);
  color:var(--text-2);font-size:11.5px;font-weight:500;
  box-shadow:0 2px 0 var(--border-2),0 2px 6px rgba(15,23,42,.06);
  transition:all .2s var(--ease);
  display:inline-block;
}
.welcome .hint kbd:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 0 var(--border-2),0 6px 12px rgba(15,23,42,.1);
}

/* =============== ARTICLE =============== */
.article{max-width:820px;margin:0 auto;position:relative;z-index:1;transform-style:preserve-3d}
.article h2{
  font-family:var(--serif);font-size:36px;font-weight:600;
  line-height:1.25;letter-spacing:-.5px;margin-bottom:12px;
  color:var(--text);
  animation:cardIn .6s var(--ease-out) both;
}
.article .meta{
  display:flex;align-items:center;gap:12px;
  color:var(--text-mute);font-size:12.5px;
  margin-bottom:44px;padding-bottom:26px;
  border-bottom:1px solid var(--border);flex-wrap:wrap;
  animation:cardIn .6s var(--ease-out) .05s both;
}
.article .meta a{
  color:var(--text-mute);text-decoration:none;
  transition:color .2s;border-bottom:1px dashed transparent;
  position:relative;font-weight:500;
}
.article .meta a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.article .meta .dot{opacity:.4}

@keyframes cardIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* =============== SECTION =============== */
.section{margin-bottom:48px}
.section-head{
  display:flex;align-items:center;gap:12px;margin-bottom:20px;
  animation:cardIn .6s var(--ease-out) both;
}
.section-head .marker{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:16px;
  transform-style:preserve-3d;
  transition:transform .5s var(--ease-out);
  box-shadow:0 4px 14px rgba(0,0,0,.15);
}
.section-head:hover .marker{transform:rotateY(180deg) rotateX(-10deg)}
.s-truoc .marker{background:linear-gradient(135deg,var(--truoc),#f59e0b)}
.s-doc .marker{background:linear-gradient(135deg,var(--doc),#3b82f6)}
.s-sau .marker{background:linear-gradient(135deg,var(--sau),#10b981)}
.section-head .label{
  font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
}
.s-truoc .label{color:var(--truoc)}
.s-doc .label{color:var(--doc)}
.s-sau .label{color:var(--sau)}

/* =============== QA CARD — 3D HOVER =============== */
.qa{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:22px 26px;margin-bottom:12px;
  position:relative;box-shadow:var(--shadow-sm);
  transition:transform .4s var(--ease-out),box-shadow .4s var(--ease-out),border-color .3s;
  transform-style:preserve-3d;
  animation:cardIn .6s var(--ease-out) both;
  will-change:transform;
}
.qa:hover{
  border-color:var(--accent);
  box-shadow:var(--shadow-3d),0 0 0 1px rgba(0,86,179,.1);
  transform:translateY(-4px) rotateX(2deg) rotateY(-1deg) translateZ(10px);
}
.qa::before{
  content:"";position:absolute;left:0;top:16px;bottom:16px;
  width:3px;border-radius:0 3px 3px 0;
  background:var(--accent);opacity:0;
  transform:scaleY(0);transition:all .4s var(--ease-out);
}
.qa:hover::before{opacity:1;transform:scaleY(1)}

.qa .q{
  font-family:var(--serif);font-size:17px;font-weight:600;
  line-height:1.5;color:var(--text);margin-bottom:14px;
  padding-right:44px;position:relative;z-index:1;
}
.qa .q .num{
  display:inline-block;color:var(--accent);font-size:12px;
  margin-right:8px;font-family:var(--sans);font-weight:700;
  background:var(--accent-soft);padding:2px 8px;border-radius:6px;
  transition:all .3s var(--ease-out);
  transform-style:preserve-3d;
}
.qa:hover .q .num{
  background:var(--accent);color:#fff;
  transform:scale(1.08) rotateZ(-3deg);
}
.qa .a{
  color:var(--text-2);font-size:14.5px;line-height:1.8;
  white-space:pre-wrap;word-break:break-word;
}

/* =============== COPY BUTTON =============== */
.copy-btn{
  position:absolute;top:16px;right:16px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-mute);width:34px;height:34px;border-radius:9px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;opacity:0;transform:scale(.7) rotate(-30deg);
  transition:all .35s var(--ease-out);
  transform-style:preserve-3d;
}
.qa:hover .copy-btn{opacity:1;transform:scale(1) rotate(0deg)}
.copy-btn:hover{
  border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft);
  transform:scale(1.15) rotateY(180deg);
  box-shadow:0 4px 12px rgba(0,86,179,.2);
}
.copy-btn:active{transform:scale(.92)}
.copy-btn.done{
  border-color:var(--sau);color:var(--sau);background:var(--sau-bg);
  transform:scale(1.2);
  animation:popDone .4s var(--ease-out);
}
@keyframes popDone{
  0%{transform:scale(1)}
  50%{transform:scale(1.3)}
  100%{transform:scale(1.2)}
}

/* =============== MOBILE =============== */
.menu-toggle{
  display:none;position:fixed;top:16px;left:16px;z-index:100;
  width:44px;height:44px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--accent);cursor:pointer;
  align-items:center;justify-content:center;
  font-size:20px;box-shadow:var(--shadow);
  transition:all .25s var(--ease-out);
}
.menu-toggle:active{transform:scale(.9) rotate(-5deg)}
.backdrop{
  display:none;position:fixed;inset:0;
  background:rgba(15,23,42,.5);backdrop-filter:blur(4px);
  z-index:50;animation:fadeIn .25s var(--ease);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:300px;z-index:60;
    transform:translateX(-100%);transition:transform .35s var(--ease-out);
    box-shadow:var(--shadow-lg);
  }
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:flex}
  .backdrop.show{display:block}
  .main{padding:80px 20px 100px}
  .article h2{font-size:26px}
  .welcome .logo{font-size:36px}
  .stats{grid-template-columns:1fr;gap:12px}
  .stat{padding:16px}
  .stat .num{font-size:28px}
  .qa{padding:18px 20px}
  .qa .q{font-size:15.5px;padding-right:0}
  .copy-btn{position:static;opacity:1;transform:none;margin-top:12px}
}
</style>
</head>
<body>

<!-- Loading screen -->
<div class="loading-screen" id="loading">
  <div class="cube-loader">
    <div class="face"></div><div class="face"></div>
    <div class="face"></div><div class="face"></div>
    <div class="face"></div><div class="face"></div>
  </div>
  <div class="loading-text">Đang tải dữ liệu...</div>
</div>

<!-- Background orbs -->
<div class="bg-decor d1"></div>
<div class="bg-decor d2"></div>
<div class="bg-decor d3"></div>

<button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
<div class="backdrop" id="backdrop"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1><span class="mark">9</span>Soạn Văn</h1>
      <p>Tấn · Kết nối tri thức</p>
    </div>
    <div class="search-wrap">
      <input class="search" id="search" type="text" placeholder="Tìm bài, câu hỏi...">
    </div>
    <div class="list" id="list"></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
(function(){
  const DATA_FILE = 'soan-van-9-final.json';
  const $loading = document.getElementById('loading');
  const $list = document.getElementById('list');
  const $main = document.getElementById('main');
  const $search = document.getElementById('search');
  const $menuToggle = document.getElementById('menuToggle');
  const $backdrop = document.getElementById('backdrop');
  const $sidebar = document.getElementById('sidebar');

  const SECTION_LABEL = {truoc:"Trước khi đọc", doc:"Đọc văn bản", sau:"Sau khi đọc"};
  const SECTION_ORDER = ["truoc","doc","sau"];
  const SECTION_ICON = {truoc:"✎", doc:"◈", sau:"✓"};
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  let articles = [];

  function showError(msg){
    $loading.classList.add('hidden');
    $main.innerHTML = `<div class="error-box">
      <h3>Không tải được dữ liệu</h3>
      <p>${msg}</p>
      <p style="margin-top:18px">Kiểm tra:</p>
      <p>1. File <code>${DATA_FILE}</code> có nằm cùng thư mục với <code>index.html</code> không?</p>
      <p>2. Nếu mở bằng <code>file://</code>, trình duyệt có thể chặn fetch.</p>
      <p style="margin-top:16px">→ Dùng <b>Firefox</b> (mở là chạy) hoặc chạy local server:<br><code>python -m http.server 8080</code></p>
    </div>`;
  }

  function renderWelcome(){
    const totalQA = articles.reduce((s,b)=>s+b.total,0);
    $main.innerHTML = `<div class="welcome">
      <div class="logo">Soạn Văn <em>9</em></div>
      <p class="sub">Tuyển tập đầy đủ lời giải cho các bài soạn Ngữ Văn lớp 9 — bộ Kết nối tri thức với cuộc sống.</p>
      <div class="stats">
        <div class="stat"><div class="num" data-target="${articles.length}">0</div><div class="lbl">Bài soạn</div></div>
        <div class="stat"><div class="num" data-target="${totalQA}">0</div><div class="lbl">Câu hỏi</div></div>
        <div class="stat"><div class="num" data-target="3">0</div><div class="lbl">Phần chính</div></div>
      </div>
      <div class="hint">Nhấn <kbd>/</kbd> để focus tìm kiếm · Hover vào câu hỏi để copy</div>
    </div>`;
    // Counter animation
    document.querySelectorAll('.stat .num').forEach(el=>{
      const target = parseInt(el.dataset.target,10);
      const dur = 1200, start = performance.now();
      const tick = (now)=>{
        const p = Math.min((now-start)/dur, 1);
        const ease = 1 - Math.pow(1-p, 3);
        el.textContent = Math.round(target*ease);
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  function renderList(filter=""){
    const q = filter.trim().toLowerCase();
    const items = articles.map((b,i)=>{
      if (!q) return {b,i};
      const hay = (b.title+" "+b.fullTitle+" "+b.qa.map(x=>(x.question||x.heading||"")+" "+(x.answer||"")).join(" ")).toLowerCase();
      return hay.includes(q) ? {b,i} : null;
    }).filter(Boolean);
    if (!items.length){
      $list.innerHTML = `<div style="padding:32px 16px;text-align:center;color:var(--text-mute);font-size:13px">Không tìm thấy bài nào</div>`;
      return;
    }
    $list.innerHTML = items.map(({b,i},idx)=>
      `<button class="item" data-idx="${i}">
        <span class="title">${esc(b.title)}</span>
        <span class="count">${b.total}</span>
      </button>`
    ).join('');
    $list.querySelectorAll('.item').forEach(el=>{
      el.addEventListener('click',()=>{
        openArticle(parseInt(el.dataset.idx,10));
        if (window.innerWidth<=860) closeSidebar();
      });
    });
  }

  function renderQA(x, idx){
    const head = x.section==="doc"
      ? `<div class="q">${x.num?`<span class="num">${x.num}</span>`:''}${esc(x.heading||'')}</div>`
      : `<div class="q">${x.num?`<span class="num">Câu ${x.num}</span>`:''}${esc(x.question||'')}</div>`;
    return `<div class="qa"><button class="copy-btn" data-copy="${idx}" title="Copy">⧉</button>${head}<div class="a">${esc(x.answer||'')}</div></div>`;
  }

  function openArticle(i){
    const a = articles[i]; if (!a) return;
    const groups = {truoc:[],doc:[],sau:[]};
    a.qa.forEach(x=>{ if(groups[x.section]) groups[x.section].push(x); });

    let html = `<div class="article">
      <h2>${esc(a.title)}</h2>
      <div class="meta">
        <span>${a.total} câu hỏi</span>
        <span class="dot">•</span>
        <a href="${esc(a.url)}" target="_blank" rel="noopener">Nguồn: vietjack.com ↗</a>
      </div>`;

    const store = [];
    let gi = 0;
    SECTION_ORDER.forEach(sec=>{
      if (!groups[sec].length) return;
      html += `<section class="section s-${sec}">
        <div class="section-head">
          <div class="marker">${SECTION_ICON[sec]}</div>
          <div class="label">${SECTION_LABEL[sec]}</div>
        </div>`;
      groups[sec].forEach(x=>{
        html += renderQA(x, gi++);
        store.push(x);
      });
      html += `</section>`;
    });
    html += `</div>`;
    $main.innerHTML = html;
    $main.scrollTop = 0;

    document.querySelectorAll('.item').forEach(el=>el.classList.toggle('active', parseInt(el.dataset.idx,10)===i));

    $main.querySelectorAll('.copy-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const x = store[parseInt(btn.dataset.copy,10)];
        const txt = ((x.question||x.heading||'') + "\n\n" + (x.answer||'')).trim();
        const done = ()=>{ btn.classList.add('done'); btn.textContent = "✓"; setTimeout(()=>{btn.classList.remove('done');btn.textContent="⧉";},1300); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>fb(txt,done));
        else fb(txt, done);
      });
    });
    try{ localStorage.setItem('sv9_last', String(i)); }catch(e){}
  }
  function fb(t,cb){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb&&cb();}catch(e){}document.body.removeChild(ta);}
  function closeSidebar(){$sidebar.classList.remove('open');$backdrop.classList.remove('show');}

  // 3D tilt effect on QA cards
  function attach3DTilt(){
    $main.querySelectorAll('.qa').forEach(card=>{
      card.addEventListener('mousemove', (e)=>{
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const rotY = ((x - cx) / cx) * 4;
        const rotX = -((y - cy) / cy) * 4;
        card.style.transform = `translateY(-4px) translateZ(10px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      });
      card.addEventListener('mouseleave', ()=>{
        card.style.transform = '';
      });
    });
  }

  const _openArticle = openArticle;
  openArticle = function(i){
    _openArticle(i);
    requestAnimationFrame(()=>attach3DTilt());
  };

  $search.addEventListener('input', ()=>renderList($search.value));
  $menuToggle.addEventListener('click', ()=>{$sidebar.classList.toggle('open');$backdrop.classList.toggle('show');});
  $backdrop.addEventListener('click', closeSidebar);
  document.addEventListener('keydown', e=>{
    if (e.key === '/' && document.activeElement !== $search){ e.preventDefault(); $search.focus(); }
    if (e.key === 'Escape'){ $search.blur(); closeSidebar(); }
  });

  // Load data
  fetch(DATA_FILE)
    .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data => {
      articles = data;
      renderWelcome();
      renderList("");
      $loading.classList.add('hidden');
      try{
        const last = localStorage.getItem('sv9_last');
        if (last !== null && articles[parseInt(last,10)]) openArticle(parseInt(last,10));
      }catch(e){}
    })
    .catch(err => {
      console.error(err);
      showError('Lỗi: ' + err.message);
    });
})();
</script>

</body>
</html>
