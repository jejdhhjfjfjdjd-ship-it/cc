<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soạn Văn 9 — Tấn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1c;
  --bg-2:#0f172a;
  --surface:rgba(255,255,255,.04);
  --surface-solid:#141b2d;
  --border:rgba(255,255,255,.08);
  --border-2:rgba(255,255,255,.14);
  --text:#f1f5f9;
  --text-2:#cbd5e1;
  --text-dim:#94a3b8;
  --text-mute:#64748b;
  --accent:#38bdf8;
  --accent-2:#818cf8;
  --accent-3:#c084fc;
  --accent-glow:rgba(56,189,248,.4);
  --truoc:#fbbf24;
  --truoc-glow:rgba(251,191,36,.4);
  --doc:#60a5fa;
  --doc-glow:rgba(96,165,250,.4);
  --sau:#34d399;
  --sau-glow:rgba(52,211,153,.4);
  --serif:'Lora','Georgia',serif;
  --sans:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);line-height:1.6;font-size:15px;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  perspective:1500px;
}

/* =============== DEEP SPACE BACKGROUND =============== */
.space{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(ellipse at top,#1e1b4b 0%,#0a0f1c 50%,#050810 100%);
}
.stars,.stars-2,.stars-3{
  position:absolute;inset:-50%;
  background-image:
    radial-gradient(1px 1px at 20% 30%,#fff,transparent),
    radial-gradient(1px 1px at 60% 70%,#fff,transparent),
    radial-gradient(2px 2px at 50% 50%,#fff,transparent),
    radial-gradient(1px 1px at 80% 10%,#fff,transparent),
    radial-gradient(1px 1px at 90% 60%,#fff,transparent),
    radial-gradient(1px 1px at 33% 80%,#fff,transparent),
    radial-gradient(1px 1px at 15% 90%,#fff,transparent),
    radial-gradient(2px 2px at 70% 20%,#fff,transparent);
  background-size:200px 200px;
  opacity:.4;
}
.stars{animation:starDrift 60s linear infinite}
.stars-2{background-size:150px 150px;opacity:.25;animation:starDrift 90s linear infinite reverse}
.stars-3{background-size:100px 100px;opacity:.15;animation:starDrift 120s linear infinite}
@keyframes starDrift{
  from{transform:translate(0,0)}
  to{transform:translate(-200px,-200px)}
}

.orb{
  position:absolute;border-radius:50%;
  filter:blur(80px);opacity:.5;
  will-change:transform;
}
.orb.o1{
  width:500px;height:500px;
  background:radial-gradient(circle,#38bdf8,transparent 70%);
  top:-150px;left:-100px;
  animation:orbFloat 25s ease-in-out infinite;
}
.orb.o2{
  width:600px;height:600px;
  background:radial-gradient(circle,#a855f7,transparent 70%);
  bottom:-200px;right:-100px;
  animation:orbFloat 30s ease-in-out infinite reverse;
}
.orb.o3{
  width:400px;height:400px;
  background:radial-gradient(circle,#ec4899,transparent 70%);
  top:40%;left:40%;opacity:.35;
  animation:orbFloat 20s ease-in-out infinite;
}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(60px,-80px) scale(1.15)}
  66%{transform:translate(-50px,50px) scale(.9)}
}

.grid-floor{
  position:absolute;bottom:0;left:-50%;right:-50%;height:50%;
  background-image:
    linear-gradient(rgba(56,189,248,.15) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,189,248,.15) 1px,transparent 1px);
  background-size:60px 60px;
  transform:perspective(500px) rotateX(60deg);
  transform-origin:bottom;
  mask-image:linear-gradient(to top,#000,transparent 80%);
  -webkit-mask-image:linear-gradient(to top,#000,transparent 80%);
  animation:gridMove 20s linear infinite;
}
@keyframes gridMove{
  from{background-position:0 0}
  to{background-position:60px 60px}
}

/* =============== LOADING =============== */
.loading-screen{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:32px;background:#0a0f1c;
  transition:opacity .6s var(--ease),visibility .6s;
}
.loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.cube-loader{
  width:80px;height:80px;position:relative;
  transform-style:preserve-3d;
  animation:cubeSpin 4s linear infinite;
}
.cube-loader .face{
  position:absolute;width:80px;height:80px;
  background:linear-gradient(135deg,rgba(56,189,248,.9),rgba(129,140,248,.9));
  border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 0 30px rgba(255,255,255,.2),0 0 40px rgba(56,189,248,.5);
  border-radius:8px;
}
.cube-loader .face:nth-child(1){transform:translateZ(40px)}
.cube-loader .face:nth-child(2){transform:rotateY(180deg) translateZ(40px)}
.cube-loader .face:nth-child(3){transform:rotateY(90deg) translateZ(40px)}
.cube-loader .face:nth-child(4){transform:rotateY(-90deg) translateZ(40px)}
.cube-loader .face:nth-child(5){transform:rotateX(90deg) translateZ(40px)}
.cube-loader .face:nth-child(6){transform:rotateX(-90deg) translateZ(40px)}
@keyframes cubeSpin{
  from{transform:rotateX(0) rotateY(0)}
  to{transform:rotateX(360deg) rotateY(360deg)}
}
.loading-text{
  color:var(--text-dim);font-size:13.5px;
  letter-spacing:2px;text-transform:uppercase;font-weight:500;
  animation:fadePulse 1.5s ease-in-out infinite;
}
@keyframes fadePulse{0%,100%{opacity:.4}50%{opacity:1}}

/* =============== ERROR =============== */
.error-box{
  max-width:520px;margin:18vh auto;padding:36px;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border-2);border-radius:20px;
  text-align:center;position:relative;z-index:1;
}
.error-box h3{color:#f87171;font-family:var(--serif);font-size:22px;margin-bottom:12px}
.error-box p{color:var(--text-dim);line-height:1.7;margin-bottom:8px}
.error-box code{background:rgba(0,0,0,.3);padding:3px 8px;border-radius:5px;color:var(--accent);font-size:13px;font-family:monospace}

/* =============== APP LAYOUT =============== */
.app{
  position:relative;z-index:10;
  display:grid;grid-template-columns:340px 1fr;
  height:100vh;perspective:2000px;
}

/* =============== SIDEBAR =============== */
.sidebar{
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-right:1px solid var(--border-2);
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;
  transform-style:preserve-3d;
  box-shadow:
    0 0 60px rgba(56,189,248,.15),
    inset -1px 0 0 rgba(255,255,255,.05);
}
.sidebar::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),var(--accent-3),transparent);
  background-size:200% 100%;
  animation:gradientFlow 5s linear infinite;
  box-shadow:0 0 20px var(--accent-glow);
}
@keyframes gradientFlow{
  from{background-position:0% 50%}
  to{background-position:200% 50%}
}

.brand{padding:28px 24px 22px;border-bottom:1px solid var(--border)}
.brand h1{
  font-family:var(--serif);font-size:23px;font-weight:700;
  letter-spacing:-.3px;line-height:1.2;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(120deg,#f1f5f9,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand h1 .mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-size:16px;font-weight:800;font-family:var(--sans);
  box-shadow:
    0 0 30px var(--accent-glow),
    inset 0 1px 0 rgba(255,255,255,.3),
    inset 0 -2px 8px rgba(0,0,0,.3);
  transform-style:preserve-3d;
  transition:transform .8s var(--ease-spring);
  position:relative;
}
.brand h1 .mark::after{
  content:"";position:absolute;inset:0;border-radius:11px;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);
  background-size:200% 100%;opacity:0;
  transition:opacity .3s;
}
.brand h1:hover .mark{
  transform:rotateY(360deg) rotateX(-15deg) scale(1.1);
  animation:markShine .8s ease;
}
.brand h1:hover .mark::after{opacity:1;animation:markShine .8s ease}
@keyframes markShine{
  from{background-position:-100% 0}
  to{background-position:200% 0}
}
.brand p{
  font-size:11.5px;color:var(--text-mute);margin-top:6px;
  letter-spacing:1px;text-transform:uppercase;font-weight:500;
}

.search-wrap{padding:16px 18px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.15)}
.search{
  width:100%;background:rgba(255,255,255,.04);
  border:1px solid var(--border-2);border-radius:11px;
  color:var(--text);padding:11px 14px 11px 40px;
  font-size:13.5px;font-family:var(--sans);outline:none;
  transition:all .3s var(--ease);
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3ccircle cx='11' cy='11' r='8'/%3e%3cpath d='m21 21-4.3-4.3'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:14px center;
}
.search::placeholder{color:var(--text-mute)}
.search:focus{
  border-color:var(--accent);
  background:rgba(56,189,248,.08);
  box-shadow:0 0 0 4px rgba(56,189,248,.15),0 0 30px rgba(56,189,248,.2);
  transform:translateY(-1px);
}

.list{flex:1;overflow-y:auto;padding:12px 10px 24px;perspective:800px}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
.list::-webkit-scrollbar-thumb:hover{background:var(--accent)}

.item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;text-align:left;background:transparent;border:none;
  color:var(--text-2);padding:12px 14px;border-radius:10px;
  cursor:pointer;font-family:var(--sans);font-size:13.5px;
  line-height:1.45;margin-bottom:3px;font-weight:400;
  transition:all .4s var(--ease-out);
  position:relative;overflow:hidden;
  transform-style:preserve-3d;
}
.item::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 30%,rgba(56,189,248,.15),transparent 70%);
  transform:translateX(-100%);
  transition:transform .6s var(--ease-out);
  pointer-events:none;
}
.item:hover{
  background:rgba(56,189,248,.08);
  color:var(--text);
  transform:translateX(6px) translateZ(20px);
  box-shadow:
    0 8px 20px rgba(0,0,0,.3),
    0 0 20px rgba(56,189,248,.15),
    inset 0 1px 0 rgba(255,255,255,.08);
}
.item:hover::after{transform:translateX(0)}
.item.active{
  background:linear-gradient(135deg,rgba(56,189,248,.2),rgba(129,140,248,.15));
  color:#fff;font-weight:500;
  box-shadow:
    0 0 0 1px rgba(56,189,248,.4),
    0 8px 24px rgba(56,189,248,.2),
    inset 0 1px 0 rgba(255,255,255,.1);
}
.item.active::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;
  width:3px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
  box-shadow:0 0 12px var(--accent-glow);
}
.item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:1}
.item .count{
  flex-shrink:0;font-size:10.5px;color:var(--text-mute);
  background:rgba(0,0,0,.3);padding:2px 8px;border-radius:10px;
  min-width:26px;text-align:center;font-weight:600;
  transition:all .3s var(--ease);
  position:relative;z-index:1;
}
.item:hover .count{background:rgba(56,189,248,.2);color:var(--accent)}
.item.active .count{
  color:#0a0f1c;background:var(--accent);
  box-shadow:0 0 12px var(--accent-glow);
}

/* =============== MAIN =============== */
.main{
  overflow-y:auto;padding:52px 72px 120px;
  position:relative;transform-style:preserve-3d;
}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px}
.main::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* =============== WELCOME =============== */
.welcome{
  max-width:820px;margin:6vh auto 0;text-align:center;
  padding:0 24px;transform-style:preserve-3d;
  animation:heroIn 1s var(--ease-out) both;
}
@keyframes heroIn{
  from{opacity:0;transform:translateY(60px) rotateX(20deg)}
  to{opacity:1;transform:translateY(0) rotateX(0)}
}

.welcome .logo{
  font-family:var(--serif);font-size:72px;font-weight:700;
  letter-spacing:-2px;line-height:1;
  margin-bottom:20px;
  display:inline-block;
  transform-style:preserve-3d;
  position:relative;
}
.welcome .logo .word{
  background:linear-gradient(120deg,#fff,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 60px rgba(56,189,248,.3);
}
.welcome .logo em{
  font-style:normal;
  display:inline-block;
  color:var(--accent);
  transform-style:preserve-3d;
  animation:spin3d 8s ease-in-out infinite;
  text-shadow:
    0 0 20px var(--accent-glow),
    0 0 40px var(--accent-glow);
}
@keyframes spin3d{
  0%,100%{transform:rotateY(0) translateZ(0)}
  50%{transform:rotateY(360deg) translateZ(40px)}
}
.welcome p.sub{
  color:var(--text-dim);font-size:16px;max-width:560px;
  margin:0 auto 56px;line-height:1.75;
}

.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:20px;margin-top:44px;
  transform-style:preserve-3d;
}
.stat{
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border-2);border-radius:18px;
  padding:26px 16px;position:relative;overflow:hidden;
  transition:all .6s var(--ease-out);
  transform-style:preserve-3d;
  cursor:default;
}
.stat::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 40%,rgba(56,189,248,.2) 50%,transparent 60%);
  background-size:300% 300%;
  opacity:0;transition:opacity .5s;
  pointer-events:none;
}
.stat:hover{
  transform:translateY(-12px) rotateX(8deg) rotateY(-6deg) translateZ(40px);
  border-color:var(--accent);
  box-shadow:
    0 30px 60px -15px rgba(56,189,248,.5),
    0 0 40px rgba(56,189,248,.2),
    inset 0 1px 0 rgba(255,255,255,.15);
}
.stat:hover::before{opacity:1;animation:shine 1.5s}
@keyframes shine{
  0%{background-position:100% 100%}
  100%{background-position:0 0}
}
.stat .num{
  font-family:var(--serif);font-size:44px;font-weight:700;
  color:var(--accent);line-height:1;letter-spacing:-1.5px;
  transition:all .5s var(--ease-spring);
  display:inline-block;
  text-shadow:0 0 20px var(--accent-glow);
}
.stat:hover .num{transform:scale(1.25) translateZ(30px);color:#fff}
.stat .lbl{
  font-size:11px;color:var(--text-mute);text-transform:uppercase;
  letter-spacing:1.5px;margin-top:10px;font-weight:600;
}

.welcome .hint{
  margin-top:64px;color:var(--text-mute);font-size:12.5px;
}
.welcome .hint kbd{
  background:rgba(255,255,255,.06);
  border:1px solid var(--border-2);
  padding:4px 9px;border-radius:6px;font-family:var(--sans);
  color:var(--text-2);font-size:11.5px;font-weight:600;
  box-shadow:0 2px 0 rgba(0,0,0,.3),0 0 12px rgba(56,189,248,.15);
  display:inline-block;
  transition:all .3s var(--ease-spring);
}
.welcome .hint kbd:hover{
  transform:translateY(-3px) rotate(-2deg);
  box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 20px rgba(56,189,248,.3);
}

/* =============== ARTICLE =============== */
.article{
  max-width:840px;margin:0 auto;
  transform-style:preserve-3d;
  animation:articleIn .8s var(--ease-out) both;
}
@keyframes articleIn{
  from{opacity:0;transform:translateY(30px) rotateX(10deg);transform-origin:top}
  to{opacity:1;transform:translateY(0) rotateX(0);transform-origin:top}
}
.article h2{
  font-family:var(--serif);font-size:40px;font-weight:700;
  line-height:1.22;letter-spacing:-.8px;margin-bottom:14px;
  background:linear-gradient(120deg,#fff 30%,var(--accent) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(56,189,248,.2);
}
.article .meta{
  display:flex;align-items:center;gap:14px;
  color:var(--text-mute);font-size:12.5px;
  margin-bottom:48px;padding-bottom:28px;
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.article .meta a{
  color:var(--text-dim);text-decoration:none;
  transition:all .3s;font-weight:500;
  border-bottom:1px dashed transparent;
  display:inline-flex;align-items:center;gap:4px;
}
.article .meta a:hover{
  color:var(--accent);border-bottom-color:var(--accent);
  transform:translateX(2px);
}
.article .meta .dot{opacity:.4}

/* =============== SECTION =============== */
.section{margin-bottom:56px;transform-style:preserve-3d}
.section-head{
  display:flex;align-items:center;gap:14px;margin-bottom:24px;
  transform-style:preserve-3d;
}
.section-head .marker{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:18px;
  transform-style:preserve-3d;
  transition:transform .6s var(--ease-spring);
  position:relative;
  box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);
}
.section-head .marker::before{
  content:"";position:absolute;inset:-4px;border-radius:14px;
  background:inherit;opacity:.4;filter:blur(12px);z-index:-1;
}
.s-truoc .marker{background:linear-gradient(135deg,var(--truoc),#f59e0b)}
.s-doc .marker{background:linear-gradient(135deg,var(--doc),#3b82f6)}
.s-sau .marker{background:linear-gradient(135deg,var(--sau),#10b981)}
.section-head:hover .marker{
  transform:rotateY(360deg) rotateX(-10deg) scale(1.1);
}
.section-head .label{
  font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
}
.s-truoc .label{color:var(--truoc);text-shadow:0 0 20px var(--truoc-glow)}
.s-doc .label{color:var(--doc);text-shadow:0 0 20px var(--doc-glow)}
.s-sau .label{color:var(--sau);text-shadow:0 0 20px var(--sau-glow)}

/* =============== QA CARD — 3D HEAVY =============== */
.qa{
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border-2);
  border-radius:16px;padding:26px 30px;margin-bottom:16px;
  position:relative;
  transition:transform .5s var(--ease-out),box-shadow .5s var(--ease-out),border-color .3s,background .3s;
  transform-style:preserve-3d;
  will-change:transform;
  box-shadow:
    0 4px 16px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.06);
}
.qa::before{
  content:"";position:absolute;inset:0;border-radius:16px;
  background:linear-gradient(135deg,transparent 30%,rgba(56,189,248,.08),transparent 70%);
  background-size:300% 300%;
  opacity:0;transition:opacity .5s;
  pointer-events:none;
}
.qa:hover{
  border-color:var(--accent);
  background:rgba(56,189,248,.06);
  box-shadow:
    0 20px 50px -10px rgba(56,189,248,.4),
    0 0 60px rgba(56,189,248,.15),
    inset 0 1px 0 rgba(255,255,255,.15);
}
.qa:hover::before{opacity:1;animation:shine 2s}
.qa::after{
  content:"";position:absolute;left:0;top:20px;bottom:20px;
  width:3px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
  opacity:0;transform:scaleY(0);
  transition:all .5s var(--ease-out);
  box-shadow:0 0 20px var(--accent-glow);
}
.qa:hover::after{opacity:1;transform:scaleY(1)}

.qa .q{
  font-family:var(--serif);font-size:18px;font-weight:600;
  line-height:1.5;color:var(--text);margin-bottom:16px;
  padding-right:48px;position:relative;z-index:1;
  transform-style:preserve-3d;
}
.qa .q .num{
  display:inline-block;color:var(--accent);font-size:12px;
  margin-right:10px;font-family:var(--sans);font-weight:800;
  background:rgba(56,189,248,.15);padding:3px 10px;border-radius:8px;
  transition:all .4s var(--ease-spring);
  border:1px solid rgba(56,189,248,.2);
}
.qa:hover .q .num{
  background:var(--accent);color:#0a0f1c;
  transform:scale(1.15) rotateZ(-4deg) translateZ(20px);
  box-shadow:0 0 20px var(--accent-glow);
}
.qa .a{
  color:var(--text-2);font-size:14.5px;line-height:1.85;
  white-space:pre-wrap;word-break:break-word;
  position:relative;z-index:1;
}

/* =============== COPY BUTTON 3D =============== */
.copy-btn{
  position:absolute;top:20px;right:20px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border-2);
  color:var(--text-dim);
  width:38px;height:38px;border-radius:10px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;
  opacity:0;
  transform:scale(.7) rotateY(-90deg);
  transition:all .5s var(--ease-spring);
  transform-style:preserve-3d;
  z-index:2;
}
.qa:hover .copy-btn{opacity:1;transform:scale(1) rotateY(0)}
.copy-btn:hover{
  border-color:var(--accent);color:var(--accent);
  background:rgba(56,189,248,.15);
  transform:rotateY(360deg) scale(1.15);
  box-shadow:
    0 0 30px var(--accent-glow),
    inset 0 1px 0 rgba(255,255,255,.2);
}
.copy-btn:active{transform:scale(.9) rotateY(360deg)}
.copy-btn.done{
  border-color:var(--sau);color:var(--sau);
  background:rgba(52,211,153,.15);
  transform:scale(1.25);
  box-shadow:0 0 30px rgba(52,211,153,.5);
  animation:popDone .5s var(--ease-spring);
}
@keyframes popDone{
  0%{transform:scale(1)}
  50%{transform:scale(1.4) rotateZ(10deg)}
  100%{transform:scale(1.25)}
}

/* =============== MOBILE =============== */
.menu-toggle{
  display:none;position:fixed;top:16px;left:16px;z-index:100;
  width:46px;height:46px;border-radius:12px;
  background:rgba(15,23,42,.8);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border-2);
  color:var(--accent);cursor:pointer;
  align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  transition:all .3s var(--ease-spring);
}
.menu-toggle:active{transform:scale(.9) rotate(-8deg)}
.backdrop{
  display:none;position:fixed;inset:0;
  background:rgba(5,8,16,.7);backdrop-filter:blur(8px);
  z-index:50;animation:fadeIn .3s var(--ease);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:320px;z-index:60;
    transform:translateX(-100%);
    transition:transform .4s var(--ease-out);
  }
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:flex}
  .backdrop.show{display:block}
  .main{padding:80px 20px 100px}
  .article h2{font-size:28px}
  .welcome .logo{font-size:42px}
  .stats{grid-template-columns:1fr;gap:12px}
  .stat{padding:18px}
  .stat .num{font-size:32px}
  .qa{padding:20px 22px}
  .qa .q{font-size:15.5px;padding-right:0}
  .copy-btn{position:static;opacity:1;transform:none;margin-top:14px}
}
</style>
</head>
<body>

<div class="space">
  <div class="stars"></div>
  <div class="stars-2"></div>
  <div class="stars-3"></div>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="grid-floor"></div>
</div>

<div class="loading-screen" id="loading">
  <div class="cube-loader">
    <div class="face"></div><div class="face"></div>
    <div class="face"></div><div class="face"></div>
    <div class="face"></div><div class="face"></div>
  </div>
  <div class="loading-text">Đang tải dữ liệu</div>
</div>

<button class="menu-toggle" id="menuToggle">☰</button>
<div class="backdrop" id="backdrop"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1><span class="mark">9</span>Soạn Văn</h1>
      <p>Tấn · Kết nối tri thức</p>
    </div>
    <div class="search-wrap">
      <input class="search" id="search" type="text" placeholder="Tìm bài, câu hỏi...">
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
(function(){
  const DATA_FILE = 'soan-van-9-final.json';
  const $loading = document.getElementById('loading');
  const $list = document.getElementById('list');
  const $main = document.getElementById('main');
  const $search = document.getElementById('search');
  const $menuToggle = document.getElementById('menuToggle');
  const $backdrop = document.getElementById('backdrop');
  const $sidebar = document.getElementById('sidebar');

  const SECTION_LABEL = {truoc:"Trước khi đọc", doc:"Đọc văn bản", sau:"Sau khi đọc"};
  const SECTION_ORDER = ["truoc","doc","sau"];
  const SECTION_ICON = {truoc:"✎", doc:"◈", sau:"✓"};
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  let articles = [];

  function showError(msg){
    $loading.classList.add('hidden');
    $main.innerHTML = `<div class="error-box">
      <h3>Không tải được dữ liệu</h3>
      <p>${msg}</p>
      <p style="margin-top:18px">Kiểm tra:</p>
      <p>1. File <code>${DATA_FILE}</code> nằm cùng thư mục với <code>index.html</code>?</p>
      <p>2. Mở bằng <code>file://</code> có thể bị chặn.</p>
      <p style="margin-top:16px">→ Dùng <b>Firefox</b> hoặc chạy <code>python -m http.server 8080</code></p>
    </div>`;
  }

  function renderWelcome(){
    const totalQA = articles.reduce((s,b)=>s+b.total,0);
    $main.innerHTML = `<div class="welcome">
      <div class="logo"><span class="word">Soạn Văn </span><em>9</em></div>
      <p class="sub">Tuyển tập đầy đủ lời giải cho các bài soạn Ngữ Văn lớp 9 — bộ Kết nối tri thức với cuộc sống.</p>
      <div class="stats">
        <div class="stat"><div class="num" data-target="${articles.length}">0</div><div class="lbl">Bài soạn</div></div>
        <div class="stat"><div class="num" data-target="${totalQA}">0</div><div class="lbl">Câu hỏi</div></div>
        <div class="stat"><div class="num" data-target="3">0</div><div class="lbl">Phần chính</div></div>
      </div>
      <div class="hint">Nhấn <kbd>/</kbd> để focus tìm kiếm · Hover vào câu hỏi để copy</div>
    </div>`;
    document.querySelectorAll('.stat .num').forEach(el=>{
      const target = parseInt(el.dataset.target,10);
      const dur = 1400, start = performance.now();
      const tick = (now)=>{
        const p = Math.min((now-start)/dur, 1);
        const ease = 1 - Math.pow(1-p, 4);
        el.textContent = Math.round(target*ease);
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
    attachParallax();
  }

  // Parallax orbs + stars theo chuột
  function attachParallax(){
    const orbs = document.querySelectorAll('.orb');
    const stars = document.querySelectorAll('.stars, .stars-2, .stars-3');
    document.addEventListener('mousemove', e=>{
      const x = (e.clientX / window.innerWidth - .5);
      const y = (e.clientY / window.innerHeight - .5);
      orbs.forEach((orb,i)=>{
        const depth = (i+1) * 20;
        orb.style.transform = `translate(${x*depth}px,${y*depth}px)`;
      });
      stars.forEach((s,i)=>{
        const depth = (i+1) * 8;
        s.style.transform = `translate(${x*depth}px,${y*depth}px)`;
      });
    });
  }

  function renderList(filter=""){
    const q = filter.trim().toLowerCase();
    const items = articles.map((b,i)=>{
      if (!q) return {b,i};
      const hay = (b.title+" "+b.fullTitle+" "+b.qa.map(x=>(x.question||x.heading||"")+" "+(x.answer||"")).join(" ")).toLowerCase();
      return hay.includes(q) ? {b,i} : null;
    }).filter(Boolean);
    if (!items.length){
      $list.innerHTML = `<div style="padding:32px 16px;text-align:center;color:var(--text-mute);font-size:13px">Không tìm thấy bài nào</div>`;
      return;
    }
    $list.innerHTML = items.map(({b,i})=>
      `<button class="item" data-idx="${i}">
        <span class="title">${esc(b.title)}</span>
        <span class="count">${b.total}</span>
      </button>`
    ).join('');
    $list.querySelectorAll('.item').forEach(el=>{
      el.addEventListener('click',()=>{
        openArticle(parseInt(el.dataset.idx,10));
        if (window.innerWidth<=860) closeSidebar();
      });
    });
  }

  function renderQA(x, idx){
    const head = x.section==="doc"
      ? `<div class="q">${x.num?`<span class="num">${x.num}</span>`:''}${esc(x.heading||'')}</div>`
      : `<div class="q">${x.num?`<span class="num">Câu ${x.num}</span>`:''}${esc(x.question||'')}</div>`;
    return `<div class="qa"><button class="copy-btn" data-copy="${idx}" title="Copy">⧉</button>${head}<div class="a">${esc(x.answer||'')}</div></div>`;
  }

  function openArticle(i){
    const a = articles[i]; if (!a) return;
    const groups = {truoc:[],doc:[],sau:[]};
    a.qa.forEach(x=>{ if(groups[x.section]) groups[x.section].push(x); });

    let html = `<div class="article">
      <h2>${esc(a.title)}</h2>
      <div class="meta">
        <span>${a.total} câu hỏi</span>
        <span class="dot">•</span>
        <a href="${esc(a.url)}" target="_blank" rel="noopener">Nguồn: vietjack.com ↗</a>
      </div>`;

    const store = [];
    let gi = 0;
    SECTION_ORDER.forEach(sec=>{
      if (!groups[sec].length) return;
      html += `<section class="section s-${sec}">
        <div class="section-head">
          <div class="marker">${SECTION_ICON[sec]}</div>
          <div class="label">${SECTION_LABEL[sec]}</div>
        </div>`;
      groups[sec].forEach(x=>{
        html += renderQA(x, gi++);
        store.push(x);
      });
      html += `</section>`;
    });
    html += `</div>`;
    $main.innerHTML = html;
    $main.scrollTop = 0;

    document.querySelectorAll('.item').forEach(el=>el.classList.toggle('active', parseInt(el.dataset.idx,10)===i));

    $main.querySelectorAll('.copy-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const x = store[parseInt(btn.dataset.copy,10)];
        const txt = ((x.question||x.heading||'') + "\n\n" + (x.answer||'')).trim();
        const done = ()=>{ btn.classList.add('done'); btn.textContent = "✓"; setTimeout(()=>{btn.classList.remove('done');btn.textContent="⧉";},1400); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>fb(txt,done));
        else fb(txt, done);
      });
    });
    try{ localStorage.setItem('sv9_last', String(i)); }catch(e){}
    attach3DTilt();
  }
  function fb(t,cb){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb&&cb();}catch(e){}document.body.removeChild(ta);}
  function closeSidebar(){$sidebar.classList.remove('open');$backdrop.classList.remove('show');}

  // 3D tilt nặng theo chuột
  function attach3DTilt(){
    $main.querySelectorAll('.qa').forEach(card=>{
      let rect = null;
      card.addEventListener('mouseenter',()=>{ rect = card.getBoundingClientRect(); });
      card.addEventListener('mousemove',(e)=>{
        if (!rect) rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        const rotY = (x - .5) * 12;
        const rotX = -(y - .5) * 12;
        card.style.transform = `translateY(-6px) translateZ(20px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      });
      card.addEventListener('mouseleave',()=>{
        card.style.transform = '';
        rect = null;
      });
    });
  }

  $search.addEventListener('input', ()=>renderList($search.value));
  $menuToggle.addEventListener('click', ()=>{$sidebar.classList.toggle('open');$backdrop.classList.toggle('show');});
  $backdrop.addEventListener('click', closeSidebar);
  document.addEventListener('keydown', e=>{
    if (e.key === '/' && document.activeElement !== $search){ e.preventDefault(); $search.focus(); }
    if (e.key === 'Escape'){ $search.blur(); closeSidebar(); }
  });

  fetch(DATA_FILE)
    .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data => {
      articles = data;
      renderWelcome();
      renderList("");
      $loading.classList.add('hidden');
      try{
        const last = localStorage.getItem('sv9_last');
        if (last !== null && articles[parseInt(last,10)]) openArticle(parseInt(last,10));
      }catch(e){}
    })
    .catch(err => {
      console.error(err);
      showError('Lỗi: ' + err.message);
    });
})();
</script>

</body>
</html>
