            // ----- HÀM SPAM CHÍNH -----
            async function runSpam(phone, count) {
                if (running) {
                    addLog('⚠️ Đang chạy, vui lòng đợi hoặc nhấn Dừng', 'fail');
                    return;
                }
                if (!phone || phone.length < 9) {
                    addLog('❌ Số điện thoại không hợp lệ', 'fail');
                    return;
                }
                let total = parseInt(count) || 1;
                if (total < 1) total = 1;
                if (total > 20) total = 20;

                running = true;
                stopRequested = false;
                addLog(`🚀 Bắt đầu spam ${total} lượt cho ${phone}`, 'info');

                for (let i = 0; i < total; i++) {
                    if (stopRequested) break;
                    addLog(`--- Lượt ${i+1}/${total} ---`, 'info');

                    // Tạo mảng các promise từ danh sách hàm
                    const tasks = spamFunctions.map(fn => fn(phone));
                    // Chạy song song tối đa 10 luồng (giới hạn trình duyệt)
                    const chunkSize = 10;
                    let results = [];
                    for (let j = 0; j < tasks.length; j += chunkSize) {
                        if (stopRequested) break;
                        const chunk = tasks.slice(j, j + chunkSize);
                        const chunkResults = await Promise.allSettled(chunk);
                        chunkResults.forEach(res => {
                            if (res.status === 'fulfilled') {
                                const data = res.value;
                                if (data.status === 'OK') {
                                    addLog(`✅ ${data.name} -> Gửi thành công`, 'success');
                                } else {
                                    addLog(`❌ ${data.name} -> Thất bại`, 'fail');
                                }
                            } else {
                                addLog(`⚠️ Lỗi fetch: ${res.reason?.message || 'unknown'}`, 'fail');
                            }
                        });
                        // Delay nhẹ tránh quá tải
                        await new Promise(r => setTimeout(r, 300));
                    }

                    if (i < total - 1 && !stopRequested) {
                        addLog(`⏳ Chờ 3 giây trước lượt tiếp theo...`, 'info');
                        await new Promise(r => setTimeout(r, 3000));
                    }
                }

                running = false;
                if (stopRequested) {
                    addLog('⏹️ Đã dừng theo yêu cầu', 'fail');
                } else {
                    addLog('🏁 Hoàn thành tất cả lượt spam!', 'success');
                }
            }
