<!-- index.html - Giao diện cho TV360 API -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPAM SMS PRO - TV360</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #020408);
            font-family: 'Roboto', sans-serif;
            padding: 15px;
            color: #e0f0ff;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 20px 0 10px;
            border-bottom: 1px solid #00ffff22;
            margin-bottom: 20px;
        }
        .header i { font-size: 40px; color: #00ffff; text-shadow: 0 0 30px #00ffff55; }
        .header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 5px;
        }
        .header p { color: #8899bb; font-size: 13px; }
        .card {
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #00ffff22;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .card h3 {
            color: #00ffff;
            font-size: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h3 i { font-size: 18px; color: #ff00ff; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid #00ffff33;
            border-radius: 12px;
            color: #e0f0ff;
            font-size: 14px;
            outline: none;
            -webkit-appearance: none;
        }
        .input-group input:focus { border-color: #00ffff; box-shadow: 0 0 20px #00ffff22; }
        .input-group input::placeholder { color: #6688aa; }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00ccff, #0066ff);
            color: #fff;
            box-shadow: 0 0 20px #0066ff44;
        }
        .btn-primary:active { transform: scale(0.95); }
        .btn-success {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a0f1e;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff4466, #cc0033);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #00ffff44;
            color: #88ccdd;
        }
        .btn-block { width: 100%; }
        .btn-purple {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
        }
        .status-box {
            background: #0a1424cc;
            border-radius: 12px;
            padding: 12px 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.8;
            border-left: 3px solid #00ffff;
            margin-top: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .status-box::-webkit-scrollbar { width: 4px; }
        .status-box::-webkit-scrollbar-thumb { background: #00ffff66; border-radius: 10px; }
        .log-item { display: flex; gap: 8px; border-bottom: 1px solid #ffffff08; padding: 3px 0; }
        .log-item .time { color: #ff00ffaa; min-width: 65px; }
        .log-item .msg { color: #aaccdd; word-break: break-all; }
        .log-item .success { color: #00ff88; }
        .log-item .fail { color: #ff4466; }
        .log-item .info { color: #88ccff; }
        .row { display: flex; gap: 10px; }
        .row .btn { flex: 1; }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-green { background: #00ff8822; color: #00ff88; border: 1px solid #00ff8844; }
        .badge-pink { background: #ff00ff22; color: #ff00ff; border: 1px solid #ff00ff44; }
        .badge-blue { background: #00ffff22; color: #00ffff; border: 1px solid #00ffff44; }
        .count-badge {
            background: #00ffff22;
            color: #00ffff;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .footer {
            text-align: center;
            color: #445566;
            font-size: 11px;
            padding: 15px 0;
        }
        .footer i { color: #ff00ff; }
        .music-control {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 999;
            background: #0a1424dd;
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 10px 18px;
            border: 1px solid #00ffff44;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px #000000aa;
        }
        .music-control button {
            background: transparent;
            border: none;
            color: #00ffff;
            font-size: 22px;
            cursor: pointer;
            transition: 0.3s;
        }
        .music-control button:hover { color: #ff00ff; }
        .music-control span { color: #8899bb; font-size: 12px; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (max-width: 480px) {
            .input-group { flex-direction: column; }
            .row { flex-direction: column; }
            .music-control { bottom: 10px; right: 10px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="nhac_nen.mp3" type="audio/mpeg">
    </audio>

    <div class="music-control" id="musicControl">
        <button id="playBtn"><i class="fas fa-play"></i></button>
        <span>🎵 Cyber Beats</span>
    </div>

    <div class="container">

        <div class="header">
            <i class="fas fa-bolt"></i>
            <h1>SPAM SMS PRO</h1>
            <p><i class="fas fa-tv"></i> TV360 • <span class="badge badge-blue" id="apiCountDisplay">41 API</span></p>
        </div>

        <!-- Card chính -->
        <div class="card">
            <h3><i class="fas fa-phone-alt"></i> Nhập số điện thoại</h3>
            <div class="input-group">
                <input type="text" id="phoneInput" placeholder="VD: 0987654321" value="0978693644">
            </div>
            <div class="input-group">
                <input type="number" id="countInput" placeholder="Số lần spam" value="1" min="1" max="30">
            </div>
            <button class="btn btn-primary btn-block" id="startBtn">
                <i class="fas fa-bomb"></i> KÍCH HOẠT SPAM
            </button>
            <div class="row" style="margin-top:10px;">
                <button class="btn btn-outline" id="clearBtn"><i class="fas fa-trash-alt"></i> Xóa log</button>
                <button class="btn btn-danger" id="stopBtn"><i class="fas fa-stop-circle"></i> Dừng</button>
            </div>
        </div>

        <!-- Status -->
        <div class="card">
            <h3><i class="fas fa-list"></i> Log <span class="count-badge" id="logCount">0</span></h3>
            <div class="status-box" id="statusBox">
                <div class="log-item"><span class="time">[⚡]</span><span class="msg info">Sẵn sàng tấn công TV360...</span></div>
            </div>
        </div>

        <!-- Danh sách API -->
        <div class="card" style="border-color:#ff00ff44;">
            <h3><i class="fas fa-code"></i> API TV360 <span class="badge badge-pink" id="apiCount2">41</span></h3>
            <div style="font-size:11px;color:#8899bb;max-height:100px;overflow:auto;font-family:'Courier New',monospace;line-height:1.6;" id="apiList">
                Đang tải...
            </div>
        </div>

        <div class="footer">
            <i class="fas fa-code"></i> mod by Trong Tan • WormGPT bật
        </div>
    </div>

    <script>
        // ===== HÀM LOG =====
        const statusBox = document.getElementById('statusBox');
        const logCount = document.getElementById('logCount');
        let logCounter = 0;

        function addLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('vi-VN');
            const div = document.createElement('div');
            div.className = 'log-item';
            let cls = 'info';
            if (type === 'success') cls = 'success';
            else if (type === 'fail') cls = 'fail';
            div.innerHTML = `<span class="time">[${time}]</span><span class="msg ${cls}">${msg}</span>`;
            statusBox.appendChild(div);
            statusBox.scrollTop = statusBox.scrollHeight;
            logCounter++;
            logCount.textContent = logCounter;
            while (statusBox.children.length > 200) {
                statusBox.removeChild(statusBox.firstChild);
                logCounter--;
            }
        }

        // Gán global để spam.js dùng
        window.addLog = addLog;

        // ===== QUẢN LÝ NHẠC =====
        const audio = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        let isPlaying = false;

        document.addEventListener('click', function initAudio() {
            if (!isPlaying) {
                audio.play().catch(() => {});
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
            document.removeEventListener('click', initAudio);
        }, { once: true });

        playBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                audio.play().catch(() => {});
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
        });

        // ===== TẢI SPAM.JS =====
        const script = document.createElement('script');
        script.src = 'spam.js';
        script.onload = function() {
            addLog('✅ Đã tải ' + (window.spamFunctions ? window.spamFunctions.length : 0) + ' API TV360', 'success');
            // Hiển thị danh sách API
            const apiListDiv = document.getElementById('apiList');
            if (window.tv360Apis) {
                apiListDiv.innerHTML = window.tv360Apis.map((api, i) => 
                    `<div style="color:#88ccdd;">${i+1}. ${api.name}</div>`
                ).join('');
            }
            document.getElementById('apiCountDisplay').textContent = (window.tv360Apis ? window.tv360Apis.length : 0) + ' API';
            document.getElementById('apiCount2').textContent = window.tv360Apis ? window.tv360Apis.length : 0;
        };
        script.onerror = function() {
            addLog('❌ Không tải được spam.js', 'fail');
        };
        document.head.appendChild(script);

        // ===== SỰ KIỆN =====
        const phoneInput = document.getElementById('phoneInput');
        const countInput = document.getElementById('countInput');
        const startBtn = document.getElementById('startBtn');
        const clearBtn = document.getElementById('clearBtn');
        const stopBtn = document.getElementById('stopBtn');

        startBtn.addEventListener('click', function() {
            const phone = phoneInput.value.trim();
            const count = parseInt(countInput.value) || 1;
            if (typeof window.runSpam === 'function') {
                window.runSpam(phone, count);
            } else {
                addLog('❌ Chưa tải xong spam.js, vui lòng đợi', 'fail');
            }
        });

        clearBtn.addEventListener('click', function() {
            statusBox.innerHTML = '';
            logCounter = 0;
            logCount.textContent = '0';
            addLog('🗑️ Đã xóa log', 'info');
        });

        stopBtn.addEventListener('click', function() {
            window.stopRequested = true;
            window.running = false;
            addLog('⏹️ Dừng theo yêu cầu', 'fail');
        });

        // Enter để spam
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const phone = phoneInput.value.trim();
                const count = parseInt(countInput.value) || 1;
                if (typeof window.runSpam === 'function') {
                    window.runSpam(phone, count);
                }
            }
        });

        addLog('🔥 WormGPT sẵn sàng, chờ lệnh...', 'info');
    </script>
</body>
</html>
